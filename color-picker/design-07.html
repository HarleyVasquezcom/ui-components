<!-- Design 07: Dark Dropper / Gotero Oscuro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Dropper — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #09090b;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(28px, 6vw, 46px);
    background: #111114;
    border: 1px solid #27272a;
    border-radius: 16px;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.8vw, 2rem); color: #fafafa; font-weight: 800; }
  h1 span { color: #34d399; }
  .sub { margin: .4rem 0 1.8rem; color: #71717a; font-size: .93rem; }
  .top { display: flex; align-items: center; gap: 20px; }
  .big {
    width: 110px; height: 110px; flex: 0 0 auto;
    border-radius: 24px;
    border: 2px solid #27272a;
    transition: background .12s linear;
  }
  .read { flex: 1; }
  .read .lbl { display: block; margin: 0 0 8px; color: #a1a1aa; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .hexin {
    width: 100%;
    padding: 12px 14px;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 1.05rem;
    color: #34d399; background: #1c1c21;
    border: 1px solid #3f3f46; border-radius: 10px;
    outline: none;
  }
  .hexin:focus-visible { outline: 2px solid #34d399; outline-offset: 2px; }
  .lbl2 { display: block; margin: 24px 0 10px; color: #a1a1aa; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw {
    aspect-ratio: 1;
    border: 2px solid #27272a;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    transition: transform .12s ease;
  }
  .sw:hover { transform: translateY(-2px); }
  .sw:focus-visible { outline: 2px solid #34d399; outline-offset: 2px; }
  .sw.on { border-color: #34d399; box-shadow: 0 0 0 2px rgba(52, 211, 153, .3); }
  .sw.on::after { content: "✓"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.3rem; font-weight: 800; text-shadow: 0 1px 4px rgba(0, 0, 0, .9); }
  .hint { margin-top: 14px; color: #52525b; font-size: .8rem; }
  .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #27272a; color: #52525b; font-size: .78rem; }
  .credit a { color: #34d399; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Dark <span>Dropper</span></h1>
  <p class="sub">Neon hex on near-black / Hex neón sobre casi negro</p>
  <div class="top">
    <div class="big" data-testid="preview" style="background:#8B5CF6" aria-hidden="true"></div>
    <div class="read">
      <label class="lbl" data-testid="label" for="cp-dd-07-hex">Hex value</label>
      <input class="hexin" data-testid="hex-in" id="cp-dd-07-hex" type="text" value="#8B5CF6" spellcheck="false" maxlength="7">
      <p class="hint" data-testid="hex" style="margin:8px 0 0;color:#a1a1aa">#8B5CF6 — Violet</p>
    </div>
  </div>
  <span class="lbl2" id="cp-dd-07-label">Fast pick / Selección rápida</span>
  <div class="row" role="group" aria-labelledby="cp-dd-07-label">
    <button type="button" class="sw" data-testid="swatch" data-color="#8B5CF6" style="background:#8B5CF6" aria-label="Violet #8B5CF6" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#06B6D4" style="background:#06B6D4" aria-label="Cyan #06B6D4" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#F43F5E" style="background:#F43F5E" aria-label="Rose #F43F5E" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#FACC15" style="background:#FACC15" aria-label="Yellow #FACC15" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#22C55E" style="background:#22C55E" aria-label="Green #22C55E" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#FB923C" style="background:#FB923C" aria-label="Orange #FB923C" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#38BDF8" style="background:#38BDF8" aria-label="Sky #38BDF8" aria-pressed="false"></button>
    <button type="button" class="sw" data-testid="swatch" data-color="#E879F9" style="background:#E879F9" aria-label="Fuchsia #E879F9" aria-pressed="false"></button>
  </div>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const swatches = document.querySelectorAll('[data-testid="swatch"]');
  const hexOut = document.querySelector('[data-testid="hex"]');
  const preview = document.querySelector('[data-testid="preview"]');
  const hexIn = document.querySelector('[data-testid="hex-in"]');
  const NAMES = { '#8B5CF6': 'Violet', '#06B6D4': 'Cyan', '#F43F5E': 'Rose', '#FACC15': 'Yellow', '#22C55E': 'Green', '#FB923C': 'Orange', '#38BDF8': 'Sky', '#E879F9': 'Fuchsia' };
  let lastValid = '#8B5CF6';
  function applyHex(hex) {
    hex = String(hex).trim().toUpperCase();
    if (!/^#[0-9A-F]{6}$/.test(hex)) return false;
    preview.style.background = hex;
    lastValid = hex;
    hexOut.textContent = hex + ' — ' + (NAMES[hex] || 'Custom');
    swatches.forEach((s) => { const on = s.dataset.color.toUpperCase() === hex; s.classList.toggle('on', on); s.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    return true;
  }
  swatches.forEach((s) => s.addEventListener('click', () => { hexIn.value = s.dataset.color; applyHex(s.dataset.color); }));
  hexIn.addEventListener('input', () => { if (!applyHex(hexIn.value)) preview.style.background = lastValid; });
  hexIn.addEventListener('change', () => { hexIn.value = applyHex(hexIn.value) ? hexIn.value : lastValid; });
  applyHex('#8B5CF6');
</script>
</body>
</html>
