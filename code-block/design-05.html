<!-- Design 05: Code Block Gradient / Gradiente -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Block — Design 05</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#0d0f1a;color:#e0e7ff;overflow:hidden}.code{max-width:800px;width:100%;padding:40px 20px}.code pre{background:#161a2b;border:1px solid #3b4258;border-radius:6px;padding:20px;overflow:auto;font-family:"SF Mono",Menlo,monospace;font-size:.85rem;line-height:1.6;color:#e0e7ff;margin:0}.code .keyword{color:#c5c6c7;font-weight:600}.code .string{color:#a3e4d7}.code .comment{color:#64748b;font-style:italic}.code .number{color:#e9c062}.credit{margin-top:30px;padding:15px 0;border-top:1px solid #3b4258;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="code" data-testid="code-block" aria-label="Code block"><pre><span class="line"><span class="keyword">async</span> <span class="title">fetchData</span><span class="punctuation">(</span><span class="parameter">url</span><span class="punctuation">)</span> </span><span class="line">{</span></span><span class="line"><span class="keyword">try</span> </span><span class="line">{</span></span><span class="line"><span class="keyword">const</span> <span class="variable">response</span> <span class="operator">=</span> <span class="keyword">await</span> <span class="keyword">fetch</span><span class="punctuation">(</span><span class="parameter">url</span><span class="punctuation">)</span></span><span class="line"></span><span class="line"><span class="keyword">const</span> <span class="variable">data</span> <span class="operator">=</span> <span class="keyword">await</span> response<span class="punctuation">.</span><span class="function">json</span></span><span class="line"></span><span class="line"><span class="keyword">return</span> data</span><span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">}</span><span class="punctuation">}</span><span class="line"></pre></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const pre=document.querySelector('pre code');if(!pre)return;let c=pre.textContent;const kw=/\b(const|let|var|function|return|if|else|for|of|while|new|import|export|class|async|await|try|catch)\b/g;let out='',last=0,m;const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');while((m=kw.exec(c))){out+=esc(c.slice(last,m.index));out+='<span class="kw">'+m[0]+'</span>';last=m.index+m[0].length}out+=esc(c.slice(last));pre.innerHTML='<span class="line">'+(out||'&nbsp;')+'</span>'})();</script></body></html>
