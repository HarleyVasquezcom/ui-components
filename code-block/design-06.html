<!-- Design 06: Code Block Neo-Brutalist / Neo-Brutalista -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Block — Design 06</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Inter",system-ui,sans-serif;background:#f0f9ff;color:#0c4a6e;overflow:hidden}.code{max-width:800px;width:100%;padding:30px 20px;border:2px solid:#0891b3;border-radius:0}.code pre{background:#ffffff;border:none;padding:20px;overflow:auto;font-family:"SF Mono",Menlo,monospace;font-size:.9rem;line-height:1.6;color:#0c4a6e;margin:0}.code .keyword{color:#0891b3;font-weight:600}.code .string{color:#38bdf8}.code .comment{color:#0f766e;font-style:italic}.code .number{color:#f6e05e}.credit{margin-top:20px;padding:10px 0;border-top:2px solid:#0891b3;color:#0f172a;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="code" data-testid="code-block" aria-label="Code block"><pre data-testid="code"><span class="line"><span class="keyword">function</span> <span class="title">add</span><span class="punctuation">(</span><span class="parameter">a</span>, <span class="parameter">b</span><span class="punctuation">)</span> </span><span class="line">{</span></span><span class="line"><span class="keyword">return</span> a <span class="operator">+</span> b<span class="punctuation">;</span> </span><span class="line"></pre></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const pre=document.querySelector('pre code');if(!pre)return;let c=pre.textContent;const kw=/\b(const|let|var|function|return|if|else|for|of|while|new|import|export|class|async|await|try|catch)\b/g;let out='',last=0,m;const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');while((m=kw.exec(c))){out+=esc(c.slice(last,m.index));out+='<span class="kw">'+m[0]+'</span>';last=m.index+m[0].length}out+=esc(c.slice(last));pre.innerHTML='<span class="line">'+(out||'&nbsp;')+'</span>'})();</script></body></html>
