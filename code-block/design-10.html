<!-- Design 10: Code Block One Dark / One Dark -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Block — Design 10</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#23242f;color:#abb2bf;overflow:hidden}.code{max-width:800px;width:100%;padding:30px 20px;border:1px solid:#2d3339;border-radius:8px}.code pre{background:#23242f;border:none;padding:20px 0;overflow:auto;font-family:"SF Mono",Menlo,monospace;font-size:.85rem;line-height:1.6;color:#abb2bf;margin:0}.code .keyword{color:#c792cf;font-weight:600}.code .string{color:#a5d6e7}.code .comment{color:#5c6379;font-style:italic}.code .number{color:#class}.credit{margin-top:20px;padding:8px 0;border-top:1px solid:#2d3339;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="code" data-testid="code-block" aria-label="Code block"><pre><span class="line"><span class="keyword">def</span> <span class="title">hello</span><span class="punctuation">(</span><span class="parameter">name</span><span class="punctuation">)</span> </span><span class="line">{</span></span><span class="line"><span class="keyword">return</span> <span class="string">"Hello "</span> <span class="operator">+</span> name<span class="punctuation">.</span><span class="title">title</span><span class="punctuation">()</span></span><span class="line"></pre></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const pre=document.querySelector('pre code');if(!pre)return;let c=pre.textContent;const kw=/\b(const|let|var|function|return|if|else|for|of|while|new|import|export|class|async|await|try|catch)\b/g;let out='',last=0,m;const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');while((m=kw.exec(c))){out+=esc(c.slice(last,m.index));out+='<span class="kw">'+m[0]+'</span>';last=m.index+m[0].length}out+=esc(c.slice(last));pre.innerHTML='<span class="line">'+(out||'&nbsp;')+'</span>'})();</script></body></html>
