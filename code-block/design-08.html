<!-- Design 08: Code Block Solarized / Solarized -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Block — Design 08</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fdf6e3;color:#0f172a;overflow:hidden}.code{max-width:800px;width:100%;padding:30px 20px;border:1px solid:#928b3c;border-radius:8px}.code pre{background:#fff;border:none;padding:20px;overflow:auto;font-family:"SF Mono",Menlo,monospace;font-size:.85rem;line-height:1.6;color:#268bd2;margin:0}.code .keyword{color:#b58900;font-weight:600}.code .string{color:#268bd2}.code .comment{color:#657b71;font-style:italic}.code .number{color:#b58900}.credit{margin-top:20px;padding:8px 0;border-top:1px solid:#928b3c;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="code" data-testid="code-block" aria-label="Code block"><pre><span class="line"><span class="keyword">var</span> <span class="title">active</span> <span class="operator">=</span> <span class="number">true</span></span><span class="line"></span><span class="line"><span class="keyword">if</span> (active) { <span class="keyword">console</span><span class="punctuation">.</span><span class="function">log</span><span class="punctuation">(</span><span class="string">'Sistema activo'</span><span class="punctuation">)</span> } </span><span class="line"></pre></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const pre=document.querySelector('pre code');if(!pre)return;let c=pre.textContent;const kw=/\b(const|let|var|function|return|if|else|for|of|while|new|import|export|class|async|await|try|catch)\b/g;let out='',last=0,m;const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');while((m=kw.exec(c))){out+=esc(c.slice(last,m.index));out+='<span class="kw">'+m[0]+'</span>';last=m.index+m[0].length}out+=esc(c.slice(last));pre.innerHTML='<span class="line">'+(out||'&nbsp;')+'</span>'})();</script></body></html>
