<!-- Design 10: Media Player Mini / Mini -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Player — Design 10</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;overflow:hidden}.media-player{max-width:400px;margin:0 auto;padding:1rem;background:#fafafa;border-radius:6px}.player-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}.player-title{font-size:1rem;font-weight:600;color:#0f172a}.player-time{color:#64748b}.player-progress{max-width:100%;height:4px;background:#cbd5e1;border-radius:2px;margin:.25rem 0}.player-progress-filled{height:100%;background:#2563eb;width:0%;border-radius:2px;transition:width .1s}.player-controls{display:flex;gap:.25rem;margin-top:.25rem}.player-btn{background:transparent;border:none;border-radius:2px;padding:4px;color:#64748b;font-size:.75rem;cursor:pointer}.player-btn:hover{color:#0f172a}.credit{margin-top:20px;padding:4px 0;border-top:1px solid #e5e7eb;color:#64748b;font-size:.55rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="media-player" data-testid="media-player" aria-label="Media player"><div class="player-header"><h1 class="player-title">Título del Video</h1><span class="player-time">0:00</span></div><div class="player-progress"><div class="player-progress-filled" id="progress"></div></div><div class="player-controls"><button class="player-btn" id="prev" data-testid="play" data-testid="play">❰</button><button class="player-btn" id="play">▶</button><button class="player-btn" id="next">❱</button></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
<script>(()=>{const btn=document.querySelector('.player-btn,#play,[data-testid="play"]');const audio=document.querySelector('audio');const time=document.querySelector('.time');if(!btn)return;const setPlay=p=>{btn.classList.toggle('playing',p);btn.setAttribute('aria-label',p?'Pausa':'Reproducir')};btn.addEventListener('click',()=>{if(audio){if(audio.paused){audio.play();setPlay(true)}else{audio.pause();setPlay(false)}}else{setPlay(!btn.classList.contains('playing'))}});setPlay(false);if(audio&&time){audio.addEventListener('timeupdate',()=>{const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);time.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')})}})();</script>
