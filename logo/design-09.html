<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Logo — Design 09</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#1e293b;overflow:hidden}.logo{max-width:220px;margin:60px auto;text-align:center}.logo-circle{width:100px;height:100px;margin:0 auto 1.5rem;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff}.logo-text{font-size:1.75rem;font-weight:600;color:#fff}.logo-tag{color:#64748b;font-size:.75rem;margin-top:.5rem}.credit{margin-top:48px;padding:12px 0;border-top:1px solid #334155;color:#64748b;font-size:.75rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="logo-circle" data-testid="logo" aria-label="Brand logo">HV</div><div class="logo-text">HarleyVásquez</div><div class="logo-tag">Diseñador UI/UX</div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
