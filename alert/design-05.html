<!-- Design 05: Alert with Close Button / Alerta con botón de cierre -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 05</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;color:#0f172a;overflow:hidden}.alert{max-width:500px;width:100%;padding:24px 32px;border:1px solid #e5e7eb;border-radius:8px;background:#fff}.alert-title{font-size:1.25rem;font-weight:600;margin-bottom:8px}.alert-desc{font-size:.875rem;color:#64748b;margin-bottom:16px}.alert-icon{width:32px;height:32px;margin-right:12px;flex-shrink:0}.alert-close{position:absolute;top:12px;right:12px;width:32px;height:32px;background:transparent;border:none;cursor:pointer}.alert-close:focus{outline:2px solid #d1d5db}.alert-action{margin-top:16px;padding:8px 16px;background:#f3f4f6;border:none;border-radius:6px;color:#374151;font-weight:500;cursor:pointer}.credit{margin-top:24px;padding:12px 0;border-top:1px solid #e5e7eb;color:#64748b;font-size:.75rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><span class="alert-icon" aria-hidden="true">ℹ️</span><div class="alert-title">Información del sistema</div><div class="alert-desc">Los cambios se guardarán automáticamente. Cierre esta ventana cuando termine.</div><button class="alert-close" aria-label="Cerrar alerta"></button><button class="alert-action">Guardar cambios</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
