<!-- Design 03: Error Alert / Alerta de Error -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 03</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fee2e2;color:#991b1b;overflow:hidden}.alert{max-width:500px;width:100%;padding:24px 32px;border:1px solid #fca5a5;border-radius:8px;background:#fff}.alert-title{font-size:1.25rem;font-weight:600;color:#991b1b;margin-bottom:8px}.alert-desc{font-size:.875rem;color:#64748b;margin-bottom:16px}.alert-icon{width:32px;height:32px;margin-right:12px;flex-shrink:0;color:#991b1b}.alert-action{margin-top:16px;padding:8px 16px;background:#fca5a5;border:none;border-radius:6px;color:#991b1b;font-weight:500;cursor:pointer}.credit{margin-top:24px;padding:12px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:.75rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><span class="alert-icon">❌</span><div class="alert-title">Error de validación</div><div class="alert-desc">Por favor, corrige los errores señalados a continuación.</div><button class="alert-action">Reintentar</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
