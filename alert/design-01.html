<!-- Design 01: Info Alert / Alerta de Información -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 01</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f8fafc;color:#0f172a;overflow:hidden}.alert{max-width:500px;width:100%;padding:24px 32px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}.alert-title{font-size:1.25rem;font-weight:600;margin-bottom:8px}.alert-desc{font-size:.875rem;color:#64748b;margin-bottom:16px}.alert-icon{width:32px;height:32px;margin-right:12px;flex-shrink:0}.alert-action{margin-top:16px;padding:8px 16px;background:#e2e8f0;border:none;border-radius:6px;color:#0f172a;font-weight:500;cursor:pointer}.credit{margin-top:24px;padding:12px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:.75rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><span class="alert-icon" aria-hidden="true">ℹ️</span><div class="alert-title">Información del sistema</div><div class="alert-desc">El sistema ha sido actualizado correctamente. Se aplicarán los cambios al recargar la página.</div><button class="alert-action">Entendido</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
