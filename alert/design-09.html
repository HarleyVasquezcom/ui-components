<!-- Design 09: Alert with Icon Right / Alerta con ícono a la derecha -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 09</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#e0f2fe;color:#0c4a6e;overflow:hidden}.alert{max-width:500px;width:100%;padding:20px 24px;border:1px solid:#67e8f9;border-radius:8px;background:#eff6ff}.alert-title{font-size:1.1rem;font-weight:600;margin-bottom:6px}.alert-desc{font-size:.875rem;color:#0891b2;margin-bottom:12px}.alert-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.alert-icon{width:24px;height:24px;margin-left:8px;flex-shrink:0}.alert-action{background:#3b82f6;border:none;border-radius:6px;padding:6px 12px;color:#fff;font-weight:500;font-size:.8rem;cursor:pointer}.credit{margin-top:16px;padding:8px 0;border-top:1px solid:#67e8f9;color:#64748b;font-size:.7rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><span class="alert-icon" aria-hidden="true">ℹ️</span><div class="alert-title">Perfil actualizado</div><div class="alert-desc">Su perfil ha sido actualizado exitosamente.</div><div class="alert-row"><span>Actualizado el</span><span class="datetime">14/08/2024</span></div><button class="alert-action">Ver perfil</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
