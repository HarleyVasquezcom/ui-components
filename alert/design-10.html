<!-- Design 10: Alert with Description List / Alerta con Lista Descriptiva -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 10</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#faf089;color:#a16207;overflow:hidden}.alert{max-width:500px;width:100%;padding:20px;border:none;border-radius:6px;background:#faf089}.alert-title{font-size:1.1rem;font-weight:600;margin-bottom:8px}.alert-desclist{display:flex;flex-direction:column;gap:4px}.alert-dlterm{font-weight:500;color:#a16207}.alert-dlval{color:#1e293b}.alert-action{margin-top:12px;padding:6px 12px;background:#f59e0b;border:none;border-radius:6px;color:#fff;font-weight:500;font-size:.8rem;cursor:pointer}.credit{margin-top:16px;padding:8px 0;border-top:1px solid #eab308;color:#a16207;font-size:.7rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><div class="alert-desclist"><div class="alert-dlterm">Título</div><div class="alert-dlval">Configuración exportada</div><div class="alert-dlterm">Tamaño</div><div class="alert-dlval">2.3 MB</div><div class="alert-dlterm">Fecha</div><div class="alert-dlval">14/08/2024</div></div><div class="alert-action">Restaurar configuración</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
