<!-- Design 08: Alert inline / Alerta Inline -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 08</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f3f4f6;color:#374151;overflow:hidden}.alert{max-width:600px;width:100%;padding:12px 24px;border:1px solid #d1d5db;border-radius:6px;background:#fff}.alert-title{font-size:.875rem;font-weight:500;margin-bottom:4px}.alert-desc{font-size:.75rem;color:#6b7280;margin-bottom:8px}.alert-icon{width:16px;height:16px;margin-right:8px;flex-shrink:0}.alert-action{margin-top:8px;padding:4px 8px;background:#f9fafb;border:none;border-radius:4px;color:#374151;font-weight:500;font-size:.75rem;cursor:pointer}.credit{margin-top:12px;padding:8px 0;border-top:1px solid #e5e7eb;color:#9ca3af;font-size:.65rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><span class="alert-icon" aria-hidden="true">ℹ️</span><div class="alert-title">Nuevo mensaje</div><div class="alert-desc">Tiene 3 mensajes nuevos en su bandeja de entrada.</div><button class="alert-action">Ver mensajes</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
