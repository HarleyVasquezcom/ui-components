<!-- Design 07: Alert Dismissible / Alerta Dismissible -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert — Design 07</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#e5e7eb;color:#1f2937;overflow:hidden}.alert{max-width:500px;width:100%;padding:24px 32px;border:none;border-radius:8px;background:#fff}.alert-title{font-size:1.25rem;font-weight:600;margin-bottom:8px}.alert-desc{font-size:.875rem;color:#6b7280;margin-bottom:16px}.alert-icon{width:32px;height:32px;margin-right:12px;flex-shrink:0}.alert-close{float:right;width:32px;height:32px;background:transparent;border:none;color:#9ca3af;font-size:1.5rem;cursor:pointer}.alert-close:focus{outline:2px solid #d1d5db}.alert-action{margin-top:16px;padding:8px 16px;background:#f9fafb;border:none;border-radius:6px;color:#374151;font-weight:500;cursor:pointer}.credit{margin-top:24px;padding:12px 0;border-top:1px solid #e5e7eb;color:#6b7280;font-size:.75rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><div class="alert" data-testid="alert" aria-label="Alert design"><span class="alert-icon" aria-hidden="true">ℹ️</span><div class="alert-title">Cambios sin guardar</div><div class="alert-desc">Hay cambios sin guardar en el formulario. ¿Desea salir de todas formas?</div><button class="alert-close" aria-label="Cerrar sin guardar"></button><button class="alert-action">Quedarse</button></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
