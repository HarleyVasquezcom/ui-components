<!-- Design 05: Timeline Gradient / Gradient Timeline -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e2e8f0;
    color: #334155;
    overflow-x: hidden;
  }
  .timeline { width: min(90vw, 800px); margin: 0 auto; position: relative; padding-left: 30px; }
  .timeline::before { content: ''; position: absolute; left: 16px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, #6b46c1 0%, #a855f7 100%); }
  .timeline-item { margin-bottom: 32px; position: relative; padding-left: 32px; }
  .timeline-item::before { content: ''; position: absolute; left: -28px; top: 12px; width: 12px; height: 12px; background: linear-gradient(135deg, #6b46c1 0%, #a855f7 100%); border-radius: 50%; }
  .timeline-item:hover::before { box-shadow: 0 0 0 4px #fff; }
  .timeline-dot { position: absolute; left: -28px; top: 12px; width: 12px; height: 12px; background: linear-gradient(135deg, #6b46c1 0%, #a855f7 100%); border-radius: 50%; }
  .timeline-content { padding-left: 32px; }
  .timeline-date { font-size: .75rem; color: #64748b; margin-bottom: 4px; }
  .timeline-title { font-size: 1rem; font-weight: 600; color: #1e293b; }
  .timeline-desc { font-size: .875rem; color: #64748b; line-height: 1.5; }
  .timeline-nav { position: absolute; top: 0; width: 24px; height: 100%; margin-top: 32px; transform: translateX(-32px); }
  .timeline-nav button { width: 24px; height: 24px; background: #f8fafc; border: none; border-radius: 6px; color: #64748b; font-size: 1rem; cursor: pointer; }
  .timeline-nav button:hover { background: #e2e8f0; }
  .timeline-nav button:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .timeline { padding-left: 20px; } }
</style>
</head>
<body>
<div data-testid="label" class="label">Timeline</div>
<div class="timeline" data-testid="timeline" aria-label="Timeline design" data-timeline>
  <div class="timeline-item item" data-item>
    <div class="timeline-dot"></div>
    <div class="timeline-content">
      <div class="timeline-date">Jan 2024</div>
      <div class="timeline-title">Project Kickoff</div>
      <div class="timeline-desc">Initial planning.</div>
    </div>
  </div>
  <div class="timeline-item item" data-item>
    <div class="timeline-dot"></div>
    <div class="timeline-content">
      <div class="timeline-date">Feb 2024</div>
      <div class="timeline-title">Design System</div>
      <div class="timeline-desc">Component library.</div>
    </div>
  </div>
  <div class="timeline-item item" data-item>
    <div class="timeline-dot"></div>
    <div class="timeline-content">
      <div class="timeline-date">Mar 2024</div>
      <div class="timeline-title">Development</div>
      <div class="timeline-desc">Core features.</div>
    </div>
  </div>
  <div class="timeline-item item">
    <div class="timeline-dot"></div>
    <div class="timeline-content">
      <div class="timeline-date">Apr 2024</div>
      <div class="timeline-title">Beta Release</div>
      <div class="timeline-desc">Public beta.</div>
    </div>
  </div>
  <div class="timeline-item item">
    <div class="timeline-dot"></div>
    <div class="timeline-content">
      <div class="timeline-date">May 2024</div>
      <div class="timeline-title">Launch</div>
      <div class="timeline-desc">Official launch.</div>
    </div>
  </div>
  <button class="timeline-nav" data-nav-prev aria-label="Anterior hito">&larr;</button>
  <button class="timeline-nav" data-nav-next aria-label="Siguiente hito">&rarr;</button>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
