<!-- Design 07: Compact Inline / Inline Compacto -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compact Inline — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #134e4a;
    overflow-x: hidden;
  }
  .stage { width: min(520px, 94vw); padding: clamp(34px, 7vw, 54px); background: #ccfbf1; border-radius: 14px; box-shadow: 0 30px 70px rgba(0, 0, 0, .5); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #134e4a; font-weight: 800; }
  .sub { margin: .4rem 0 2.2rem; color: #0d9488; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 14px; color: #134e4a; font-size: .85rem; font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; }
  .dz { cursor: pointer; }
  .dz:focus-within { outline: 3px solid #0d9488; outline-offset: 3px; }
  .btn {
    padding: 10px 16px;
    border: none; border-radius: 8px;
    background: #0d9488; color: #f0fdfa;
    font-family: inherit; font-size: .88rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #0f766e; }
  .btn:focus-visible { outline: 3px solid #2dd4bf; outline-offset: 2px; }
  .inline-note { color: #0f766e; font-size: .82rem; }
  .list { margin-top: 16px; display: grid; gap: 8px; list-style: none; padding: 0; }
  .li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 8px; }
  .li .nm { flex: 1; color: #134e4a; font-weight: 600; font-size: .9rem; }
  .li .sz { color: #0d9488; font-size: .78rem; }
  .rm {
    border: none; background: #0d9488; color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: .76rem; font-weight: 700; cursor: pointer;
  }
  .rm:hover { background: #0f766e; }
  .rm:focus-visible { outline: 3px solid #2dd4bf; outline-offset: 2px; }
  .empty { margin-top: 14px; color: #0d9488; font-size: .84rem; }
  .hint { margin-top: 2rem; color: #14b8a6; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #99f6e4; color: #14b8a6; font-size: .78rem; }
  .credit a { color: #0f766e; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Compact Inline</h1>
  <p class="sub">Fits right in the form / Cabe justo en el formulario</p>
  <label class="lbl" data-testid="label" id="lbl-fu07">Attachment</label>
  <div class="row">
    <div class="dz" data-testid="dropzone" aria-label="File uploader">
      <button type="button" class="btn" data-testid="file-input-wrap">＋ Attach</button>
      <input data-testid="file-input" type="file" aria-label="Upload file" aria-describedby="lbl-fu07" hidden>
    </div>
    <span class="inline-note">PDF, PNG, up to 10 MB</span>
  </div>
  <p class="empty" data-testid="empty">
<div data-testid="file-name" style="display:none"></div>No attachments yet · Sin adjuntos aún</p>
  <ul class="list" data-testid="list" hidden></ul>
  <p class="hint">Teal, tidy, tucked-in / Teal, ordenado, discreto</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const input = document.querySelector('[data-testid="file-input"]');
  const list = document.querySelector('[data-testid="list"]');
  const empty = document.querySelector('[data-testid="empty"]');
  const dz = document.querySelector('[data-testid="dropzone"]');
  dz.addEventListener('click', () => input.click());
  function fmt(n) {
    if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }
  input.addEventListener('change', () => {
    list.textContent = '';
    for (const f of input.files) {
      const li = document.createElement('li');
      li.className = 'li';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = f.name;
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = fmt(f.size);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.dataset.testid = 'remove';
      rm.textContent = 'X';
      rm.setAttribute('aria-label', 'Remove ' + f.name);
      rm.addEventListener('click', () => {
        li.remove();
        input.value = '';
        list.hidden = list.children.length === 0;
        empty.hidden = list.children.length > 0;
      });
      li.append(nm, sz, rm);
      list.appendChild(li);
    }
    list.hidden = list.children.length === 0;
    empty.hidden = list.children.length > 0;
  });
</script>
</body>
</html>
