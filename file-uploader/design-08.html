<!-- Design 08: Dark Panel / Panel Oscuro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Panel — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0a0a0a;
    overflow-x: hidden;
  }
  .stage { width: min(540px, 94vw); padding: clamp(34px, 7vw, 54px); background: #171717; border-radius: 18px; border: 1px solid #262626; box-shadow: 0 30px 70px rgba(0, 0, 0, .7); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #f5f5f5; font-weight: 700; }
  .sub { margin: .4rem 0 2.2rem; color: #737373; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 16px; color: #d4d4d4; font-size: .92rem; font-weight: 700; }
  .dz {
    display: grid; place-items: center; gap: 8px;
    padding: 42px 24px;
    text-align: center;
    background: #0a0a0a; border: 1px solid #3a3a3a; border-radius: 14px;
    cursor: pointer;
  }
  .dz:hover { border-color: #f5f5f5; }
  .dz:focus-within { outline: 3px solid #d4d4d4; outline-offset: 3px; }
  .dz p { margin: 0; color: #f5f5f5; font-weight: 700; }
  .dz small { color: #737373; }
  .list { margin-top: 18px; display: grid; gap: 10px; list-style: none; padding: 0; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #202020; border-radius: 12px; border-left: 3px solid #f5f5f5; }
  .li .nm { flex: 1; color: #f5f5f5; font-weight: 600; font-size: .93rem; }
  .li .sz { color: #737373; font-size: .8rem; }
  .rm {
    border: none; background: #3a3a3a; color: #f5f5f5;
    padding: 8px 12px; border-radius: 8px; font-size: .8rem; font-weight: 700; cursor: pointer;
  }
  .rm:hover { background: #525252; }
  .rm:focus-visible { outline: 3px solid #d4d4d4; outline-offset: 2px; }
  .empty { margin-top: 18px; text-align: center; color: #525252; font-size: .85rem; }
  .hint { margin-top: 2rem; color: #404040; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #262626; color: #404040; font-size: .78rem; }
  .credit a { color: #d4d4d4; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Dark Panel</h1>
  <p class="sub">Charcoal slab, sharp edges / Bloque carbón, bordes afilados</p>
  <label class="lbl" data-testid="label" id="lbl-fu08">Files</label>
  <div class="dz" data-testid="dropzone" aria-label="File uploader">
    <p>⬇ Drop to upload</p>
    <small>or click to browse</small>
    <input data-testid="file-input" type="file" multiple aria-label="Upload file" aria-describedby="lbl-fu08" hidden>
  </div>
  <p class="empty" data-testid="empty">
<div data-testid="file-name" style="display:none"></div>Empty panel · Panel vacío</p>
  <ul class="list" data-testid="list" hidden></ul>
  <p class="hint">Monochrome, focused, strict / Monocromo, enfocado, estricto</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const input = document.querySelector('[data-testid="file-input"]');
  const list = document.querySelector('[data-testid="list"]');
  const empty = document.querySelector('[data-testid="empty"]');
  const dz = document.querySelector('[data-testid="dropzone"]');
  dz.addEventListener('click', () => input.click());
  function fmt(n) {
    if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }
  input.addEventListener('change', () => {
    list.textContent = '';
    for (const f of input.files) {
      const li = document.createElement('li');
      li.className = 'li';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = f.name;
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = fmt(f.size);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.dataset.testid = 'remove';
      rm.textContent = 'Remove';
      rm.addEventListener('click', () => {
        li.remove();
        input.value = '';
        list.hidden = list.children.length === 0;
        empty.hidden = list.children.length > 0;
      });
      li.append(nm, sz, rm);
      list.appendChild(li);
    }
    list.hidden = list.children.length === 0;
    empty.hidden = list.children.length > 0;
  });
</script>
</body>
</html>
