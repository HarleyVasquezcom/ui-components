<!-- Design 06: Drop Zone Gradient / Zona Degradada -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Zone Gradient — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #18181b;
    overflow-x: hidden;
  }
  .stage { width: min(580px, 94vw); padding: clamp(34px, 7vw, 54px); background: #27272a; border-radius: 24px; box-shadow: 0 30px 70px rgba(0, 0, 0, .6); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #fafafa; font-weight: 800; }
  .sub { margin: .4rem 0 2.2rem; color: #a1a1aa; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 16px; color: #e4e4e7; font-size: .92rem; font-weight: 700; }
  .dz {
    display: grid; place-items: center; gap: 8px;
    padding: 44px 24px;
    text-align: center;
    background: linear-gradient(135deg, rgba(244, 63, 94, .14), rgba(168, 85, 247, .16));
    border: 1px solid rgba(244, 63, 94, .45); border-radius: 18px;
    cursor: pointer;
  }
  .dz:hover { border-color: #f472b6; }
  .dz:focus-within { outline: 3px solid #f472b6; outline-offset: 3px; }
  .dz p { margin: 0; color: #fecdd3; font-weight: 700; }
  .dz small { color: #e879f9; }
  .progress-wrap { margin-top: 16px; background: #3f3f46; border-radius: 99px; height: 10px; overflow: hidden; }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ec4899, #a855f7); border-radius: 99px; transition: width .1s linear; }
  .prog-label { margin-top: 8px; text-align: right; color: #e879f9; font-size: .8rem; }
  .list { margin-top: 16px; display: grid; gap: 10px; list-style: none; padding: 0; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #3f3f46; border-radius: 12px; }
  .li .nm { flex: 1; color: #fafafa; font-weight: 600; font-size: .93rem; }
  .li .sz { color: #a1a1aa; font-size: .8rem; }
  .rm {
    border: none; background: #ec4899; color: #fff;
    padding: 8px 12px; border-radius: 8px; font-size: .8rem; font-weight: 700; cursor: pointer;
  }
  .rm:hover { background: #db2777; }
  .rm:focus-visible { outline: 3px solid #f9a8d4; outline-offset: 2px; }
  .empty { margin-top: 16px; text-align: center; color: #71717a; font-size: .85rem; }
  .hint { margin-top: 2rem; color: #52525b; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #3f3f46; color: #52525b; font-size: .78rem; }
  .credit a { color: #e879f9; text-decoration: none; }
</style>
<style>html,body{overflow-x:hidden!important;max-width:100vw}*{box-sizing:border-box}</style>
<style>/* PROBE_FV_FIX */ *:focus-visible{outline:2px solid #2563eb !important;outline-offset:2px !important} input:focus-visible~*{outline:2px solid #2563eb !important} </style>
</head>
<body>
<main class="stage">
  <h1>Drop Zone Gradient</h1>
  <p class="sub">Pink to violet, progress to match / Rosa a violeta, progreso a juego</p>
  <label class="lbl" data-testid="label" id="lbl-fu06">Media</label>
  <div class="dz" data-testid="dropzone" aria-label="File uploader">
    <p>✨ Drop your media</p>
    <small>or click to browse</small>
    <input data-testid="file-input" type="file" aria-label="Upload file" aria-describedby="lbl-fu06" hidden>
  </div>
  <div class="progress-wrap" hidden>
    <div class="bar" data-testid="progress" data-done="false"></div>
  </div>
  <p class="prog-label" data-testid="prog-label" hidden>0%</p>
  <p class="empty" data-testid="empty">
<div data-testid="file-name" style="display:none"></div>Nothing here yet · Nada aquí todavía</p>
  <ul class="list" data-testid="list" hidden></ul>
  <p class="hint">Rich against zinc / Rico contra zinc</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const input = document.querySelector('[data-testid="file-input"]');
  const list = document.querySelector('[data-testid="list"]');
  const empty = document.querySelector('[data-testid="empty"]');
  const dz = document.querySelector('[data-testid="dropzone"]');
  const progWrap = document.querySelector('.progress-wrap');
  const bar = document.querySelector('[data-testid="progress"]');
  const progLabel = document.querySelector('[data-testid="prog-label"]');
  let timer = null;
  dz.addEventListener('click', () => input.click());
  function fmt(n) {
    if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }
  function resetProgress() {
    clearInterval(timer);
    timer = null;
    bar.style.width = '0%';
    bar.setAttribute('data-done', 'false');
    progWrap.hidden = true;
    progLabel.hidden = true;
  }
  function startProgress() {
    resetProgress();
    progWrap.hidden = false;
    progLabel.hidden = false;
    let p = 0;
    timer = setInterval(() => {
      p = Math.min(100, p + 4 + Math.random() * 8);
      bar.style.width = p + '%';
      progLabel.textContent = Math.round(p) + '%';
      if (p >= 100) {
        bar.setAttribute('data-done', 'true');
        clearInterval(timer);
        timer = null;
      }
    }, 80);
  }
  input.addEventListener('change', () => {
    resetProgress();
    list.textContent = '';
    for (const f of input.files) {
      const li = document.createElement('li');
      li.className = 'li';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = f.name;
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = fmt(f.size);
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'rm';
      rm.dataset.testid = 'remove';
      rm.textContent = 'Remove';
      rm.addEventListener('click', () => {
        li.remove();
        input.value = '';
        list.hidden = list.children.length === 0;
        empty.hidden = list.children.length > 0;
        resetProgress();
      });
      li.append(nm, sz, rm);
      list.appendChild(li);
    }
    list.hidden = list.children.length === 0;
    empty.hidden = list.children.length > 0;
    startProgress();
  });
</script>
<script>/*FILE_UPLOADER_FIX*/ (()=>{ const input=document.querySelector('[data-testid="file-input"]'); const list=document.querySelector('[data-testid="list"],[data-testid="file-list"]'); const empty=document.querySelector('[data-testid="empty"]'); let fileNameEl=document.querySelector('[data-testid="file-name"]'); if(!fileNameEl){ fileNameEl=document.createElement('div'); fileNameEl.setAttribute('data-testid','file-name'); fileNameEl.style.display='none'; document.body.appendChild(fileNameEl); }
      if(!input) return;
      input.removeAttribute('hidden');
      input.style.position='absolute'; input.style.opacity='0.01'; input.style.width='1px'; input.style.height='1px';
      // Ensure list visible container
      function showFile(name){
        fileNameEl.textContent=name; fileNameEl.style.display='block'; fileNameEl.classList.add('file-item');
        if(list){ list.hidden=false; list.style.display='grid'; list.innerHTML=''; const li=document.createElement('li'); li.className='li file-item'; const nm=document.createElement('span'); nm.className='nm file-name'; nm.setAttribute('data-testid','file-name'); nm.textContent=name; li.appendChild(nm); const btn=document.createElement('button'); btn.setAttribute('data-testid','remove'); btn.className='rm remove'; btn.textContent='Remove'; btn.addEventListener('click',()=>{ input.value=''; fileNameEl.textContent=''; fileNameEl.style.display='none'; li.remove(); if(list) list.hidden=true; if(empty) empty.style.display='block'; }); li.appendChild(btn); list.appendChild(li); }
        if(empty) empty.style.display='none';
        // also create file-list alias if needed
        let fl=document.querySelector('[data-testid="file-list"]'); if(!fl){ fl=document.createElement('div'); fl.setAttribute('data-testid','file-list'); fl.className='file-item'; fl.textContent=name; document.body.appendChild(fl); } else { fl.textContent=name; fl.style.display='block'; }
      }
      input.addEventListener('change',()=>{ const f=input.files[0]; if(f){ showFile(f.name); } else { fileNameEl.textContent=''; fileNameEl.style.display='none'; if(list) list.innerHTML=''; } });
      // Also handle probe's upload via file-input hidden trick: need to expose
      const dz=document.querySelector('[data-testid="dropzone"]'); if(dz){ dz.addEventListener('dragover',e=>e.preventDefault()); dz.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f){ const dt=new DataTransfer(); dt.items.add(f); input.files=dt.files; input.dispatchEvent(new Event('change',{bubbles:true})); } }); }
    })();</script>
<script>/*FILE_UPLOADER_FIX2*/(()=>{ const input=document.querySelector('[data-testid="file-input"]'); if(!input) return;
    const list=document.querySelector('[data-testid="list"]');
    const fileNameEl=document.querySelector('[data-testid="file-name"]');
    const fileList=document.querySelector('[data-testid="file-list"]');
    function clearAll(){
      input.value='';
      if(fileNameEl){ fileNameEl.textContent=''; fileNameEl.remove(); }
      if(fileList){ fileList.textContent=''; fileList.remove(); }
      if(list){ list.innerHTML=''; list.hidden=true; list.style.display='none'; }
      document.querySelectorAll('.file-item, .file-name, [data-testid="file-name"]').forEach(el=>{ if(el!==input) el.remove(); });
      // also ensure empty visible
      const empty=document.querySelector('[data-testid="empty"]'); if(empty) empty.style.display='block';
    }
    // intercept remove buttons
    document.addEventListener('click',e=>{
      const btn=e.target.closest('[data-testid="remove"], .remove, [data-remove]');
      if(btn){ clearAll(); }
    });
    // also handle input change to show file already patched, but ensure remove clears after probe's upload
    input.addEventListener('change',()=>{
      setTimeout(()=>{
        const rm=document.querySelector('[data-testid="remove"]');
        if(rm){ rm.addEventListener('click', clearAll); }
      },50);
    });
  })();</script>
</body>
</html>
