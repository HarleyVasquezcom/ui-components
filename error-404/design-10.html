<!-- Design 10: Error 404 with Backdrop / Con Fondo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error 404 — Design 10</title>
<style>
html{overflow-x:hidden !important;width:100vw !important;}

  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f0f9ff;overflow:hidden}.error{max-width:500px;margin:80px auto;background:rgba(255,255,255,.8);border-radius:12px;padding:2rem;backdrop-filter:blur(8px);text-align:center}.error-code{font-size:10rem;font-weight:700;color:#667eea}.error-title{font-size:1.75rem;font-weight:600;margin:.5rem 0;color:#1e293b}.error-desc{color:#64748b;margin-bottom:1.5rem}.cta{display:inline-block;padding:12px 24px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-weight:500}.cta:hover{background:#1d4ed8}.credit{margin-top:32px;padding:12px 0;border-top:1px solid #667eea;color:#64748b;font-size:.75rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}html, body{ overflow-x: hidden; } </style>
</head>
<body><div class="error" data-testid="error" aria-label="404 page"><div class="error-code">404</div><h1 class="error-title">Página no encontrada</h1><p class="error-desc">The page you are looking for doesn't exist.</p><a class="cta" href="/">Volver al inicio</a></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
