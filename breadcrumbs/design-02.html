<!-- Design 02: Minimal Separator / Separador Mínimo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 02</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#f8f9fa;color:#343a40;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:720px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:4px;padding:15px 0}.bc-item{padding:5px 10px;background:#fff;border:1pxsolid #dee2e6;border-radius:20px;font-size:.75rem;color:#6c757d}.bc-item a{color:#6c757d;text-decoration:none}.bc-item.active{background:#e9ecef;color:#343a40}.bc-item .arrow{margin-left:4px;color:#adb5bd;font-size:.7rem}.bc-home{display:flex;align-items:center;gap:2px}.bc-home svg{width:16px;height:16px}.credit{margin-top:20px;padding:8px 0;border-top:1px solid #dee2e6;color:#6c757d;font-size:.7rem}.credit a{color:#495059;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:8px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#343a40" width="14" height="14"><path d="M10 18a8 8 0 0 1 8-8V7a8 8 0 0 1 8 8v1zM9 13h6l2-3H5l2 3zm7-8a8 8 0 0 0-8 8v1zM5 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active>Panel</span><span class="bc-item" data-testid="bc-item">Reportes</span><span class="bc-item" data-testid="bc-item">Configuración</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
