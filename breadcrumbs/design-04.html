<!-- Design 04: Dark Trail / Ruta Oscura -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 04</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#1e293b;color:#f1f5f9;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:700px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:8px;padding:15px 0;border:1px solid #3b82f6;border-radius:8px;background:#1e293b}.bc-item{padding:8px 12px;background:#1e293b;border-radius:6px;color:#94a3bf;font-size:.8rem}.bc-item a{color:#94a3bf;text-decoration:none}.bc-item.active{background:#3b82f6;color:#e2e8f0}.bc-item .arrow{color:#60a5fa;margin-left:6px;font-size:.7rem}.bc-home{display:flex;align-items:center;gap:4px}.bc-home svg{width:16px;height:16px;fill:#94a3bf}.credit{margin-top:20px;padding:10px 0;border-top:1px solid #3b82f6;color:#94a3bf;font-size:.7rem}.credit a{color:#60a5fa;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:8px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#94a3bf" width="14" height="14"><path d="M3 12h16M3 6h16M3 18h16"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active>Dashboard</span><span class="bc-item" data-testid="bc-item">Analytics</span><span class="bc-item" data-testid="bc-item">Settings</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
