<!-- Design 05: Gradient Path / Ruta Degradada -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 05</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f0f9ff;color:#0c4a6e;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:750px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:6px;padding:15px 0;border:1px solid #bfdbfe;border-radius:8px;background:#eff6ff}.bc-item{padding:6px 10px;background:#fff;border-radius:5px;font-size:.8rem;color:#0c4a6e}.bc-item a{color:#0c4a6e;text-decoration:none}.bc-item.active{background:#bfdbfe;color:#0c4a6e}.bc-item .arrow{color:#a5f3fc;margin-left:6px;font-size:.7rem}.bc-home{display:flex;align-items:center;gap:4px}.bc-home svg{width:16px;height:16px;fill:#0c4a6e}.credit{margin-top:20px;padding:10px 0;border-top:1px solid #bfdbfe;color:#0c4a6e;font-size:.8rem}.credit a{color:#0c4a6e;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:8px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#0c4a6e" width="14" height="14"><path d="M3 12h16M3 6h16M3 18h16"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active>Dashboard</span><span class="bc-item" data-testid="bc-item">Analytics</span><span class="bc-item" data-testid="bc-item">Reports</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
