<!-- Design 09: Editor Trail / Sendero de Editor -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 09</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Georgia",serif;background:#fff;color:#333;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:650px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:8px;padding:20px 0;border:2px solid #333;border-radius:12px}.bc-item{padding:8px 12px;background:#fafafa;border-radius:6px;font-size:.85rem;color:#333}.bc-item a{color:#333;text-decoration:none}.bc-item.active{background:#e5e5e5;color:#333}.bc-item .arrow{margin-left:6px;color:#555;font-size:.7rem}.bc-home{display:flex;align-items:center;gap:4px}.bc-home svg{width:16px;height:16px;fill:#333}.credit{margin-top:20px;padding:10px 0;border-top:2px solid #333;color:#666;font-size:.7rem}.credit a{color:#666;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:10px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#333" width="16" height="16"><path d="M3 12h16M3 6h16M3 18h16"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active>Documentos</span><span class="bc-item" data-testid="bc-item">Proyectos</span><span class="bc-item" data-testid="bc-item">Configuración</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
