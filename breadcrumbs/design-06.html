<!-- Design 06: Mono Breadcrumbs / Monogramas -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 06</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:monospace;background:#0f172a;color:#cbd5e1;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:500px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:4px;padding:15px 0;border:1px solid #3b82f6;border-radius:6px;background:#1e213b}.bc-item{padding:6px 10px;background:#1e213b;border-radius:4px;font-size:.75rem;color:#98a6bd}.bc-item a{color:#98a6bd;text-decoration:none}.bc-item.active{background:#3b82f6;color:#e2e8f0}.bc-item .arrow{color:#60a5fa;margin-left:4px;font-size:.6rem}.bc-home{display:flex;align-items:center;gap:2px}.bc-home svg{width:14px;height:14px;fill:#98a6bd}.credit{margin-top:15px;padding:8px 0;border-top:1px solid #3b82f6;color:#64748b;font-size:.6rem}.credit a{color:#64748b;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:8px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#98a6bd" width="12" height="14"><path d="M3 12h16M3 6h16M3 18h16"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active">Dashboard</span><span class="bc-item" data-testid="bc-item">Reports</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
