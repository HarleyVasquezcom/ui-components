<!-- Design 01: Glass Trail / Rastro de Cristal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 01</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#ecfdf5;color:#064e3b;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:800px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:8px;padding:20px 0;background:#d1fae5;border:1px solid #a7f3d0;border-radius:100px;padding:12px 20px}.bc-item{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#fff;border-radius:999px;font-size:.85rem;color:#065f46}.bc-item a{color:#065f46;text-decoration:none}.bc-item span{color:#10b981}.bc-item .arrow{color:#6ee7b7;font-size:1.2rem}.bc-home{display:flex;align-items:center;gap:4px}.bc-home svg{width:18px;height:18px}.credit{margin-top:25px;padding:10px 0;border-top:1px solid #a7f3d0;color:#6ee7b7;font-size:.8rem}.credit a{color:#064e3b;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:10px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta de navegación"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#10b981" width="16" height="16"><path d="M3 12h16M3 6h16M3 18h16"/></svg>Inicio</span><span class="bc-item"><span>Dashboard</span><svg class="arrow" aria-hidden="true" focusable="false" role="presentation" width="12" height="12" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span><span class="bc-item">Configuración</svg></span><span class="bc-item">Estadísticas</svg></span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
