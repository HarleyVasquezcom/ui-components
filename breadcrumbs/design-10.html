<!-- Design 10: Home Functional / Home Funcional -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 10</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#34495e;color:#ecf0f1;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:500px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;border:2px solid #e74c3c;border-radius:8px;background:#2c3e50}.bc-item{padding:4px 8px;background:#e74c3c;border-radius:4px;font-size:.75rem;color:#ecf0f1}.bc-item a{color:#ecf0f1;text-decoration:none}.bc-item.active{background:#c0392b;color:#ecf0f1}.bc-item .arrow{margin-left:4px;color:#f1c40f;font-size:.6rem}.bc-home{display:flex;align-items:center;gap:2px}.bc-home svg{width:14px;height:14px;fill:#ecf0f1}.credit{margin-top:10px;padding:5px 0;border-top:1px solid #c0392b;color:#95a5a6;font-size:.6rem}.credit a{color:#95a5a6;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:4px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ecf0f1" width="12" height="14"><path d="M10 18a8 8 0 0 1 8-8V7a8 8 0 0 1 8 8v1zM9 13h6l2-3H5l2 3zm7-8a8 8 0 0 0-8 8v1zM5 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active>Dashboard</span><span class="bc-item" data-testid="bc-item">Settings</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
