<!-- Design 07: Pill Breadcrumbs / Píldoras -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Breadcrumbs — Design 07</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fdf4ff;color:#581c87;display:grid;place-items:center;overflow-x:hidden}.breadcrumbs{max-width:650px;width:100%}.bc-list{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}.bc-item{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#d946ef;border-radius:999px;font-size:.8rem;color:#581c87}.bc-item a{color:#581c87;text-decoration:none}.bc-item.active{background:#ec4899;color:#fff}.bc-item .arrow{margin-left:4px;color:#f472b6;font-size:.7rem}.bc-home{display:flex;align-items:center;gap:2px}.bc-home svg{width:14px;height:14px}.credit{margin-top:15px;padding:8px 0;border-top:1px solid #f5d0fe;color:#a21caf;font-size:.7rem}.credit a{color:#a21caf;text-decoration:none}.media{display:none}.@media (max-width:480px){.bc-list{padding:6px 0}}</style>
</head>
<body><div class="breadcrumbs"><div class="bc-list" role="navigation" aria-label="Breadcrumbs" aria-label="Ruta"><span class="bc-home" data-testid="bc-home" aria-label="Breadcrumb home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#581c87" width="14" height="14"><path d="M3 12h16M3 6h16M3 18h16"/></svg>Inicio</span><span class="bc-item" data-testid="bc-item" active">Dashboard</span><span class="bc-item" data-testid="bc-item">Reports</span><span class="bc-item" data-testid="bc-item">Settings</span></div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const items=document.querySelectorAll('.bc-item');const home=document.querySelector('.bc-home');items.forEach((item,i)=>{item.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.remove('active');item.classList.add('active');if(i===0)home.classList.add('active')})});home.addEventListener('click',()=>{items.forEach(x=>x.classList.remove('active'));home.classList.add('active')})})();</script></body></html>
