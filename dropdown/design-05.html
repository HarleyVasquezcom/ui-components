<!-- Design 05: Mega Simple / Mega Simple -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Simple Dropdown — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fafaf9;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(36px, 8vw, 72px);
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 28px 70px rgba(0,0,0,.06);
  }
  h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.4rem); color: #111827; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.6rem; color: #9ca3af; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 12px; color: #374151; font-size: .92rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 18px 20px;
    font-family: inherit; font-size: 1.08rem; font-weight: 600; color: #111827;
    background: #fff;
    border: 2px solid #111827;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #111827;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .trg:hover { box-shadow: 4px 4px 0 #111827; transform: translate(2px, 2px); }
  .trg[aria-expanded="true"] { box-shadow: 2px 2px 0 #111827; transform: translate(4px, 4px); }
  .trg:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
  .trg .arr { font-size: 1.1rem; color: #6b7280; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .lst {
    position: absolute; left: 0; right: 0; top: calc(100% + 10px);
    margin: 0; padding: 10px;
    list-style: none;
    background: #fff;
    border: 2px solid #111827;
    border-radius: 14px;
    box-shadow: 6px 6px 0 rgba(17,24,39,.9);
    z-index: 5;
  }
  [hidden] { display: none !important; }
  .opt {
    padding: 15px 16px;
    font-size: 1rem; font-weight: 600; color: #111827;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .opt:hover, .opt.hl { background: #f3f4f6; }
  .opt.hl { outline: 2px solid #111827; outline-offset: -2px; }
  .opt.checked { background: #2563eb; color: #fff; }
  .opt.checked::after { content: " ✓"; }
  .opt:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .selout span { color: #9ca3af; font-size: .88rem; }
  .selout b { color: #111827; font-weight: 800; }
  .hint { margin-top: 2.4rem; color: #d1d5db; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 2px solid #111827; color: #9ca3af; font-size: .78rem; }
  .credit a { color: #2563eb; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Mega Simple</h1>
  <p class="sub">Big, bold, obvious / Grande, audaz, obvio</p>
  <label class="lbl" data-testid="label" id="lbl-d05">Plan</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lst05" aria-labelledby="lbl-d05">
      <span data-testid="cur">Pro</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <ul class="lst" id="lst05" data-testid="list" role="listbox" aria-label="Plan" hidden>
      <li class="opt" data-testid="option-1" role="option" tabindex="-1">Starter</li>
      <li class="opt" data-testid="option-2" role="option" tabindex="-1">Hobby</li>
      <li class="opt" data-testid="option-3" role="option" tabindex="-1">Pro</li>
      <li class="opt" data-testid="option-4" role="option" tabindex="-1">Business</li>
      <li class="opt" data-testid="option-5" role="option" tabindex="-1">Enterprise</li>
    </ul>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="selected" aria-live="polite">Pro</b></p>
  <p class="hint">You cannot miss it / No puedes no verlo</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const list = document.querySelector('[data-testid="list"]');
  const cur = document.querySelector('[data-testid="cur"]');
  const selected = document.querySelector('[data-testid="selected"]');
  const opts = Array.from(document.querySelectorAll('[data-testid^="option-"]'));
  const DATA = opts.map((o) => o.textContent.trim());
  let open = false, curI = 2, hl = 0;
  function paint() { opts.forEach((el, j) => el.classList.toggle('hl', j === hl)); }
  function setOpen(v) { open = v; list.hidden = !v; trigger.setAttribute('aria-expanded', String(v)); }
  function openList(kbd) { hl = kbd ? 0 : curI; setOpen(true); paint(); }
  function setSel(j) { curI = j; cur.textContent = DATA[j]; selected.textContent = DATA[j]; opts.forEach((el, i) => el.classList.toggle('checked', i === j)); }
  trigger.addEventListener('click', () => { open ? setOpen(false) : openList(); });
  opts.forEach((el, j) => el.addEventListener('click', () => { setSel(j); setOpen(false); }));
  trigger.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(true); else { hl = Math.min(hl + 1, opts.length - 1); paint(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) { hl = Math.max(hl - 1, 0); paint(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (open) { setSel(hl); setOpen(false); } }
    else if (e.key === 'Escape') { e.preventDefault(); if (open) setOpen(false); }
  });
  setSel(2);
</script>
</body>
</html>
