<!-- Design 04: Searchable Select / Select con Búsqueda -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Searchable Select Dropdown — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #eef2f7;
    overflow-x: hidden;
  }
  .stage {
    width: min(540px, 94vw);
    padding: clamp(32px, 7vw, 60px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 26px 64px rgba(2,132,199,.12);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #0c4a6e; font-weight: 700; }
  .sub { margin: .3rem 0 2.4rem; color: #38bdf8; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #075985; font-size: .9rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px;
    font-family: inherit; font-size: 1rem; color: #0c4a6e;
    background: #fff;
    border: 1.5px solid #bae6fd;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .trg:hover { border-color: #7dd3fc; }
  .trg[aria-expanded="true"] { border-color: #0284c7; box-shadow: 0 0 0 4px rgba(2,132,199,.12); }
  .trg:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
  .trg svg { width: 18px; height: 18px; stroke: #38bdf8; fill: none; stroke-width: 2.2; }
  .lst {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px);
    margin: 0; padding: 8px;
    list-style: none;
    background: #fff;
    border: 1.5px solid #bae6fd;
    border-radius: 12px;
    box-shadow: 0 20px 44px rgba(2,132,199,.14);
    z-index: 5;
  }
  [hidden] { display: none !important; }
  .search {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit; font-size: .9rem; color: #0c4a6e;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    outline: none;
    margin-bottom: 6px;
  }
  .search:focus-visible { outline: 2px solid #0284c7; outline-offset: 1px; }
  .opt {
    padding: 10px 12px;
    font-size: .94rem; color: #0c4a6e;
    border-radius: 7px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .opt:hover, .opt.hl { background: #e0f2fe; }
  .opt.hl { outline: 2px solid #38bdf8; outline-offset: -2px; }
  .opt.checked { background: #0284c7; color: #fff; font-weight: 600; }
  .opt:focus-visible { outline: 2px solid #0284c7; outline-offset: -2px; }
  .empty { padding: 10px 12px; color: #94a3b8; font-size: .88rem; font-style: italic; display: none; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .selout span { color: #7dd3fc; font-size: .88rem; }
  .selout b { color: #0c4a6e; font-weight: 700; }
  .hint { margin-top: 2rem; color: #bae6fd; font-size: .82rem; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #f0f9ff; color: #7dd3fc; font-size: .78rem; }
  .credit a { color: #0284c7; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Searchable Select</h1>
  <p class="sub">Type to find your language / Escribe para encontrar tu idioma</p>
  <label class="lbl" data-testid="label" id="lbl-d04">Language</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lst04" aria-labelledby="lbl-d04">
      <span data-testid="cur">English</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    </button>
    <ul class="lst" id="lst04" data-testid="list" role="listbox" aria-label="Language" hidden>
      <li class="search-wrap" role="presentation"><input class="search" type="text" data-testid="filter" aria-label="Filter languages" placeholder="Search…"></li>
      <li class="opt" data-testid="option-1" role="option" tabindex="-1">English</li>
      <li class="opt" data-testid="option-2" role="option" tabindex="-1">Español</li>
      <li class="opt" data-testid="option-3" role="option" tabindex="-1">Français</li>
      <li class="opt" data-testid="option-4" role="option" tabindex="-1">Deutsch</li>
      <li class="opt" data-testid="option-5" role="option" tabindex="-1">Português</li>
      <li class="empty" data-testid="empty">No matches</li>
    </ul>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="selected" aria-live="polite">English</b></p>
  <p class="hint">Open it, search it, pick it / Ábrelo, búscalo, elígelo</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const list = document.querySelector('[data-testid="list"]');
  const cur = document.querySelector('[data-testid="cur"]');
  const selected = document.querySelector('[data-testid="selected"]');
  const filter = document.querySelector('[data-testid="filter"]');
  const empty = document.querySelector('[data-testid="empty"]');
  const opts = Array.from(document.querySelectorAll('[data-testid^="option-"]'));
  const DATA = opts.map((o) => o.textContent.trim());
  let open = false, curI = 0, hl = 0;
  function paint() { opts.forEach((el, j) => el.classList.toggle('hl', j === hl)); }
  function setOpen(v) { open = v; list.hidden = !v; trigger.setAttribute('aria-expanded', String(v)); if (v) { filter.value = ''; opts.forEach((o) => (o.style.display = '')); empty.style.display = 'none'; } }
  function openList(kbd) { hl = kbd ? 0 : curI; setOpen(true); paint(); }
  function setSel(j) { curI = j; cur.textContent = DATA[j]; selected.textContent = DATA[j]; opts.forEach((el, i) => el.classList.toggle('checked', i === j)); }
  trigger.addEventListener('click', () => { open ? setOpen(false) : openList(); });
  opts.forEach((el, j) => el.addEventListener('click', () => { setSel(j); setOpen(false); }));
  trigger.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(true); else { hl = Math.min(hl + 1, opts.length - 1); paint(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) { hl = Math.max(hl - 1, 0); paint(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (open) { setSel(hl); setOpen(false); } }
    else if (e.key === 'Escape') { e.preventDefault(); if (open) setOpen(false); }
  });
  filter.addEventListener('input', () => {
    const q = filter.value.toLowerCase();
    let n = 0;
    opts.forEach((o) => { const m = o.textContent.toLowerCase().includes(q); o.style.display = m ? '' : 'none'; if (m) n++; });
    empty.style.display = n ? 'none' : 'block';
  });
  setSel(0);
</script>
</body>
</html>
