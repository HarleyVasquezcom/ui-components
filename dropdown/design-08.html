<!-- Design 08: Dark Popover / Popover Oscuro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Popover Dropdown — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b0d12;
    overflow-x: hidden;
  }
  .stage {
    width: min(520px, 94vw);
    padding: clamp(36px, 8vw, 72px);
    background: #131722;
    border: 1px solid #232a3a;
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.3rem); color: #f1f5f9; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.6rem; color: #64748b; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 12px; color: #cbd5e1; font-size: .92rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 18px;
    font-family: inherit; font-size: 1.04rem; font-weight: 600; color: #f1f5f9;
    background: #1b2231;
    border: 1px solid #2c3550;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .trg:hover { border-color: #7c8cff; background: #232c42; }
  .trg[aria-expanded="true"] { border-color: #7c8cff; background: #232c42; box-shadow: 0 0 0 3px rgba(124, 140, 255, .18); }
  .trg:focus-visible { outline: 3px solid #7c8cff; outline-offset: 2px; }
  .trg .arr { color: #7c8cff; font-size: 1rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .lst {
    position: absolute; left: 0; right: 0; top: calc(100% + 10px);
    margin: 0; padding: 8px;
    list-style: none;
    background: #1b2231;
    border: 1px solid #2c3550;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    z-index: 5;
  }
  [hidden] { display: none !important; }
  .opt {
    padding: 13px 14px;
    font-size: .98rem; font-weight: 500; color: #e2e8f0;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .opt:hover, .opt.hl { background: #2a3550; }
  .opt.checked { background: #7c8cff; color: #0b0d12; font-weight: 700; }
  .opt.checked::after { content: " ✓"; }
  .opt:focus-visible { outline: 2px solid #7c8cff; outline-offset: -2px; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .selout span { color: #64748b; font-size: .88rem; }
  .selout b { color: #f1f5f9; font-weight: 700; }
  .hint { margin-top: 2.2rem; color: #3b4557; font-size: .82rem; }
  .credit { margin-top: 2.2rem; padding-top: 1.2rem; border-top: 1px solid #232a3a; color: #64748b; font-size: .78rem; }
  .credit a { color: #7c8cff; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Dark Popover</h1>
  <p class="sub">Night mode for pickers / Modo nocturno para selectores</p>
  <label class="lbl" data-testid="label" id="lbl-d08">Plan</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lst08" aria-labelledby="lbl-d08">
      <span data-testid="cur">Pro</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <ul class="lst" id="lst08" data-testid="list" role="listbox" aria-label="Plan" hidden>
      <li class="opt" data-testid="option-1" role="option" tabindex="-1">Starter</li>
      <li class="opt" data-testid="option-2" role="option" tabindex="-1">Hobby</li>
      <li class="opt" data-testid="option-3" role="option" tabindex="-1">Pro</li>
      <li class="opt" data-testid="option-4" role="option" tabindex="-1">Business</li>
      <li class="opt" data-testid="option-5" role="option" tabindex="-1">Enterprise</li>
    </ul>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="selected" aria-live="polite">Pro</b></p>
  <p class="hint">Easy on the eyes at night / Agradable a la vista de noche</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const list = document.querySelector('[data-testid="list"]');
  const cur = document.querySelector('[data-testid="cur"]');
  const selected = document.querySelector('[data-testid="selected"]');
  const opts = Array.from(document.querySelectorAll('[data-testid^="option-"]'));
  const DATA = opts.map((o) => o.textContent.trim());
  let open = false, curI = 2, hl = 0;
  function paint() { opts.forEach((el, j) => el.classList.toggle('hl', j === hl)); }
  function setOpen(v) { open = v; list.hidden = !v; trigger.setAttribute('aria-expanded', String(v)); }
  function openList(kbd) { hl = kbd ? 0 : curI; setOpen(true); paint(); }
  function setSel(j) { curI = j; cur.textContent = DATA[j]; selected.textContent = DATA[j]; opts.forEach((el, i) => el.classList.toggle('checked', i === j)); }
  trigger.addEventListener('click', () => { open ? setOpen(false) : openList(); });
  opts.forEach((el, j) => el.addEventListener('click', () => { setSel(j); setOpen(false); }));
  trigger.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(true); else { hl = Math.min(hl + 1, opts.length - 1); paint(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) { hl = Math.max(hl - 1, 0); paint(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (open) { setSel(hl); setOpen(false); } }
    else if (e.key === 'Escape') { e.preventDefault(); if (open) setOpen(false); }
  });
  setSel(2);
</script>
</body>
</html>
