<!-- Design 08: Minimal Checks / Casillas Mínimas -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Checks — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    background: #fafaf8;
    overflow-x: hidden;
  }
  .stage {
    width: min(600px, 94vw);
    padding: clamp(30px, 6vw, 52px);
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 2px;
    box-shadow: 0 24px 60px rgba(28, 25, 23, .05);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #1c1917; font-weight: 400; letter-spacing: -.01em; }
  .sub { margin: .5rem 0 2.2rem; color: #78716c; font-size: .92rem; font-style: italic; }
  .lbl { display: block; margin: 0 0 14px; color: #78716c; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .24em; }
  .checks { display: grid; gap: 0; border-top: 1px solid #e7e5e4; }
  .ck { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #e7e5e4; color: #292524; font-size: .98rem; cursor: pointer; }
  .ck:hover { background: #fafaf8; }
  .ck input { width: 17px; height: 17px; accent-color: #1c1917; cursor: pointer; }
  .ck input:focus-visible { outline: 3px solid #d6d3d1; outline-offset: 3px; }
  .ck .cnt { margin-left: auto; color: #a8a29e; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .btn { margin-top: 20px; padding: 9px 22px; border: 1px solid #292524; border-radius: 999px; background: #fff; color: #292524; font-family: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #292524; color: #fff; }
  .btn:focus-visible { outline: 3px solid #a8a29e; outline-offset: 2px; }
  .cnt { margin: 0 0 14px; color: #57534e; font-size: .86rem; font-weight: 700; }
  .list { margin: 0; padding: 0; list-style: none; display: grid; }
  .list li { padding: 11px 2px; border-bottom: 1px dotted #d6d3d1; color: #292524; font-size: .96rem; display: flex; justify-content: space-between; gap: 10px; }
  .list li small { color: #a8a29e; font-size: .78rem; font-style: italic; }
  .empty { color: #a8a29e; font-style: italic; padding: 16px 2px; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #e7e5e4; color: #a8a29e; font-size: .8rem; }
  .credit a { color: #57534e; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Minimal Checks</h1>
  <p class="sub">A quiet list / Una lista silenciosa</p>
  <span class="lbl" data-testid="label" id="fl-mc-08-label">Catalogue</span>
  <div class="checks" role="group" aria-labelledby="fl-mc-08-label">
    <label class="ck"><input type="checkbox" data-testid="check" value="Essentials" checked> Essentials <span class="cnt" aria-hidden="true">3</span></label>
    <label class="ck"><input type="checkbox" data-testid="check" value="Premium" checked> Premium <span class="cnt" aria-hidden="true">3</span></label>
    <label class="ck"><input type="checkbox" data-testid="check" value="Limited" checked> Limited <span class="cnt" aria-hidden="true">3</span></label>
    <label class="ck"><input type="checkbox" data-testid="check" value="Archived" checked> Archived <span class="cnt" aria-hidden="true">3</span></label>
  </div>
  <button type="button" class="btn" data-testid="reset" aria-label="Reset filters">Reset / Reiniciar</button>
  <p class="cnt" data-testid="count">Results: 12</p>
  <ul class="list" data-testid="list"></ul>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const ITEMS = [
    { t: 'Notebook', c: 'Essentials' },
    { t: 'Mug', c: 'Essentials' },
    { t: 'Canvas Tote', c: 'Essentials' },
    { t: 'Desk Lamp', c: 'Premium' },
    { t: 'Watch', c: 'Premium' },
    { t: 'Speaker', c: 'Premium' },
    { t: 'Bottle 01', c: 'Limited' },
    { t: 'Wool Coat', c: 'Limited' },
    { t: 'Candle', c: 'Limited' },
    { t: 'Rug', c: 'Archived' },
    { t: 'Chair', c: 'Archived' },
    { t: 'Wall Clock', c: 'Archived' }
  ];
  const checks = document.querySelectorAll('[data-testid="check"]');
  const list = document.querySelector('[data-testid="list"]');
  const count = document.querySelector('[data-testid="count"]');
  const reset = document.querySelector('[data-testid="reset"]');
  function render() {
    const active = [...checks].filter((c) => c.checked).map((c) => c.value);
    const hits = active.length ? ITEMS.filter((i) => active.includes(i.c)) : ITEMS;
    list.textContent = '';
    for (const i of hits) { const li = document.createElement('li'); li.textContent = i.t; li.appendChild(Object.assign(document.createElement('small'), { textContent: i.c })); list.appendChild(li); }
    if (!hits.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Nothing to list / Nada que listar'; list.appendChild(li); }
    count.textContent = 'Results: ' + hits.length;
  }
  checks.forEach((c) => c.addEventListener('change', render));
  reset.addEventListener('click', () => { checks.forEach((c) => (c.checked = true)); render(); });
  render();
</script>

<script>
(function(){
  var filters = document.querySelectorAll('[data-testid="filter"], [data-testid="check"], [data-testid="pill"]');
  filters.forEach(function(f){
    f.addEventListener('click', function(){
      f.classList.toggle('active');
    });
  });
})();
</script>
</body>
</html>
