<!-- Design 06: Dark Panel / Panel Oscuro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Panel — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b1120;
    overflow-x: hidden;
  }
  .stage {
    width: min(680px, 94vw);
    padding: clamp(24px, 5vw, 40px);
    background: #111a2e;
    border: 1px solid #1f2c48;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 4.6vw, 1.9rem); color: #f1f5f9; font-weight: 800; }
  .sub { margin: .4rem 0 1.6rem; color: #7d8db0; font-size: .93rem; }
  .lbl { display: block; margin: 0 0 12px; color: #7d8db0; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 26px; }
  .side { border-right: 1px solid #1f2c48; padding-right: 22px; }
  .checks { display: grid; gap: 10px; }
  .ck { display: flex; align-items: center; gap: 10px; cursor: pointer; color: #cbd5e1; font-size: .9rem; }
  .ck input { width: 18px; height: 18px; accent-color: #38bdf8; cursor: pointer; }
  .ck input:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 2px; border-radius: 4px; }
  .btn { margin-top: 18px; width: 100%; padding: 10px 14px; border: 1px solid #1f2c48; border-radius: 8px; background: #16203a; color: #93c5fd; font-family: inherit; font-size: .88rem; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #1b2a4a; }
  .btn:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
  .main .cnt { margin: 0 0 12px; color: #38bdf8; font-size: .95rem; font-weight: 700; }
  .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .list li { padding: 12px 14px; background: #0f172a; border: 1px solid #1f2c48; border-radius: 10px; color: #e2e8f0; font-size: .92rem; display: flex; justify-content: space-between; gap: 8px; }
  .list li small { color: #64748b; }
  .list li .y { color: #38bdf8; }
  .empty { color: #64748b; font-size: .92rem; padding: 16px 0; }
  .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #1f2c48; color: #475569; font-size: .78rem; }
  .credit a { color: #38bdf8; text-decoration: none; }
  @media (max-width: 480px) { .layout { grid-template-columns: 1fr; } .side { border-right: none; border-bottom: 1px solid #1f2c48; padding-right: 0; padding-bottom: 16px; } }
</style>
</head>
<body>
<main class="stage">
  <h1>Dark Panel</h1>
  <p class="sub">Library of the night / Biblioteca de la noche</p>
  <div class="layout">
    <aside class="side">
      <span class="lbl" data-testid="label" id="fl-dp-06-label">Genres</span>
      <div class="checks" role="group" aria-labelledby="fl-dp-06-label">
        <label class="ck"><input type="checkbox" data-testid="check" value="Pop" checked> Pop</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Rock" checked> Rock</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Jazz" checked> Jazz</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Electronic" checked> Electronic</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Classical" checked> Classical</label>
      </div>
      <button type="button" class="btn" data-testid="reset" aria-label="Reset filters">Reset / Reiniciar</button>
    </aside>
    <section class="main">
      <p class="cnt" data-testid="count">Results: 10</p>
      <ul class="list" data-testid="list"></ul>
    </section>
  </div>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const TRACKS = [
    { t: 'Bohemian Rhapsody', g: 'Rock', y: 1975 },
    { t: 'Blinding Lights', g: 'Pop', y: 2019 },
    { t: 'Take Five', g: 'Jazz', y: 1959 },
    { t: 'Strobe', g: 'Electronic', y: 2009 },
    { t: 'Clair de Lune', g: 'Classical', y: 1905 },
    { t: 'Smells Like Teen Spirit', g: 'Rock', y: 1991 },
    { t: 'Levitating', g: 'Pop', y: 2020 },
    { t: 'So What', g: 'Jazz', y: 1959 },
    { t: 'Midnight City', g: 'Electronic', y: 2011 },
    { t: 'The Four Seasons', g: 'Classical', y: 1723 }
  ];
  const checks = document.querySelectorAll('[data-testid="check"]');
  const list = document.querySelector('[data-testid="list"]');
  const count = document.querySelector('[data-testid="count"]');
  const reset = document.querySelector('[data-testid="reset"]');
  function render() {
    const active = [...checks].filter((c) => c.checked).map((c) => c.value);
    const hits = active.length ? TRACKS.filter((i) => active.includes(i.g)) : TRACKS;
    list.textContent = '';
    for (const i of hits) { const li = document.createElement('li'); li.textContent = i.t; li.appendChild(Object.assign(document.createElement('small'), { textContent: i.g })); li.appendChild(Object.assign(document.createElement('span'), { className: 'y', textContent: i.y })); list.appendChild(li); }
    if (!hits.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No matches / Sin coincidencias'; list.appendChild(li); }
    count.textContent = 'Results: ' + hits.length;
  }
  checks.forEach((c) => c.addEventListener('change', render));
  reset.addEventListener('click', () => { checks.forEach((c) => (c.checked = true)); render(); });
  render();
</script>

<script>
(function(){
  var filters = document.querySelectorAll('[data-testid="filter"], [data-testid="check"], [data-testid="pill"]');
  filters.forEach(function(f){
    f.addEventListener('click', function(){
      f.classList.toggle('active');
    });
  });
})();
</script>
</body>
</html>
