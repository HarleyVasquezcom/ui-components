<!-- Design 01: Checkbox List / Lista de Casillas -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox List — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f8fafc;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(26px, 6vw, 44px);
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 22px 55px rgba(15, 23, 42, .08);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.8vw, 2rem); color: #0f172a; font-weight: 800; }
  .sub { margin: .4rem 0 1.6rem; color: #64748b; font-size: .94rem; }
  .layout { display: grid; grid-template-columns: 190px 1fr; gap: 24px; }
  .side { border-right: 1px solid #e2e8f0; padding-right: 20px; }
  .lbl { display: block; margin: 0 0 12px; color: #334155; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .checks { display: grid; gap: 9px; }
  .ck { display: flex; align-items: center; gap: 9px; cursor: pointer; color: #1e293b; font-size: .92rem; }
  .ck input { width: 18px; height: 18px; accent-color: #2563eb; cursor: pointer; }
  .ck input:focus-visible { outline: 3px solid #bfdbfe; outline-offset: 2px; border-radius: 4px; }
  .btns { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    padding: 9px 14px;
    border: 1px solid #cbd5e1; border-radius: 8px;
    background: #f8fafc; color: #0f172a;
    font-family: inherit; font-size: .88rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #eff6ff; border-color: #93c5fd; }
  .btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  .btn.prime { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn.prime:hover { background: #1d4ed8; }
  .main { min-width: 0; }
  .cnt { margin: 0 0 12px; color: #2563eb; font-size: .95rem; font-weight: 700; }
  .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .list li {
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0; border-radius: 10px;
    color: #1e293b; font-size: .93rem;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .list li small { color: #94a3b8; }
  .empty { color: #94a3b8; font-size: .92rem; padding: 18px 0; }
  .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) {
    .layout { grid-template-columns: 1fr; }
    .side { border-right: none; border-bottom: 1px solid #e2e8f0; padding-right: 0; padding-bottom: 16px; }
  }
</style>
</head>
<body>
<main class="stage">
  <h1>Checkbox List</h1>
  <p class="sub">Filter books by genre / Filtra libros por género</p>
  <div class="layout">
    <aside class="side">
      <span class="lbl" data-testid="label" id="fl-cbl-01-label">Genres</span>
      <div class="checks" role="group" aria-labelledby="fl-cbl-01-label">
        <label class="ck"><input type="checkbox" data-testid="check" value="Fiction" checked> Fiction</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Sci-Fi" checked> Sci-Fi</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="History" checked> History</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Poetry" checked> Poetry</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Mystery" checked> Mystery</label>
        <label class="ck"><input type="checkbox" data-testid="check" value="Biography" checked> Biography</label>
      </div>
      <div class="btns">
        <button type="button" class="btn" data-testid="reset" aria-label="Reset filters">Reset / Reiniciar</button>
      </div>
    </aside>
    <section class="main">
      <p class="cnt" data-testid="count">Results: 10</p>
      <ul class="list" data-testid="list"></ul>
    </section>
  </div>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const ITEMS = [
    { t: 'Anna Karenina', g: 'Fiction', a: 'Tolstoy' },
    { t: 'Dune', g: 'Sci-Fi', a: 'Herbert' },
    { t: 'The Odyssey', g: 'Poetry', a: 'Homer' },
    { t: '1984', g: 'Fiction', a: 'Orwell' },
    { t: 'Sapiens', g: 'History', a: 'Harari' },
    { t: 'The Martian', g: 'Sci-Fi', a: 'Weir' },
    { t: 'Murder on the Orient Express', g: 'Mystery', a: 'Christie' },
    { t: 'The Diary of a Young Girl', g: 'Biography', a: 'Frank' },
    { t: 'Meditations', g: 'History', a: 'Marcus Aurelius' },
    { t: 'Cosmos', g: 'Sci-Fi', a: 'Sagan' }
  ];
  const checks = document.querySelectorAll('[data-testid="check"]');
  const list = document.querySelector('[data-testid="list"]');
  const count = document.querySelector('[data-testid="count"]');
  const reset = document.querySelector('[data-testid="reset"]');
  function render() {
    const active = [...checks].filter((c) => c.checked).map((c) => c.value);
    const hits = active.length ? ITEMS.filter((i) => active.includes(i.g)) : ITEMS;
    list.textContent = '';
    for (const i of hits) { const li = document.createElement('li'); li.textContent = i.t + ' — ' + i.g; li.appendChild(Object.assign(document.createElement('small'), { textContent: i.a })); list.appendChild(li); }
    if (!hits.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No matches / Sin coincidencias'; list.appendChild(li); }
    count.textContent = 'Results: ' + hits.length;
  }
  checks.forEach((c) => c.addEventListener('change', render));
  reset.addEventListener('click', () => { checks.forEach((c) => (c.checked = true)); render(); });
  render();
</script>

<script>
(function(){
  var filters = document.querySelectorAll('[data-testid="filter"], [data-testid="check"], [data-testid="pill"]');
  filters.forEach(function(f){
    f.addEventListener('click', function(){
      f.classList.toggle('active');
    });
  });
})();
</script>
</body>
</html>
