<!-- Design 07: Card Grid / Rejilla de Tarjetas -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Grid — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fafafa;
    overflow-x: hidden;
  }
  .stage {
    width: min(680px, 94vw);
    padding: clamp(26px, 6vw, 44px);
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 20px;
    box-shadow: 0 22px 55px rgba(0, 0, 0, .07);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.8vw, 2rem); color: #171717; font-weight: 800; }
  .sub { margin: .4rem 0 1.6rem; color: #737373; font-size: .94rem; }
  .lbl { display: block; margin: 0 0 10px; color: #404040; font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill {
    padding: 8px 16px;
    border: 1.5px solid #d4d4d4; border-radius: 999px;
    background: #fafafa; color: #404040;
    font-family: inherit; font-size: .86rem; font-weight: 600;
    cursor: pointer;
  }
  .pill:hover { border-color: #a3a3a3; }
  .pill:focus-visible { outline: 3px solid #a3a3a3; outline-offset: 2px; }
  .pill.on { background: #171717; border-color: #171717; color: #fff; }
  .cnt { margin: 0 0 12px; color: #171717; font-weight: 700; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card {
    padding: 16px;
    background: #fafafa;
    border: 1px solid #e5e5e5; border-radius: 14px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0, 0, 0, .08); }
  .card .ico { font-size: 1.4rem; }
  .card h3 { margin: 10px 0 4px; color: #171717; font-size: .95rem; }
  .card p { margin: 0; color: #737373; font-size: .8rem; }
  .card .st { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; background: #e5e5e5; color: #404040; font-size: .72rem; font-weight: 700; }
  .empty { grid-column: 1 / -1; color: #a3a3a3; text-align: center; padding: 20px; }
  .btn { margin-top: 16px; padding: 9px 18px; border: 1.5px solid #d4d4d4; border-radius: 10px; background: #fff; color: #404040; font-family: inherit; font-size: .87rem; font-weight: 700; cursor: pointer; }
  .btn:hover { border-color: #171717; color: #171717; }
  .btn:focus-visible { outline: 3px solid #a3a3a3; outline-offset: 2px; }
  .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e5e5; color: #a3a3a3; font-size: .78rem; }
  .credit a { color: #404040; text-decoration: none; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="stage">
  <h1>Card Grid</h1>
  <p class="sub">Filter the toolbox / Filtra la caja de herramientas</p>
  <span class="lbl" data-testid="label" id="fl-cg-07-label">Category / Categoría</span>
  <div class="pills" role="group" aria-labelledby="fl-cg-07-label">
    <button type="button" class="pill" data-testid="pill" value="Dev" aria-pressed="false">Dev</button>
    <button type="button" class="pill" data-testid="pill" value="Design" aria-pressed="false">Design</button>
    <button type="button" class="pill" data-testid="pill" value="Ops" aria-pressed="false">Ops</button>
    <button type="button" class="pill" data-testid="pill" value="Data" aria-pressed="false">Data</button>
    <button type="button" class="pill" data-testid="pill" value="AI" aria-pressed="false">AI</button>
  </div>
  <p class="cnt" data-testid="count">Showing: 12</p>
  <div class="grid" data-testid="grid"></div>
  <button type="button" class="btn" data-testid="reset" aria-label="Reset filters">Reset / Restablecer</button>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const TOOLS = [
    { t: 'Code Runner', c: 'Dev', i: '⚡' }, { t: 'Diff Viewer', c: 'Dev', i: '🔀' },
    { t: 'Linter', c: 'Dev', i: '🧹' }, { t: 'Color Studio', c: 'Design', i: '🎨' },
    { t: 'Font Matcher', c: 'Design', i: '🔤' }, { t: 'Spacing Ruler', c: 'Design', i: '📏' },
    { t: 'Deploy Bot', c: 'Ops', i: '🚀' }, { t: 'Monitor Grid', c: 'Ops', i: '📡' },
    { t: 'Log Tamer', c: 'Ops', i: '🧾' }, { t: 'CSV Shaper', c: 'Data', i: '📊' },
    { t: 'Query Bench', c: 'Data', i: '🗄️' }, { t: 'AI Snippet', c: 'AI', i: '🤖' },
    { t: 'Prompt Lab', c: 'AI', i: '🧪' }, { t: 'Embed Tester', c: 'AI', i: '🔗' }
  ];
  const pills = document.querySelectorAll('[data-testid="pill"]');
  const grid = document.querySelector('[data-testid="grid"]');
  const count = document.querySelector('[data-testid="count"]');
  const reset = document.querySelector('[data-testid="reset"]');
  function render() {
    const active = [...pills].filter((p) => p.classList.contains('on')).map((p) => p.value);
    const hits = active.length ? TOOLS.filter((t) => active.includes(t.c)) : TOOLS;
    grid.textContent = '';
    for (const t of hits) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '';
      const ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = t.i;
      const h3 = document.createElement('h3'); h3.textContent = t.t;
      const p = document.createElement('p'); p.textContent = t.c + ' tool';
      const st = document.createElement('span'); st.className = 'st'; st.textContent = t.c;
      card.append(ico, h3, p, st);
      grid.appendChild(card);
    }
    if (!hits.length) { const e = document.createElement('p'); e.className = 'empty'; e.textContent = 'No tools in this category / Ninguna herramienta en esta categoría'; grid.appendChild(e); }
    count.textContent = 'Showing: ' + hits.length;
  }
  pills.forEach((p) => p.addEventListener('click', () => { p.classList.toggle('on'); p.setAttribute('aria-pressed', p.classList.contains('on') ? 'true' : 'false'); render(); }));
  reset.addEventListener('click', () => { pills.forEach((p) => { p.classList.remove('on'); p.setAttribute('aria-pressed', 'false'); }); render(); });
  render();
</script>

<script>
(function(){
  var filters = document.querySelectorAll('[data-testid="filter"], [data-testid="check"], [data-testid="pill"]');
  filters.forEach(function(f){
    f.addEventListener('click', function(){
      f.classList.toggle('active');
    });
  });
})();
</script>
</body>
</html>
