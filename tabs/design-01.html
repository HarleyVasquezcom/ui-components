<!-- Design 01: Card Switch / Conmutador de Tarjeta -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 01</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,90vw);}.tab-list{display:flex;gap:4px;margin-bottom:8px;}.tab{flex:1;padding:12px 8px;background:#e2e8f0;color:#0f172a;border-radius:8px 8px 0 0;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .2s}.tab.active{background:#1e293b;color:#fff}.tab-panel{width:100%;background:#fff;border:1px solid #cbd5e1;border-top:none;padding:24px;display:none}.tab-panel.active{display:block}.credit{margin-top:30px;padding:15px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto;}.tab{flex:0 0 auto;padding:8px}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab">Inicio</div><div class="tab" data-testid="tab" aria-label="Tab" role="tab" aria-selected="false">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">¡Bienvenido! Contenio principal.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Nosotros - informacion de la empresa.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Nuestros servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Nuestro portafolio de proyectos.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Contacto y ubicaci&oacute;n.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
