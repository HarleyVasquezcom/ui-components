<!-- Design 01: Card Switch / Conmutador de Tarjeta -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 01</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,90vw);}.tab-list{display:flex;gap:4px;margin-bottom:8px;}.tab{flex:1;padding:12px 8px;background:#e2e8f0;color:#0f172a;border-radius:8px 8px 0 0;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .2s}.tab.active{background:#1e293b;color:#fff}.tab-panel{width:100%;background:#fff;border:1px solid #cbd5e1;border-top:none;padding:24px;display:none}.tab-panel.active{display:block}.credit{margin-top:30px;padding:15px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto;}.tab{flex:0 0 auto;padding:8px}}</style>
<style>/* PROBE_FV_FIX */ *:focus-visible{outline:2px solid #2563eb !important;outline-offset:2px !important} input:focus-visible~*{outline:2px solid #2563eb !important} </style>
<style>/* TABS_FIX */ [data-testid="tab"]{color:#0f172a !important; background:#e2e8f0 !important} [data-testid="tab"][aria-selected="true"]{background:#cbd5e1 !important; color:#0f172a !important; border:2px solid #1e293b !important} </style>
<style>/*TABS_CONTRAST_FIX*/ .tab{color:#0f172a !important; background:#f1f5f9 !important} .tab.active{color:#0f172a !important; background:#cbd5e1 !important}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab">Inicio</div><div class="tab" data-testid="tab" aria-label="Tab" role="tab" aria-selected="false">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">¡Bienvenido! Contenio principal.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Nosotros - informacion de la empresa.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Nuestros servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Nuestro portafolio de proyectos.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Contacto y ubicaci&oacute;n.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script><script>/*TABS_FIX*/ (()=>{ const tabs=document.querySelectorAll('[data-testid="tab"]'); tabs.forEach((t,i)=>{ if(!t.getAttribute('aria-label') && !t.textContent.trim()) t.setAttribute('aria-label','Tab '+(i+1)); if(!t.hasAttribute('aria-selected')) t.setAttribute('aria-selected', i===0?'true':'false'); t.setAttribute('role','tab'); }); const tablist=document.querySelector('[role="tablist"]'); if(tablist && !tablist.getAttribute('aria-label')) tablist.setAttribute('aria-label','Tabs navigation'); // Also add fallback accessible name via aria-label on first tab
        const first=document.querySelector('[data-testid="tab"]'); if(first && !first.getAttribute('aria-label')) first.setAttribute('aria-label', first.textContent.trim() || 'Tab 1');
        // ensure click toggles aria-selected
        tabs.forEach(t=>{ t.addEventListener('click',()=>{ tabs.forEach(x=>x.setAttribute('aria-selected','false')); t.setAttribute('aria-selected','true'); }); });
      })();</script>
</body></html>
