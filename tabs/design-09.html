<!-- Design 09: Icon Only / Solo Ícono -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 09</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Apple Color Emoji",sans-serif;background:#fafaff;color:#1e293b;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(500px,95vw)}.tab-list{display:flex;gap:8px;margin-bottom:16px}.tab{width:44px;height:44px;border-radius:50%;background:#f3f4f6;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s}.tab.active{background:#3b82f6;border-color:#3b82f6;color:#fff}.tab .icon{width:20px;height:20px}.tab-panel{width:100%;background:#fff;border:2px solid #e5e7eb;border-top:none;padding:24px;display:none;color:#1e293b}.tab-panel.active{display:block}.credit{margin-top:20px;padding:10px 0;border-top:1px solid #e5e7eb;color:#9ca3af;font-size:.7rem}.credit a{color:#9ca3af;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1e293b" width="20" height="20"><path d="M3 13h13v2H3v-2zm12-4h-5v8h5V9zm-5 8h5v-8H3v8zm5-8h2v2h-2V9z"/></svg></div><div class="tab" data-testid="tab" aria-label="Tab" role="tab" aria-selected="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill:#64748b" width="20" height="20"><path d="M3 13h13v2H3v-2zm12-4h-5v8h5V9zm-5 8h5v-8H3v8zm5-8h2v2h-2V9z"/></svg></div><div class="tab" role="tab" aria-selected="false" data-testid="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill:#64748b" width="20" height="20"><path d="M3 13h13v2H3v-2zm12-4h-5v8h5V9zm-5 8h5v-8H3v8zm5-8h2v2h-2V9z"/></svg></div><div class="tab" role="tab" aria-selected="false" data-testid="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill:#64748b" width="20" height="20"><path d="M3 13h13v2H3v-2zm12-4h-5v8h5V9zm-5 8h5v-8H3v8zm5-8h2v2h-2V9z"/></svg></div><div class="tab" role="tab" aria-selected="false" data-testid="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill:#64748b" width="20" height="20"><path d="M3 13h13v2H3v-2zm12-4h-5v8h5V9zm-5 8h5v-8H3v8zm5-8h2v2h-2V9z"/></svg></div><div class="tab" role="tab" aria-selected="false" data-testid="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill:#64748b" width="20" height="20"><path d="M3 13h13v2H3v-2zm12-4h-5v8h5V9zm-5 8h5v-8H3v8zm5-8h2v2h-2V9z"/></svg></div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Conten.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
