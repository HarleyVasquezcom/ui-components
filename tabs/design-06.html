<!-- Design 06: Mono Labels / Etiquetas Mono -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 06</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:monospace;background:#0f172a;color:#cbd5e1;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,95vw)}.tab-list{display:flex;gap:3px;margin-bottom:8px}.tab{flex:1;padding:12px 6px;background:#1e213b;color:#cbd5e1;border-radius:4px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s}.tab.active{background:#3b82f6;color:#e2e8f0}.tab-panel{width:100%;background:#1e213b;border:1px solid #3b82f6;border-top:none;padding:20px;display:none;color:#e2e8f0}.tab-panel.active{display:block}.credit{margin-top:20px;padding:10px 0;border-top:1px solid #3b82f6;color:#64748b;font-size:.7rem}.credit a{color:#64748b;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab" aria-label="Tab 1">Inicio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Contenido mono.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel mono.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel mono servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel mono portafolio.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel mono contacto.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
