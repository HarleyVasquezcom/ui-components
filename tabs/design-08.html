<!-- Design 08: Underlined Switch / Intercambio Subrayado -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 08</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#ffffff;color:#1e293b;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,95vw)}.tab-list{position:relative;display:flex;gap:4px;margin-bottom:0}.tab{flex:1;padding:14px 10px;background:transparent;border:none;font-size:.9rem;font-weight:600;color:#1e293b;cursor:pointer;transition:color .2s}.tab.active{color:#3b82f6}.tab.active::after{content:'';position:absolute;bottom:-2px;left:0;width:100%;height:3px;background:#3b82f6}.tab-panel{width:100%;background:#fff;border:1px solid #e5e7eb;border-top:none;padding:24px;display:none;color:#1e293b}.tab-panel.active{display:block}.credit{margin-top:25px;padding:10px 0;border-top:1px solid #e5e7eb;color:#6b7283;font-size:.8rem}.credit a{color:#6b7283;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab" aria-label="Tab 1">Inicio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Contenido principal.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel de nosotros.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel portafolio.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel contacto.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
