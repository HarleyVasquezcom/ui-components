<!-- Design 07: Numbered Steps / Pasos Numerados -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 07</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f1f5f9;color:#0f172a;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(650px,95vw)}.tab-list{display:flex;gap:2px;margin-bottom:12px}.tab{flex:1;padding:10px 6px;background:#e2e8f0;border:1px solid #cbd5e1;border-radius:4px;font-size:.85rem;font-weight:600;color:#0f172a;cursor:pointer;position:relative}.tab.active{background:#1e293b;color:#fff;border-color:#1e293b}.tab .step-num{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;background:#3b82f6;color:#fff;border-radius:50%;font-size:.7rem;text-align:center;line-height:24px}.tab-panel{width:100%;background:#fff;border:1px solid #cbd5e1;border-top:none;padding:24px;display:none;color:#0f172a}.tab-panel.active{display:block}.credit{margin-top:25px;padding:10px 0;border-top:1px solid #cbd5e1;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab" aria-label="Tab 1"><span class="step-num">1</span>Inicio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2"><span class="step-num">2</span>Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3"><span class="step-num">3</span>Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4"><span class="step-num">4</span>Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5"><span class="step-num">5</span>Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Paso 1: contenido principal.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Paso 2: panel nosotros.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Paso 3: panel servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Paso 4: panel portafolio.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Paso 5: panel contacto.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
