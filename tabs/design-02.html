<!-- Design 02: Minimal Indicators / Indicadores Mínimos -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 02</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#edf2f7;color:#1e293b;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,90vw)}.tab-list{position:relative;display:flex;gap:2px;margin-bottom:0}.tab{flex:1;padding:14px 12px;background:transparent;color:#1e293b;border:2px solid transparent;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}.tab:hover{border-color:#64748b}.tab.active{border-color:#3b82f6;color:#3b82f6}.indicator{position:absolute;bottom:0;left:2px;width:0;height:3px;background:#3b82f6;transition:width .3s}.tab.active+.indicator{width:100%}.tab-panel{width:100%;background:#fff;border:1px solid #cbd5e1;border-top:none;padding:24px;display:none}.tab-panel.active{display:block}.credit{margin-top:25px;padding:10px 0;border-top:1px solid #cbd5e1;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-indicator data-testid="tab" aria-label="Tab 1"><span>Inicio</span></div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2"><span>Nosotros</span></div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3"><span>Servicios</span></div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4"><span>Portafolio</span></div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5"><span>Contacto</span></div></div><div class="indicator"></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Contenido principal.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel de nosotros.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel de servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel portafolio.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel contacto.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');const indicator=document.querySelector('.indicator');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active');indicator.style.width=`calc(100% / ${tabs.length})`})})})();</script></body></html>
