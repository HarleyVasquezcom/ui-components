<!-- Design 05: Gradient Indicators / Indicadores Degradados -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 05</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f0f9ff;color:#0c4a6e;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,95vw)}.tab-list{display:flex;gap:4px;margin-bottom:8px}.tab{flex:1;padding:12px 10px;background:linear-gradient(135deg,#3b82f6 #1d4ed8);color:#fff;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;transition:transform .2s}.tab.active{transform:scale(1.02)}.tab-panel{width:100%;background:#eff6ff;border:1px solid #bfdbfe;border-top:none;padding:24px;display:none;color:#0c4a6e}.tab-panel.active{display:block}.credit{margin-top:25px;padding:10px 0;border-top:1px solid #bfdbfe;color:#0c4a6e;font-size:.8rem}.credit a{color:#0c4a6e;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab" aria-label="Tab 1">Inicio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Contenido principal con degradado.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel degradado.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel servicios degradado.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel portafolio degradado.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel contacto degradado.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
