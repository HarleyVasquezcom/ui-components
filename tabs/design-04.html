<!-- Design 04: Dark Tabs / Tabs Oscuros -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 04</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,90vw)}.tab-list{display:flex;gap:4px;margin-bottom:8px}.tab{flex:1;padding:12px 8px;background:#1e293b;color:#f1f5f9;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .2s}.tab.active{background:#3b82f6;color:#fff}.tab-panel{width:100%;background:#1e293b;border:1px solid #3b82f6;border-top:none;padding:24px;display:none;color:#f1f5f9}.tab-panel.active{display:block}.credit{margin-top:30px;padding:15px 0;border-top:1px solid #3b82f6;color:#94a3bf;font-size:.8rem}.credit a{color:#60a5fa;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab" aria-label="Tab 1">Inicio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Contenido principal en modo oscuro.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel modo oscuro.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel servicios modo oscuro.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel portafolio modo oscuro.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel contacto modo oscuro.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
