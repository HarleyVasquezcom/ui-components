<!-- Design 03: Pill Separated / Píldora Separada -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — Design 03</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fdf4ff;color:#581c87;display:grid;place-items:center;overflow-x:hidden}.tabs-wrapper{width:min(600px,95vw)}.tab-list{display:flex;gap:6px;margin-bottom:12px}.tab{flex:1;padding:10px 8px;background:#fff;border:2px solid #d946ef;border-radius:20px;color:#581c87;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s}.tab.active{background:#d946ef;color:#fff}.tab-panel{width:100%;background:#fff;border:2px solid #f5d0fe;border-top:none;padding:20px;border-radius:8px;display:none}.tab-panel.active{display:block}.credit{margin-top:20px;padding:10px 0;border-top:1px solid #f5d0fe;color:#a21caf;font-size:.8rem}.credit a{color:#a21caf;text-decoration:none}.media{display:none}.@media (max-width:480px){.tab-list{overflow-x:auto}}</style>
</head>
<body><div class="tabs-wrapper"><div class="tab-list" role="tablist" aria-label="Tabs"><div class="tab active" role="tab" aria-selected="true" data-testid="tab" aria-label="Tab 1">Inicio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 2">Nosotros</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 3">Servicios</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 4">Portafolio</div><div class="tab" role="tab" aria-selected="false" data-testid="tab" aria-label="Tab 5">Contacto</div></div><div class="tab-panel active" role="tabpanel" aria-labelledby="tab-inicio">Contenido principal.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-nosotros">Panel de nosotros.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-servicios">Panel de servicios.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-portafolio">Panel portafolio.</div><div class="tab-panel" role="tabpanel" aria-labelledby="tab-contacto">Panel contacto.</div></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><script>(()=>{const tabs=document.querySelectorAll('.tab');const panels=document.querySelectorAll('.tab-panel');tabs.forEach((t,i)=>{t.addEventListener('click',()=>{tabs.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')}),t.classList.add('active');t.setAttribute('aria-selected','true');panels.forEach(p=>p.classList.remove('active'));panels[i].classList.add('active')})})})();</script></body></html>
