<!-- Design 09: Slate Split / División Pizarra -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate Split Time Picker — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #1e1b4b;
    overflow-x: hidden;
  }
  .stage { width: min(500px, 94vw); padding: clamp(34px, 8vw, 60px); background: linear-gradient(180deg, #312e81, #1e1b4b); border-radius: 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #c7d2fe; font-weight: 700; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #6366f1; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 10px; color: #c7d2fe; font-size: .9rem; font-weight: 600; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px;
    font-family: inherit; font-size: 1.3rem; font-weight: 700; color: #e0e7ff;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(199, 210, 254, .2); border-radius: 14px;
    cursor: pointer;
  }
  .trg:hover { border-color: rgba(199, 210, 254, .5); }
  .trg[aria-expanded="true"] { border-color: #818cf8; }
  .trg:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
  .trg .arr { color: #818cf8; font-size: 1rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 10px);
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(199, 210, 254, .22);
    border-radius: 16px; padding: 20px; z-index: 5;
    backdrop-filter: blur(8px);
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: stretch; justify-content: center; gap: 10px; }
  .cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(199, 210, 254, .18); border-radius: 12px; }
  .cell label { font-size: .66rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #6366f1; }
  .dig {
    width: 100%; padding: 6px 2px;
    font-family: inherit; font-size: 2.6rem; font-weight: 700; text-align: center;
    color: #e0e7ff; background: transparent; border: none; outline: none;
  }
  .dig:focus-visible { outline: 2px solid #818cf8; outline-offset: 4px; border-radius: 6px; }
  .sep { align-self: center; color: #6366f1; font-size: 2.4rem; font-weight: 700; }
  .tip { margin: 16px 0 0; text-align: center; color: #818cf8; font-size: .78rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .selout span { color: #818cf8; font-size: .88rem; }
  .selout b { color: #e0e7ff; font-weight: 700; }
  .hint { margin-top: 2rem; color: #4338ca; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid rgba(199, 210, 254, .16); color: #818cf8; font-size: .78rem; }
  .credit a { color: #c7d2fe; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Slate Split</h1>
  <p class="sub">Two halves, one moment / Dos mitades, un instante</p>
  <label class="lbl" data-testid="label" id="lbl-tp09">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop09" aria-labelledby="lbl-tp09">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop09" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <div class="cell">
          <label for="h09">Hour</label>
          <input class="dig" id="h09" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="cell">
          <label for="m09">Minutes</label>
          <input class="dig" id="m09" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
        </div>
      </div>
      <p class="tip">Deep slate, quiet interface / Pizarra profunda, interfaz serena</p>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">An indigo study / Un estudio índigo</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
