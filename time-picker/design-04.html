<!-- Design 04: Digital Readout / Lectura Digital -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Readout Time Picker — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #06231a;
    overflow-x: hidden;
  }
  .stage { width: min(460px, 94vw); padding: clamp(36px, 8vw, 64px); background: #0a2f23; border-radius: 20px; box-shadow: inset 0 0 0 1px #0e3d2e, 0 30px 70px rgba(0, 0, 0, .5); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #4ade80; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .sub { margin: .4rem 0 2.4rem; color: #14532d; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #86efac; font-size: .9rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 20px 22px;
    font-family: "Consolas", "Courier New", monospace; font-size: 2.6rem; font-weight: 700; color: #4ade80;
    background: #04140e; border: 1px solid #14532d; border-radius: 12px;
    text-shadow: 0 0 16px rgba(74, 222, 128, .55);
    cursor: pointer;
  }
  .trg:hover { border-color: #22c55e; }
  .trg[aria-expanded="true"] { border-color: #4ade80; box-shadow: 0 0 24px rgba(74, 222, 128, .28); }
  .trg:focus-visible { outline: 3px solid #4ade80; outline-offset: 2px; }
  .trg .arr { color: #22c55e; font-size: 1.4rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 12px);
    background: #04140e; border: 1px solid #14532d; border-radius: 12px;
    padding: 20px; z-index: 5;
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .dig {
    width: 88px; padding: 14px 6px;
    font-family: "Consolas", "Courier New", monospace; font-size: 2.7rem; font-weight: 700; text-align: center;
    color: #4ade80; background: #06231a; border: 1px solid #14532d; border-radius: 8px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .5); outline: none;
  }
  .dig:focus { border-color: #4ade80; }
  .dig:focus-visible { outline: 3px solid #4ade80; outline-offset: 1px; }
  .sep { color: #22c55e; font-size: 2.4rem; font-weight: 700; text-shadow: 0 0 12px rgba(34, 197, 94, .6); }
  .tip { margin: 16px 0 0; text-align: center; color: #14532d; font-size: .8rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
  .selout span { color: #14532d; font-size: .88rem; }
  .selout b { color: #4ade80; font-family: "Consolas", "Courier New", monospace; font-size: 1.1rem; letter-spacing: .1em; }
  .hint { margin-top: 2rem; color: #0b3a29; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #0e3d2e; color: #14532d; font-size: .78rem; }
  .credit a { color: #4ade80; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Digital Readout</h1>
  <p class="sub">Glowing lab clock / Reloj de laboratorio brillante</p>
  <label class="lbl" data-testid="label" id="lbl-tp04">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop04" aria-labelledby="lbl-tp04">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop04" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <input class="dig" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        <span class="sep" aria-hidden="true">:</span>
        <input class="dig" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
      </div>
      <p class="tip">Direct entry, neon glow / Entrada directa, brillo neón</p>
    </div>
  </div>
  <p class="selout"><span>sys.time:</span> <b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">Seven-segment nostalgia / Nostalgia de siete segmentos</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
