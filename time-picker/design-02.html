<!-- Design 02: Split Flap Digits / Dígitos de Flap Dividido -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split Flap Digits Time Picker — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b0f14;
    overflow-x: hidden;
  }
  .stage { width: min(480px, 94vw); padding: clamp(34px, 8vw, 60px); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #f4b740; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .sub { margin: .4rem 0 2.2rem; color: #5a6673; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #cbd5e1; font-size: .9rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .wrap { display: inline-block; width: 100%; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px;
    font-family: "Consolas", "Courier New", monospace; font-size: 1.5rem; font-weight: 700;
    color: #ffe9b8; letter-spacing: .12em;
    background: #141a22; border: 1px solid #232c37; border-radius: 12px;
    cursor: pointer;
  }
  .trg[aria-expanded="true"] { border-color: #f4b740; box-shadow: 0 0 18px rgba(244, 183, 64, .18); }
  .trg:focus-visible { outline: 3px solid #f4b740; outline-offset: 2px; }
  .trg .arr { color: #f4b740; font-size: .95rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    margin-top: 12px;
    background: #141a22; border: 1px solid #232c37; border-radius: 14px;
    padding: 18px 20px;
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .cell {
    width: 62px; padding: 13px 4px;
    font-family: "Consolas", "Courier New", monospace; font-size: 1.9rem; font-weight: 700; text-align: center;
    color: #ffe9b8; background: #0b0f14; border: 1px solid #232c37; border-radius: 6px;
    outline: none; position: relative;
  }
  .cell::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; background: #1c232d; margin-top: -1px;
    box-shadow: 0 1px 0 rgba(244, 183, 64, .25);
  }
  .cell:focus { border-color: #f4b740; }
  .cell:focus-visible { outline: 3px solid #f4b740; outline-offset: 1px; }
  .sep { color: #f4b740; font-size: 1.8rem; font-weight: 700; }
  .tip { margin: 16px 0 0; text-align: center; color: #5a6673; font-size: .78rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .selout span { color: #5a6673; font-size: .88rem; }
  .selout b { color: #f4b740; font-family: "Consolas", "Courier New", monospace; letter-spacing: .08em; }
  .hint { margin-top: 2rem; color: #2c3540; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #1a212b; color: #5a6673; font-size: .78rem; }
  .credit a { color: #f4b740; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Split Flap Digits</h1>
  <p class="sub">Airport board mood / Ambiente de tablero de aeropuerto</p>
  <label class="lbl" data-testid="label" id="lbl-tp02">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop02" aria-labelledby="lbl-tp02">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop02" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <input class="cell" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        <span class="sep" aria-hidden="true">:</span>
        <input class="cell" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
      </div>
      <p class="tip">Flip the flaps / Gira los flaps</p>
    </div>
  </div>
  <p class="selout"><span>departure:</span> <b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">Retro, loud, precise / Retro, contundente, preciso</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
