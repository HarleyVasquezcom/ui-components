<!-- Design 06: Minimal Inline / Inline Mínimo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Inline Time Picker — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fafafa;
    overflow-x: hidden;
  }
  .stage { width: min(440px, 94vw); padding: clamp(40px, 9vw, 76px); }
  h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.2rem); color: #111827; font-weight: 200; letter-spacing: .02em; }
  .sub { margin: .4rem 0 3rem; color: #d1d5db; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 12px; color: #111827; font-size: .88rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 12px 2px 10px;
    font-family: inherit; font-size: 2.2rem; font-weight: 200; color: #111827; letter-spacing: .05em;
    background: transparent; border: none; border-bottom: 1.5px solid #e5e7eb;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .trg:hover { border-bottom-color: #111827; }
  .trg[aria-expanded="true"] { border-bottom-color: #111827; }
  .trg:focus-visible { outline: 2px solid #111827; outline-offset: 6px; }
  .trg .arr { color: #9ca3af; font-size: 1rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; top: calc(100% + 14px);
    background: #fff; border: 1px solid #f3f4f6; box-shadow: 0 22px 50px rgba(0, 0, 0, .07);
    padding: 26px 30px; z-index: 5;
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: baseline; gap: 12px; }
  .dig {
    width: 84px; padding: 6px 2px;
    font-family: inherit; font-size: 2.6rem; font-weight: 200; text-align: center; color: #111827;
    background: transparent; border: none; border-bottom: 1.5px solid #e5e7eb; outline: none;
    transition: border-color .15s ease;
  }
  .dig:focus { border-bottom-color: #111827; }
  .dig:focus-visible { outline: 2px solid #111827; outline-offset: 5px; }
  .sep { font-size: 2.4rem; font-weight: 200; color: #d1d5db; }
  .tip { margin: 24px 0 0; color: #d1d5db; font-size: .78rem; }
  .selout { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-top: 30px; }
  .selout span { color: #d1d5db; font-size: .84rem; }
  .selout b { color: #111827; font-weight: 400; font-size: 1.05rem; }
  .hint { margin-top: 2.6rem; color: #e5e7eb; font-size: .82rem; }
  .credit { margin-top: 2.6rem; padding-top: 1.2rem; border-top: 1px solid #f3f4f6; color: #d1d5db; font-size: .78rem; }
  .credit a { color: #111827; text-decoration: none; border-bottom: 1px solid #d1d5db; }
</style>
</head>
<body>
<main class="stage">
  <h1>Minimal Inline</h1>
  <p class="sub">Nothing but a line / Nada más que una línea</p>
  <label class="lbl" data-testid="label" id="lbl-tp06">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop06" aria-labelledby="lbl-tp06">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop06" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <input class="dig" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        <span class="sep" aria-hidden="true">:</span>
        <input class="dig" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
      </div>
      <p class="tip">Type or arrow / Escribe o usa flechas</p>
    </div>
  </div>
  <p class="selout"><span>set</span><b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">Quiet, precise, unobtrusive / Tranquilo, preciso, discreto</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
