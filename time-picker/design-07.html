<!-- Design 07: Dark Popover / Popover Oscuro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Popover Time Picker — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b1220;
    overflow-x: hidden;
  }
  .stage { width: min(460px, 94vw); padding: clamp(34px, 8vw, 60px); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #22d3ee; font-weight: 700; letter-spacing: -.01em; }
  .sub { margin: .4rem 0 2.2rem; color: #164e63; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 10px; color: #67e8f9; font-size: .9rem; font-weight: 600; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 20px;
    font-family: inherit; font-size: 1.6rem; font-weight: 700; color: #e2e8f0; letter-spacing: .04em;
    background: #111a2e; border: 1px solid #1e293b; border-radius: 14px;
    cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .trg:hover { border-color: #22d3ee; }
  .trg[aria-expanded="true"] { border-color: #22d3ee; box-shadow: 0 0 26px rgba(34, 211, 238, .22); }
  .trg:focus-visible { outline: 3px solid #22d3ee; outline-offset: 2px; }
  .trg .arr { color: #22d3ee; font-size: 1.05rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 12px);
    background: #111a2e; border: 1px solid #1e293b; border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .55);
    padding: 22px; z-index: 5;
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .col label { font-size: .66rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #334155; }
  .dig {
    width: 78px; padding: 13px 8px;
    font-family: inherit; font-size: 2.1rem; font-weight: 700; text-align: center; color: #22d3ee;
    background: #0b1220; border: 1px solid #1e293b; border-radius: 12px; outline: none;
    transition: border-color .15s ease;
  }
  .dig:focus { border-color: #22d3ee; box-shadow: 0 0 16px rgba(34, 211, 238, .25); }
  .dig:focus-visible { outline: 3px solid #22d3ee; outline-offset: 1px; }
  .sep { color: #334155; font-size: 2rem; font-weight: 700; padding-bottom: 16px; }
  .tip { margin: 16px 0 0; text-align: center; color: #334155; font-size: .78rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .selout span { color: #334155; font-size: .88rem; }
  .selout b { color: #22d3ee; font-weight: 700; }
  .hint { margin-top: 2rem; color: #164e63; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #16202f; color: #334155; font-size: .78rem; }
  .credit a { color: #22d3ee; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Dark Popover</h1>
  <p class="sub">Cyan glow, midnight chrome / Brillo cian, chrome de medianoche</p>
  <label class="lbl" data-testid="label" id="lbl-tp07">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop07" aria-labelledby="lbl-tp07">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop07" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <div class="col">
          <label for="h07">Hour</label>
          <input class="dig" id="h07" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="col">
          <label for="m07">Minutes</label>
          <input class="dig" id="m07" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
        </div>
      </div>
      <p class="tip">Dark side of the clock / El lado oscuro del reloj</p>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">Sleek, luminous, focused / Elegante, luminoso, enfocado</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
