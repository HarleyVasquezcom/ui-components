<!-- Design 10: Gradient Wheel / Rueda Degradada -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Wheel Time Picker — Design 10</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #020617;
    overflow-x: hidden;
  }
  .stage { width: min(480px, 94vw); padding: clamp(34px, 8vw, 60px); background: #0f172a; border-radius: 30px; box-shadow: 0 40px 90px rgba(0, 0, 0, .6); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #e879f9; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #6d28d9; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 10px; color: #f0abfc; font-size: .9rem; font-weight: 600; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 20px;
    font-family: inherit; font-size: 1.6rem; font-weight: 800; color: #fdf4ff; letter-spacing: .03em;
    background: linear-gradient(120deg, #4c1d95, #a21caf 50%, #db2777);
    border: none; border-radius: 18px;
    box-shadow: 0 10px 34px rgba(168, 85, 247, .35);
    cursor: pointer;
  }
  .trg[aria-expanded="true"] { box-shadow: 0 0 0 4px rgba(232, 121, 249, .35), 0 10px 34px rgba(168, 85, 247, .35); }
  .trg:focus-visible { outline: 3px solid #e879f9; outline-offset: 2px; }
  .trg .arr { color: #fbcfe8; font-size: 1.05rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 12px);
    background: #1e1b4b; border: 1px solid #4c1d95; border-radius: 20px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .6);
    padding: 22px; z-index: 5;
  }
  [hidden] { display: none !important; }
  .wheel { width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 50%; background: conic-gradient(#a855f7, #ec4899, #f97316, #a855f7); position: relative; }
  .wheel::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #1e1b4b; }
  .wheel b { position: absolute; inset: 0; display: grid; place-items: center; color: #f0abfc; font-size: .74rem; font-weight: 800; letter-spacing: .1em; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .col label { font-size: .66rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #a78bfa; }
  .dig {
    width: 76px; padding: 12px 8px;
    font-family: inherit; font-size: 2rem; font-weight: 800; text-align: center; color: #fdf4ff;
    background: #11103a; border: 1px solid #4c1d95; border-radius: 12px; outline: none;
  }
  .dig:focus { border-color: #e879f9; }
  .dig:focus-visible { outline: 3px solid #e879f9; outline-offset: 1px; }
  .sep { font-size: 2rem; color: #7c3aed; font-weight: 800; padding-bottom: 16px; }
  .ampm {
    padding: 12px 16px;
    font-family: inherit; font-size: .92rem; font-weight: 800; color: #fdf4ff;
    background: #11103a; border: 1px solid #4c1d95; border-radius: 12px; cursor: pointer;
  }
  .ampm:hover { border-color: #e879f9; }
  .ampm[aria-pressed="true"] { background: linear-gradient(120deg, #7c3aed, #db2777); border-color: #e879f9; }
  .ampm:focus-visible { outline: 3px solid #e879f9; outline-offset: 1px; }
  .tip { margin: 16px 0 0; text-align: center; color: #7c3aed; font-size: .78rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .selout span { color: #7c3aed; font-size: .88rem; }
  .selout b { color: #e879f9; font-weight: 800; }
  .hint { margin-top: 2rem; color: #4c1d95; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #312e81; color: #7c3aed; font-size: .78rem; }
  .credit a { color: #e879f9; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Gradient Wheel</h1>
  <p class="sub">Neon meridian, violet hour / Meridiano neón, hora violeta</p>
  <label class="lbl" data-testid="label" id="lbl-tp10">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop10" aria-labelledby="lbl-tp10">
      <span data-testid="value" aria-live="polite">10:30 AM</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop10" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="wheel" aria-hidden="true"><b>12h</b></div>
      <div class="row">
        <div class="col">
          <label for="h10">Hour</label>
          <input class="dig" id="h10" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="col">
          <label for="m10">Minutes</label>
          <input class="dig" id="m10" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
        </div>
        <div class="col">
          <label style="visibility:hidden;" aria-hidden="true">·</label>
          <button type="button" class="ampm" data-testid="ampm" aria-pressed="false">AM</button>
        </div>
      </div>
      <p class="tip">Turn the wheel, tap the meridian / Gira la rueda, toca el meridiano</p>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="display" aria-live="polite">10:30 AM</b></p>
  <p class="hint">Cosmic gradient, midnight violet / Degradado cósmico, violeta medianoche</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  const ampm = document.querySelector('[data-testid="ampm"]');
  const wheelDot = document.querySelector('.wheel b');
  let h = 10, m = 30, am = true;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const suf = am ? ' AM' : ' PM';
    const t = pad(h) + ':' + pad(m) + suf;
    value.textContent = t;
    display.textContent = t;
    ampm.textContent = am ? 'AM' : 'PM';
    ampm.setAttribute('aria-pressed', String(am));
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = ((n - 1) % 12 + 12) % 12 + 1; paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h % 12) + 1; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = ((h - 2 + 12) % 12) + 1; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  ampm.addEventListener('click', () => { am = !am; paint(); });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
