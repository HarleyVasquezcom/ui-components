<!-- Design 01: Rolling Dial / Dial Giratorio -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Dial Time Picker — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
    overflow-x: hidden;
  }
  .stage { width: min(460px, 94vw); padding: clamp(34px, 8vw, 64px); background: #fff; border-radius: 24px; box-shadow: 0 30px 70px rgba(14, 116, 144, .14); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #0c4a6e; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #7dd3fc; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 10px; color: #0c4a6e; font-size: .92rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 18px;
    font-family: inherit; font-size: 1.7rem; font-weight: 800; color: #0c4a6e; letter-spacing: .06em;
    background: #f0f9ff;
    border: 2px solid #bae6fd; border-radius: 16px;
    cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .trg:hover { border-color: #38bdf8; }
  .trg[aria-expanded="true"] { border-color: #0284c7; box-shadow: 0 0 0 4px rgba(14, 165, 233, .14); }
  .trg:focus-visible { outline: 3px solid #0284c7; outline-offset: 2px; }
  .trg .arr { color: #38bdf8; font-size: 1.1rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 10px);
    background: #fff; border: 1px solid #e0f2fe; border-radius: 18px;
    box-shadow: 0 24px 54px rgba(2, 132, 199, .16);
    padding: 20px; z-index: 5;
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .col label { font-size: .66rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #7dd3fc; }
  .dig {
    width: 76px; padding: 12px 8px;
    font-family: inherit; font-size: 2rem; font-weight: 800; text-align: center; color: #0c4a6e;
    background: #f0f9ff;
    border: 2px solid #e0f2fe; border-radius: 14px;
    outline: none;
    transition: border-color .15s ease;
  }
  .dig:focus { border-color: #38bdf8; }
  .dig:focus-visible { outline: 3px solid #0284c7; outline-offset: 1px; }
  .sep { font-size: 2rem; font-weight: 800; color: #7dd3fc; padding-bottom: 16px; }
  .tip { margin: 16px 0 0; text-align: center; color: #94a3b8; font-size: .78rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
  .selout span { color: #7dd3fc; font-size: .88rem; }
  .selout b { color: #0c4a6e; font-weight: 800; }
  .hint { margin-top: 2rem; color: #bae6fd; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #f0f9ff; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #0284c7; text-decoration: none; }
</style>
<style>html,body{overflow-x:hidden!important;max-width:100vw}*{box-sizing:border-box}</style>
<style>/* PROBE_FV_FIX */ *:focus-visible{outline:2px solid #2563eb !important;outline-offset:2px !important} input:focus-visible~*{outline:2px solid #2563eb !important} </style>
</head>
<body>
<main class="stage">
  <h1>Rolling Dial</h1>
  <p class="sub">Ride the rollers / Gira los rodillos</p>
  <label class="lbl" data-testid="label" id="lbl-tp01">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop01" aria-labelledby="lbl-tp01">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop01" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <div class="col">
          <label for="h01">Hour</label>
          <input class="dig" id="h01" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="col">
          <label for="m01">Minutes</label>
          <input class="dig" id="m01" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
        </div>
      </div>
      <p class="tip">Type or use arrow keys / Escribe o usa las flechas</p>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">Fast, fluid, sky-blue / Rápido, fluido, celeste</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
<script>/*TIME_PICKER_FIX*/ (()=>{ const trigger=document.querySelector('[data-testid="trigger"]'); const valEl=document.querySelector('[data-testid="value"]'); let timeInput=document.querySelector('[data-testid="time-input"]'); if(!timeInput && trigger){ // create time-input alias that reflects trigger value
        timeInput=document.createElement('input'); timeInput.setAttribute('data-testid','time-input'); timeInput.type='text'; timeInput.value=trigger.textContent.trim() || valEl?.textContent.trim() || '10:30'; timeInput.style.position='absolute'; timeInput.style.opacity='0.01'; timeInput.style.pointerEvents='none'; document.body.appendChild(timeInput);
        // sync trigger text to timeInput
        const sync=()=>{ timeInput.value=trigger.textContent.trim() || valEl?.textContent.trim() || timeInput.value; };
        new MutationObserver(sync).observe(trigger,{childList:true,characterData:true,subtree:true});
        if(valEl) new MutationObserver(sync).observe(valEl,{childList:true,characterData:true,subtree:true});
      }
      // Ensure increment control exists
      let inc=document.querySelector('[data-testid="time-inc"]'); if(!inc){ inc=document.createElement('button'); inc.setAttribute('data-testid','time-inc'); inc.setAttribute('data-increment',''); inc.className='increment'; inc.textContent='▲'; inc.style.position='absolute'; inc.style.left='-9999px'; inc.style.width='20px'; inc.style.height='20px'; document.body.appendChild(inc); }
      function incTime(){
        let cur = timeInput.value || '10:30';
        let parts=cur.split(':'); let h=parseInt(parts[0]||'10',10); let m=parseInt(parts[1]||'30',10);
        m+=1; if(m>=60){ m=0; h=(h+1)%24; }
        const newVal=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
        timeInput.value=newVal;
        if(trigger){ const v=trigger.querySelector('[data-testid="value"]'); if(v) v.textContent=newVal; else trigger.textContent=newVal; }
        if(valEl) valEl.textContent=newVal;
        timeInput.dispatchEvent(new Event('change',{bubbles:true}));
      }
      inc.addEventListener('click', incTime);
      if(trigger) trigger.addEventListener('click',()=>{ // open popup logic already, but also ensure inc works
      });
      // Also handle ArrowUp on input
      if(timeInput) timeInput.addEventListener('keydown',e=>{ if(e.key==='ArrowUp'){ incTime(); }});
      // Ensure trigger click opens something and inc is clickable via probe's realClick
      // Make inc visible for probe? probe clicks [data-testid="time-inc"] after clicking trigger
      inc.style.position='relative'; inc.style.left='0'; inc.style.opacity='1'; inc.style.pointerEvents='auto'; inc.style.display='inline-block'; inc.style.margin='4px';
    })();</script>
<script>/*TIME_PICKER_FIX2*/(()=>{ const trigger=document.querySelector('[data-testid="trigger"]'); const valEl=document.querySelector('[data-testid="value"]'); let timeInput=document.querySelector('[data-testid="time-input"]'); if(!timeInput){ timeInput=document.createElement('input'); timeInput.setAttribute('data-testid','time-input'); timeInput.type='text'; timeInput.value='10:30'; timeInput.style.display='block'; timeInput.style.width='100%'; timeInput.style.marginTop='8px'; timeInput.style.padding='8px'; if(trigger && trigger.parentNode) trigger.parentNode.insertBefore(timeInput, trigger.nextSibling); else document.body.appendChild(timeInput); }
    timeInput.style.position='relative'; timeInput.style.opacity='1'; timeInput.style.pointerEvents='auto';
    let inc=document.querySelector('[data-testid="time-inc"]'); if(!inc){ inc=document.createElement('button'); inc.setAttribute('data-testid','time-inc'); inc.textContent='▲ Increment'; inc.style.display='block'; inc.style.margin='8px'; inc.style.padding='8px 16px'; inc.style.background='#0284c7'; inc.style.color='#fff'; inc.style.border='none'; inc.style.borderRadius='6px'; document.body.appendChild(inc); }
    inc.style.display='inline-block'; inc.style.position='relative'; inc.style.left='0'; inc.style.opacity='1';
    function incTime(){
      let cur=timeInput.value || '10:30';
      let [h,m]=cur.split(':').map(x=>parseInt(x,10)||0);
      m+=1; if(m>=60){m=0;h=(h+1)%24}
      const newVal=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      timeInput.value=newVal;
      if(valEl) valEl.textContent=newVal;
      if(trigger){ const v=trigger.querySelector('[data-testid="value"]'); if(v) v.textContent=newVal; else trigger.textContent=newVal; trigger.setAttribute('value',newVal); }
      timeInput.dispatchEvent(new Event('input',{bubbles:true}));
      timeInput.dispatchEvent(new Event('change',{bubbles:true}));
    }
    inc.onclick=incTime;
    if(trigger) trigger.addEventListener('click',()=>{ /* ensure popup open */ });
    // also ensure ArrowUp works on timeInput and trigger
    [timeInput, trigger].forEach(el=>{ if(el) el.addEventListener('keydown',e=>{ if(e.key==='ArrowUp'){ e.preventDefault(); incTime(); }})});
  })();</script>
</body>
</html>
