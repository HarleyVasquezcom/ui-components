<!-- Design 01: Rolling Dial / Dial Giratorio -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Dial Time Picker — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
    overflow-x: hidden;
  }
  .stage { width: min(460px, 94vw); padding: clamp(34px, 8vw, 64px); background: #fff; border-radius: 24px; box-shadow: 0 30px 70px rgba(14, 116, 144, .14); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #0c4a6e; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #7dd3fc; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 10px; color: #0c4a6e; font-size: .92rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 16px 18px;
    font-family: inherit; font-size: 1.7rem; font-weight: 800; color: #0c4a6e; letter-spacing: .06em;
    background: #f0f9ff;
    border: 2px solid #bae6fd; border-radius: 16px;
    cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .trg:hover { border-color: #38bdf8; }
  .trg[aria-expanded="true"] { border-color: #0284c7; box-shadow: 0 0 0 4px rgba(14, 165, 233, .14); }
  .trg:focus-visible { outline: 3px solid #0284c7; outline-offset: 2px; }
  .trg .arr { color: #38bdf8; font-size: 1.1rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .pop {
    position: absolute; left: 0; right: 0; top: calc(100% + 10px);
    background: #fff; border: 1px solid #e0f2fe; border-radius: 18px;
    box-shadow: 0 24px 54px rgba(2, 132, 199, .16);
    padding: 20px; z-index: 5;
  }
  [hidden] { display: none !important; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .col label { font-size: .66rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #7dd3fc; }
  .dig {
    width: 76px; padding: 12px 8px;
    font-family: inherit; font-size: 2rem; font-weight: 800; text-align: center; color: #0c4a6e;
    background: #f0f9ff;
    border: 2px solid #e0f2fe; border-radius: 14px;
    outline: none;
    transition: border-color .15s ease;
  }
  .dig:focus { border-color: #38bdf8; }
  .dig:focus-visible { outline: 3px solid #0284c7; outline-offset: 1px; }
  .sep { font-size: 2rem; font-weight: 800; color: #7dd3fc; padding-bottom: 16px; }
  .tip { margin: 16px 0 0; text-align: center; color: #94a3b8; font-size: .78rem; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
  .selout span { color: #7dd3fc; font-size: .88rem; }
  .selout b { color: #0c4a6e; font-weight: 800; }
  .hint { margin-top: 2rem; color: #bae6fd; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #f0f9ff; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #0284c7; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Rolling Dial</h1>
  <p class="sub">Ride the rollers / Gira los rodillos</p>
  <label class="lbl" data-testid="label" id="lbl-tp01">Time</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop01" aria-labelledby="lbl-tp01">
      <span data-testid="value" aria-live="polite">10:30</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="pop01" data-testid="popup" role="dialog" aria-label="Pick a time" hidden>
      <div class="row">
        <div class="col">
          <label for="h01">Hour</label>
          <input class="dig" id="h01" data-testid="hour-in" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" value="10">
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="col">
          <label for="m01">Minutes</label>
          <input class="dig" id="m01" data-testid="min-in" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes" value="30">
        </div>
      </div>
      <p class="tip">Type or use arrow keys / Escribe o usa las flechas</p>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="display" aria-live="polite">10:30</b></p>
  <p class="hint">Fast, fluid, sky-blue / Rápido, fluido, celeste</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const trigger = document.querySelector('[data-testid="trigger"]');
  const popup = document.querySelector('[data-testid="popup"]');
  const value = document.querySelector('[data-testid="value"]');
  const display = document.querySelector('[data-testid="display"]');
  const hIn = document.querySelector('[data-testid="hour-in"]');
  const mIn = document.querySelector('[data-testid="min-in"]');
  let h = 10, m = 30;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pad = (n) => String(n).padStart(2, '0');
  function paint() {
    const t = pad(h) + ':' + pad(m);
    value.textContent = t;
    display.textContent = t;
    if (hIn !== document.activeElement) hIn.value = pad(h);
    if (mIn !== document.activeElement) mIn.value = pad(m);
  }
  hIn.addEventListener('input', () => { const n = parseInt(hIn.value, 10); if (!isNaN(n)) h = clamp(n, 0, 23); paint(); });
  hIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); h = (h + 1) % 24; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); h = (h + 23) % 24; paint(); }
  });
  mIn.addEventListener('input', () => { const n = parseInt(mIn.value, 10); if (!isNaN(n)) m = clamp(n, 0, 59); paint(); });
  mIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); m = (m + 1) % 60; paint(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); m = (m + 59) % 60; paint(); }
  });
  trigger.addEventListener('click', () => {
    popup.hidden = !popup.hidden;
    trigger.setAttribute('aria-expanded', String(!popup.hidden));
    if (!popup.hidden) hIn.focus();
  });
  paint();
</script>
</body>
</html>
