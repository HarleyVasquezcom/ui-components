<!-- Design 02: Minimal Line / Minimal Line Chart -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e2e8f0;
    color: #334155;
    overflow-x: hidden;
  }
  .chart { width: min(90vw, 600px); margin: 40px auto; position: relative; }
  .chart-line { position: relative; height: 300px; }
  .chart-line path { fill: none; stroke: #64748b; stroke-width: 2; }
  .chart-line circle { fill: #3b82f6; stroke: #fff; stroke-width: 2; }
  .chart-line .label { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-size: .65rem; color: #64748b; white-space: nowrap; }
  .chart-line .value { position: absolute; top: -16px; right: 0; background: #fff; padding: 2px 6px; border-radius: 4px; font-size: .65rem; color: #3b82f6; font-weight: 600; }
  .chart-axis { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; display: flex; justify-content: space-between; font-size: .65rem; color: #64748b; }
  .chart-title { text-align: center; margin-bottom: 16px; font-size: 1rem; font-weight: 600; color: #1e293b; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .chart { margin: 20px; } }
</style>
</head>
<body>
<div data-testid="label" class="label">Charts</div>
<div class="chart" data-testid="chart" aria-label="Chart design" data-chart>
  <div class="chart-title">Website Traffic</div>
  <div class="chart-axis"><span>Day 1</span><span>Day 5</span><span>Day 10</span><span>Day 15</span><span>Day 20</span><span>Day 25</span><span>Day 30</span></div>
  <div class="chart-line"><svg width="100%" height="300"><path d="M40,280 C60,250 80,220 100,210 C120,190 140,170 160,150 C180,130 200,120 220,130 C240,140 260,160 280,170 C300,180 320,190 340,195"/></svg></div>
  <div class="chart-legend"><span class="legend-item"><span class="legend-color" style="background:#3b82f6"></span>Visits</span></span></div>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
