<!-- Design 03: Terminal Chart / Terminal Chart -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Design 03</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Menlo", "Monaco", "Courier New", monospace;
    background: #0f172a;
    color: #f1f5f9;
    overflow-x: hidden;
  }
  .chart { width: min(90vw, 600px); margin: 40px auto; position: relative; }
  .chart-bar { width: 32px; background: #334155; margin: 0 2px; height: calc(100% - 4px); position: relative; border-radius: 2px; transition: height .3s; }
  .chart-bar:hover { background: #3b82f6; }
  .chart-bar .label { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); font-size: .6rem; color: #94a3b8; white-space: nowrap; }
  .chart-bar .value { position: absolute; top: -8px; right: 0; background: #fff; padding: 1px 3px; border-radius: 3px; font-size: .55rem; color: #334155; font-weight: 600; }
  .chart-axis { position: absolute; bottom: 0; left: 0; right: 0; height: 16px; display: flex; justify-content: space-between; font-size: .55rem; color: #94a3b8; }
  .chart-title { text-align: center; margin-bottom: 16px; font-size: .875rem; font-weight: 600; color: #f1f5f9; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #334155; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #64748b; text-decoration: none; }
  @media (max-width: 480px) { .chart { margin: 20px; } }
</style>
</head>
<body>
<div data-testid="label" class="label">Charts</div>
<div class="chart" data-testid="chart" aria-label="Chart design" data-chart>
  <div class="chart-title">Server Load</div>
  <div class="chart-axis"><span>00</span><span>04</span><span>08</span><span>12</span><span>16</span><span>20</span><span>24</span></div>
  <div class="chart-legend"><span class="legend-item"><span class="legend-color" style="background:#334155"></server load></span></span></div>
  <div class="chart-bar" style="height: 85%;"><span class="label">92%</span><span class="value">92%</span></div>
  <div class="chart-bar" style="height: 60%;"><span class="label">58%</span><span class="value">58%</span></div>
  <div class="chart-bar" style="height: 45%;"><span class="label">41%</span><span class="value">41%</span></div>
  <div class="chart-bar" style="height: 75%;"><span class="label">73%</span><span class="value">73%</span></div>
  <div class="chart-bar" style="height: 30%;"><span class="label">24%</span><span class="value">24%</span></div>
  <div class="chart-bar" style="height: 90%;"><span class="label">98%</span><span class="value">98%</span></div>

  <svg data-testid="chart-svg" width="100%" height="200" viewBox="0 0 600 200" aria-label="Chart visualization">
    <rect x="10" y="40" width="80" height="160" fill="#3b82f6" rx="4"/>
    <rect x="110" y="70" width="80" height="130" fill="#3b82f6" rx="4"/>
    <rect x="210" y="50" width="80" height="150" fill="#3b82f6" rx="4"/>
    <rect x="310" y="20" width="80" height="180" fill="#3b82f6" rx="4"/>
    <rect x="410" y="80" width="80" height="120" fill="#3b82f6" rx="4"/>
    <rect x="510" y="30" width="80" height="170" fill="#3b82f6" rx="4"/>
  </svg>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
