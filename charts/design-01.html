<!-- Design 01: Bar Chart / Bar Chart -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    overflow-x: hidden;
  }
  .chart { width: min(90vw, 600px); margin: 40px auto; position: relative; }
  .chart-bar { width: 40px; background: #3b82f6; margin: 0 4px; height: calc(100% - 4px); position: relative; border-radius: 4px 4px 0 0; transition: height .4s; }
  .chart-bar:hover { background: #2563eb; }
  .chart-bar .label { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: .65rem; color: #64748b; white-space: nowrap; }
  .chart-bar .value { position: absolute; top: -12px; right: 0; background: #fff; padding: 2px 4px; border-radius: 4px; font-size: .65rem; color: #3b82f6; font-weight: 600; }
  .chart-axis { position: absolute; bottom: 0; left: 0; right: 0; height: 20px; display: flex; justify-content: space-between; font-size: .65rem; color: #64748b; }
  .chart-title { text-align: center; margin-bottom: 16px; font-size: 1rem; font-weight: 600; color: #1e293b; }
  .chart-legend { display: flex; justify-content: center; gap: 16px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: #64748b; }
  .legend-color { width: 12px; height: 12px; border-radius: 50%; }
  .chart:focus-visible { outline: 2px solid #64748b; outline-offset: 8px; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .chart { margin: 20px; } }
</style>
</head>
<body>
<div data-testid="label" class="label">Charts</div>
<div class="chart" data-testid="chart" aria-label="Chart design" data-chart>
  <div class="chart-title">Monthly Active Users</div>
  <div class="chart-axis"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span></div>
  <div class="chart-legend"><span class="legend-item"><span class="legend-color" style="background:#3b82f6"></span>Active</span><span class="legend-item"><span class="legend-color" style="background:#fbbf24"></span>Growth</span></span></div>
  <div class="chart-bar" style="height: 70%;"><span class="label">48K</span><span class="value">48K</span></div>
  <div class="chart-bar" style="height: 55%;"><span class="label">45K</span><span class="value">45K</span></div>
  <div class="chart-bar" style="height: 65%;"><span class="label">42K</span><span class="value">42K</span></div>
  <div class="chart-bar" style="height: 80%;"><span class="label">55K</span><span class="value">55K</span></div>
  <div class="chart-bar" style="height: 50%;"><span class="label">38K</span><span class="value">38K</span></div>
  <div class="chart-bar" style="height: 75%;"><span class="label">50K</span><span class="value">50K</span></div>

  <svg data-testid="chart-svg" width="100%" height="200" viewBox="0 0 600 200" aria-label="Chart visualization">
    <rect x="10" y="40" width="80" height="160" fill="#3b82f6" rx="4"/>
    <rect x="110" y="70" width="80" height="130" fill="#3b82f6" rx="4"/>
    <rect x="210" y="50" width="80" height="150" fill="#3b82f6" rx="4"/>
    <rect x="310" y="20" width="80" height="180" fill="#3b82f6" rx="4"/>
    <rect x="410" y="80" width="80" height="120" fill="#3b82f6" rx="4"/>
    <rect x="510" y="30" width="80" height="170" fill="#3b82f6" rx="4"/>
  </svg>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
