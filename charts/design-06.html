<!-- Design 06: Pill Chart / Pill Chart -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    overflow-x: hidden;
  }
  .chart { width: min(90vw, 600px); margin: 40px auto; position: relative; }
  .chart-bar { width: 36px; background: #fff; margin: 0 3px; border: 2px solid #e2e8f0; height: calc(100% - 4px); position: relative; border-radius: 50px; transition: border-color .2s; }
  .chart-bar:hover { border-color: #3b82f6; }
  .chart-bar .label { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-size: .65rem; color: #64748b; white-space: nowrap; }
  .chart-bar .value { position: absolute; top: -6px; right: 0; background: #fff; padding: 1px 3px; border-radius: 3px; font-size: .55rem; color: #3b82f6; font-weight: 600; }
  .chart-axis { position: absolute; bottom: 0; left: 0; right: 0; height: 16px; display: flex; justify-content: space-between; font-size: .55rem; color: #64748b; }
  .chart-title { text-align: center; margin-bottom: 16px; font-size: 1rem; font-weight: 600; color: #1e293b; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .chart { margin: 20px; } }
</style>
</head>
<body>
<div data-testid="label" class="label">Charts</div>
<div class="chart" data-testid="chart" aria-label="Chart design" data-chart>
  <div class="chart-title">User Growth</div>
  <div class="chart-axis"><span>Week 1</span><span>Week 2</span><span>Week 3</span><span>Week 4</span><span>Week 5</span><span>Week 6</span><span>Week 7</span></div>
  <div class="chart-legend"><span class="legend-item"><span class="legend-color" style="background:#fff"></span>Users</span></span></div>
  <div class="chart-bar" style="height: 65%;"><span class="label">12K</span><span class="value">12K</span></div>
  <div class="chart-bar" style="height: 75%;"><span class="label">15K</span><span class="value">15K</span></div>
  <div class="chart-bar" style="height: 50%;"><span class="label">10K</span><span class="value">10K</span></div>
  <div class="chart-bar" style="height: 85%;"><span class="label">18K</span><span class="value">18K</span></div>
  <div class="chart-bar" style="height: 40%;"><span class="label">7K</span><span class="value">7K</span></div>
  <div class="chart-bar" style="height: 90%;"><span class="label">22K</span><span class="value">22K</span></div>

  <svg data-testid="chart-svg" width="100%" height="200" viewBox="0 0 600 200" aria-label="Chart visualization">
    <rect x="10" y="40" width="80" height="160" fill="#3b82f6" rx="4"/>
    <rect x="110" y="70" width="80" height="130" fill="#3b82f6" rx="4"/>
    <rect x="210" y="50" width="80" height="150" fill="#3b82f6" rx="4"/>
    <rect x="310" y="20" width="80" height="180" fill="#3b82f6" rx="4"/>
    <rect x="410" y="80" width="80" height="120" fill="#3b82f6" rx="4"/>
    <rect x="510" y="30" width="80" height="170" fill="#3b82f6" rx="4"/>
  </svg>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
