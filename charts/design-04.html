<!-- Design 04: Gradient Chart / Gradient Chart -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f1f5f9;
    color: #334155;
    overflow-x: hidden;
  }
  .chart { width: min(90vw, 600px); margin: 40px auto; position: relative; }
  .chart-bar { width: 36px; background: linear-gradient(135deg, #6b46c1 0%, #a855f7 100%); margin: 0 3px; height: calc(100% - 4px); position: relative; border-radius: 4px; transition: transform .2s; }
  .chart-bar:hover { transform: translateY(-2px); }
  .chart-bar .label { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); font-size: .65rem; color: #64748b; white-space: nowrap; }
  .chart-bar .value { position: absolute; top: -10px; right: 0; background: rgba(255,255,255,0.8); padding: 2px 4px; border-radius: 4px; font-size: .65rem; color: #6b46c1; font-weight: 600; }
  .chart-axis { position: absolute; bottom: 0; left: 0; right: 0; height: 20px; display: flex; justify-content: space-between; font-size: .65rem; color: #64748b; }
  .chart-title { text-align: center; margin-bottom: 16px; font-size: 1rem; font-weight: 600; color: #1e293b; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #cbd5e1; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .chart { margin: 20px; } }
</style>
</head>
<body>
<div data-testid="label" class="label">Charts</div>
<div class="chart" data-testid="chart" aria-label="Chart design" data-chart>
  <div class="chart-title">Revenue Q4</div>
  <div class="chart-axis"><span>Oct</span><span>Nov</span><span>Dec</span><span>Jan</span><span>Feb</span><span>Mar</span></div>
  <div class="chart-legend"><span class="legend-item"><span class="legend-color" style="background:linear-gradient(135deg,#6b46c1,#a855f7)"></span>Revenue</span></span></div>
  <div class="chart-bar" style="height: 70%;"><span class="label">$45K</span><span class="value">$45K</span></div>
  <div class="chart-bar" style="height: 85%;"><span class="label">$62K</span><span class="value">$62K</span></div>
  <div class="chart-bar" style="height: 60%;"><span class="label">$38K</span><span class="value">$38K</span></div>
  <div class="chart-bar" style="height: 90%;"><span class="label">$75K</span><span class="value">$75K</span></div>
  <div class="chart-bar" style="height: 55%;"><span class="label">$41K</span><span class="value">$41K</span></div>
  <div class="chart-bar" style="height: 75%;"><span class="label">$53K</span><span class="value">$53K</span></div>

  <svg data-testid="chart-svg" width="100%" height="200" viewBox="0 0 600 200" aria-label="Chart visualization">
    <rect x="10" y="40" width="80" height="160" fill="#3b82f6" rx="4"/>
    <rect x="110" y="70" width="80" height="130" fill="#3b82f6" rx="4"/>
    <rect x="210" y="50" width="80" height="150" fill="#3b82f6" rx="4"/>
    <rect x="310" y="20" width="80" height="180" fill="#3b82f6" rx="4"/>
    <rect x="410" y="80" width="80" height="120" fill="#3b82f6" rx="4"/>
    <rect x="510" y="30" width="80" height="170" fill="#3b82f6" rx="4"/>
  </svg>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
