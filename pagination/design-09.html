<!-- Design 09: Paginación con Íconos de Nube / Cloud Icon Pagination -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; background: #f8fafc; color: #0f172a; overflow-x: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 24px 0; }
  .tag {
    display: inline-block;
    padding: 6px 12px;
    background: #e2e8f0;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 500;
    color: #334155;
    transition: all .15s;
  }
  .tag:hover { background: #cbd5e1; transform: translateY(-1px); }
  .active-tag { background: #3b82f6; color: #fff; }
  .pagination-wrapper { width: min(500px, 95vw); text-align: center; }
  .page-link {
    display: inline-block;
    margin: 2px 3px;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid #94a3b8;
    border-radius: 4px;
    color: #334155;
    font-size: .75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .page-link:hover { border-color: #64748b; color: #1e293b; }
  .page-link.active { background: #e2e8f0; border-color: #1e293b; color: #1e293b; }
  .page-link.disabled { color: #9ca3af; pointer-events: none; }
  .page-numbers { margin: 16px 0; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .page-item { flex: 0 0 auto; }
  .ellipsis { color: #64748b; }
  .page-info { margin: 24px 0; color: #64748b; font-size: .75rem; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .75rem; text-align: center; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .pagination-wrapper { padding: 16px; } }
</style>
</head>
<body>
<div class="tags">
  <span class="tag active-tag">Web</span>
  <span class="tag">Desarrollo</span>
  <span class="tag">Diseño</span>
  <span class="tag">Marketing</span>
  <span class="tag">SEO</span>
</div>
<div class="pagination-wrapper" data-testid="pagination" aria-label="Pagination">
  <nav aria-label="Paginación" role="navigation" data-pagination>
    <div class="page-numbers">
      <span class="page-item active"><a class="page-link" href="#">1</a></span>
      <span class="page-item"><a class="page-link" href="#">2</a></span>
      <span class="page-item"><a class="page-link" href="#">3</a></span>
      <span class="page-item ellipsis">…</span>
      <span class="page-item"><a class="page-link" href="#">15</a></span>
    </div>
    <div class="page-info">Mostrando 1-8 de 120 artículos</div>
    <button class="page-link" aria-label="Siguiente página" data-next>Siguiente <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></button>
  </nav>
</div>
<script>
  (() => {
    const links = document.querySelectorAll('.page-link:not(.disabled)');
    const info = document.querySelector('.page-info');
    let current = 1;
    function update() {
      info.textContent = `Mostrando ${Math.min((current)*8, 96)}-${Math.min((current)*8+7, 96)} de 120 artículos`;
      links.forEach((l, i) => {
        l.classList.toggle('active', i === current - 1);
        l.setAttribute('aria-current', i === current - 1 ? 'page' : null);
      });
    }
    document.querySelector('[data-next]').addEventListener('click', () => {
      if (current < 120) { current++; update(); }
    });
    links.forEach((l, i) => {
      l.addEventListener('click', (e) => {
        e.preventDefault();
        current = i + 1;
        update();
      });
    });
    update();
  })();
</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
