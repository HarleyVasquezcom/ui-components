<!-- Design 07: Paginación con Visualización de Saltos / Jump-Through Pagination -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; background: #f1f5f9; color: #0f172a; overflow-x: hidden; }
  .pagination-wrapper { width: min(500px, 95vw); text-align: center; padding: 32px 20px; }
  .page-link {
    display: inline-block;
    margin: 0 2px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    color: #0f172a;
    font-size: .75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .page-link:hover { border-color: #94a3b8; }
  .page-link.active { background: #e2e8f0; border-color: #1e293b; color: #1e293b; }
  .page-link.disabled { color: #94a3b8; pointer-events: none; }
  .jump-input { margin: 0 8px; }
  .jump-input input { width: 40px; padding: 4px; border: 1px solid #94a3b8; border-radius: 4px; text-align: center; font-size: .75rem; }
  .jump-input span { display: inline-block; padding: 0 4px; color: #64748b; font-size: .75rem; }
  .page-numbers { margin: 16px 0; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .page-item { flex: 0 0 auto; }
  .ellipsis { color: #64748b; }
  .page-info { margin: 24px 0; color: #64748b; font-size: .75rem; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .75rem; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .pagination-wrapper { padding: 20px 10px; } }
</style>
</head>
<body>
<div class="pagination-wrapper" data-testid="pagination" aria-label="Pagination">
  <nav aria-label="Paginación" role="navigation" data-pagination>
    <div class="page-numbers">
      <span class="page-item active"><a class="page-link" href="#">1</a></span>
      <span class="page-item"><a class="page-link" href="#">2</a></span>
      <span class="page-item"><a class="page-link" href="#">3</a></span>
      <div class="jump-input">
        <span>ir a:</span>
        <input type="number" min="1" max="15" value="1" aria-label="Número de página">
        <span>/15</span>
      </div>
    </div>
    <div class="page-info">Mostrando 1-10 de 104 resultados</div>
    <button class="page-link" aria-label="Siguiente página" data-next>Siguiente <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg></button>
  </nav>
</div>
<script>
  (() => {
    const links = document.querySelectorAll('.page-link:not(.disabled)');
    const info = document.querySelector('.page-info');
    const jumpInput = document.querySelector('.jump-input input');
    let current = 1;
    function update() {
      info.textContent = `Mostrando ${Math.min((current)*10, 104)}-${Math.min((current)*10+9, 104)} de 104 resultados`;
      links.forEach((l, i) => {
        l.classList.toggle('active', i === current - 1);
        l.setAttribute('aria-current', i === current - 1 ? 'page' : null);
      });
      if (jumpInput) {
        jumpInput.value = current;
      }
    }
    document.querySelector('[data-next]').addEventListener('click', () => {
      if (current < 104) { current++; update(); }
    });
    if (jumpInput) {
      jumpInput.addEventListener('change', (e) => {
        const val = Math.max(1, Math.min(15, parseInt(e.target.value) || 1));
        current = val;
        update();
      });
    }
    links.forEach((l, i) => {
      l.addEventListener('click', (e) => {
        e.preventDefault();
        current = i + 1;
        update();
      });
    });
    update();
  })();
</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
