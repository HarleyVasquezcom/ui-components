<!-- Design 09: Editorial Sharp / Editorial Afilado -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Sharp Button — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Didot", "Playfair Display", Georgia, serif;
    background: #faf8f3;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(30px, 6vw, 64px);
    background: #faf8f3;
    border-left: 6px solid #111;
    text-align: left;
  }
  .eyebrow { font-size: .72rem; letter-spacing: .34em; text-transform: uppercase; color: #8f887a; margin: 0 0 1rem; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; color: #111; letter-spacing: -.01em; line-height: 1.05; }
  .sub { margin: .8rem 0 2.6rem; font-style: italic; color: #6d6655; font-size: 1rem; max-width: 44ch; }
  .btn {
    display: inline-flex; align-items: center; gap: 18px;
    padding: 0 0 10px;
    font-family: inherit;
    font-size: 1.25rem; font-weight: 700; letter-spacing: .02em;
    color: #111;
    background: transparent;
    border: none; border-bottom: 2px solid #111;
    border-radius: 0;
    cursor: pointer;
    position: relative;
  }
  .btn::after {
    content: ""; position: absolute; left: 0; bottom: -2px;
    width: 0; height: 2px; background: #c9a227;
    transition: width .35s cubic-bezier(.7,0,.3,1);
  }
  .btn:hover::after { width: 100%; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid #111; outline-offset: 8px; }
  .btn .no { font-size: .9rem; font-style: italic; color: #c9a227; font-variant-numeric: tabular-nums; }
  .btn:hover .no { color: #111; }
  .hint { margin-top: 2.2rem; font-size: .82rem; color: #9a937f; font-style: italic; }
  .credit { margin-top: 2.6rem; padding-top: 1rem; border-top: 1px solid #ddd6c4; font-family: "Segoe UI", sans-serif; font-size: .78rem; color: #9a937f; }
  .credit a { color: #111; }
</style>
</head>
<body>
<main class="stage">
  <p class="eyebrow">Chapter · 01</p>
  <h1>Editorial Sharp</h1>
  <p class="sub">A quiet, sharp action for the printed page / Una acción sobria y afilada para la página impresa</p>
  <button type="button" class="btn" data-testid="btn" aria-label="Subscribe to the issue">
    <span>Subscribe</span>
    <span class="no" aria-live="polite">no. <b data-testid="count">0</b></span>
  </button>
  <p class="hint">Click to subscribe — / Clic para suscribirse</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const btn = document.querySelector('[data-testid="btn"]');
  const count = document.querySelector('[data-testid="count"]');
  let n = 0;
  btn.addEventListener('click', () => { n += 1; count.textContent = n; });
</script>
</body>
</html>
