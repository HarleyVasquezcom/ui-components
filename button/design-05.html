<!-- Design 05: Gradient Mesh / Malla de Degradado -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Mesh Button — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #1a1033;
    overflow-x: hidden;
  }
  .mesh {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(40% 40% at 15% 20%, #ff5fa2 0%, transparent 65%),
      radial-gradient(40% 40% at 85% 15%, #5f8dff 0%, transparent 65%),
      radial-gradient(45% 45% at 75% 80%, #4dffb8 0%, transparent 65%),
      radial-gradient(40% 40% at 20% 85%, #ffd75f 0%, transparent 65%),
      linear-gradient(140deg, #241245, #14123a);
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { filter: hue-rotate(0deg) saturate(1); }
    100% { filter: hue-rotate(28deg) saturate(1.15); }
  }
  .stage {
    position: relative; z-index: 1;
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: rgba(255,255,255,.92);
    border-radius: 4px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    text-align: center;
  }
  h1 {
    margin: 0; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800;
    background: linear-gradient(90deg, #ff5fa2, #5f8dff, #4dffb8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: .4rem 0 2.2rem; color: #6b6580; font-size: .92rem; }
  .btn {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 36px;
    font-size: 1.05rem; font-weight: 700; letter-spacing: .02em;
    color: #fff;
    background: linear-gradient(120deg, #ff5fa2, #b16bff 45%, #5f8dff);
    background-size: 200% 200%;
    border: none; border-radius: 999px;
    cursor: pointer;
    transition: background-position .4s ease, transform .15s ease, box-shadow .2s ease;
    box-shadow: 0 10px 30px rgba(177,107,255,.45);
  }
  .btn:hover { background-position: 100% 50%; transform: translateY(-2px); box-shadow: 0 14px 36px rgba(95,141,255,.55); }
  .btn:active { transform: translateY(1px) scale(.97); }
  .btn:focus-visible { outline: 3px solid #5f8dff; outline-offset: 4px; }
  .btn .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255,255,255,.25);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .btn .count {
    font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.22);
    padding: 2px 10px; border-radius: 999px; font-size: .9rem;
  }
  .hint { margin-top: 1.6rem; color: #8a84a0; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid #e5e2ee; color: #8a84a0; font-size: .8rem; }
  .credit a { color: #5f8dff; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<main class="stage">
  <h1>Gradient Mesh</h1>
  <p class="sub">Living color that shifts as you press / Color vivo que cambia al presionar</p>
  <button type="button" class="btn" data-testid="btn" aria-label="Press gradient button">
    <span class="dot" aria-hidden="true"></span>
    <span>Cast spell</span>
    <span class="count" aria-live="polite"><b data-testid="count">0</b></span>
  </button>
  <p class="hint">Click to count casts — / Clic para contar lanzamientos</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const btn = document.querySelector('[data-testid="btn"]');
  const count = document.querySelector('[data-testid="count"]');
  let n = 0;
  btn.addEventListener('click', () => { n += 1; count.textContent = n; });
</script>
</body>
</html>
