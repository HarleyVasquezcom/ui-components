<!-- Design 04: Terminal Pulse / Terminal con Pulso -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Pulse Button — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
    background: #050505;
    color: #33ff66;
    overflow-x: hidden;
  }
  .scanlines {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
  }
  .stage {
    position: relative; z-index: 1;
    width: min(640px, 94vw);
    padding: clamp(24px, 6vw, 56px);
    background: #0a0f0a;
    border: 1px solid #1e3a24;
    box-shadow: 0 0 0 1px #111, 0 0 40px rgba(51,255,102,.08);
    text-align: left;
    overflow: hidden;
  }
  .termbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; margin: -24px -56px 0 0;
    background: #111; border-bottom: 1px solid #1e3a24;
    font-size: .75rem; color: #5faa72;
  }
  .termbar b { color: #33ff66; }
  h1 { margin: 1.4rem 0 .2rem; font-size: clamp(1.2rem, 3.5vw, 1.8rem); font-weight: 700; color: #33ff66; text-transform: uppercase; letter-spacing: .12em; }
  .sub { margin: 0 0 1.6rem; font-size: .82rem; color: #6f9a7c; }
  .cmdline { font-size: .85rem; color: #4a8f5c; margin-bottom: 1.4rem; }
  .cmdline .prompt { color: #33ff66; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    font-family: inherit; font-size: .95rem; font-weight: 700;
    color: #0a0f0a;
    background: #33ff66;
    border: 1px solid #33ff66;
    border-radius: 2px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .btn:hover { background: #0a0f0a; color: #33ff66; box-shadow: 0 0 14px rgba(51,255,102,.5); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid #33ff66; outline-offset: 3px; background: #0a0f0a; color: #33ff66; }
  .btn[aria-busy="true"] { pointer-events: none; background: #0a0f0a; color: #33ff66; }
  .spinner { display: none; width: 14px; height: 14px; border: 2px solid #1e3a24; border-top-color: #33ff66; border-radius: 50%; animation: spin .6s linear infinite; }
  .btn[aria-busy="true"] .spinner { display: inline-block; }
  .log { font-size: .8rem; color: #4a8f5c; min-height: 1.2em; margin-top: 1.2rem; }
  .log b { color: #33ff66; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .credit { margin-top: 2rem; padding-top: .8rem; border-top: 1px dashed #1e3a24; font-size: .75rem; color: #4a8f5c; }
  .credit a { color: #33ff66; text-decoration: none; }
</style>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<main class="stage">
  <div class="termbar"><span><b>▲</b> ui-components:~</span><span>sprint-01</span></div>
  <h1>Terminal Pulse</h1>
  <p class="sub">Run the job — / Ejecutar el trabajo</p>
  <p class="cmdline"><span class="prompt">$</span> deploy --button --count <b data-testid="count">0</b></p>
  <button type="button" class="btn" data-testid="btn" aria-label="Run terminal deploy">
    <span class="spinner" data-testid="spinner" aria-hidden="true"></span>
    <span>RUN DEPLOY</span>
  </button>
  <p class="log" id="log" aria-live="polite">[ok] idle. click to run.</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const btn = document.querySelector('[data-testid="btn"]');
  const count = document.querySelector('[data-testid="count"]');
  const log = document.getElementById('log');
  let n = 0;
  let busy = false;
  btn.addEventListener('click', () => {
    if (busy) return;
    busy = true;
    btn.setAttribute('aria-busy', 'true');
    log.innerHTML = '[..] running build<span class="cursor">_</span>';
    setTimeout(() => {
      busy = false;
      n += 1;
      count.textContent = n;
      btn.setAttribute('aria-busy', 'false');
      log.innerHTML = '[ok] build #' + n + ' finished in 700ms';
    }, 700);
  });
</script>
</body>
</html>
