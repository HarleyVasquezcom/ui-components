<!-- Design 02: Neumorph Soft / Neumorfismo Suave -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neumorph Soft Button — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #dfe6f0;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 64px);
    border-radius: 34px;
    background: #dfe6f0;
    box-shadow: 14px 14px 34px #b7c1d0, -14px -14px 34px #ffffff;
    text-align: center;
  }
  h1 { margin: 0; color: #4a5468; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 500; letter-spacing: .02em; }
  .sub { margin: .4rem 0 2.4rem; color: #7b8698; font-size: .9rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 18px 38px;
    font-size: 1.05rem; font-weight: 600; letter-spacing: .03em;
    color: #4a5468;
    background: #dfe6f0;
    border: none;
    border-radius: 18px;
    box-shadow: 8px 8px 18px #b7c1d0, -8px -8px 18px #ffffff;
    cursor: pointer;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .btn:hover { box-shadow: 10px 10px 22px #b7c1d0, -10px -10px 22px #ffffff; }
  .btn:active, .btn.pressed {
    transform: translateY(1px) scale(.99);
    box-shadow: inset 6px 6px 12px #b7c1d0, inset -6px -6px 12px #ffffff;
  }
  .btn:focus-visible { outline: 3px solid #7ea0d6; outline-offset: 4px; }
  .knob {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #eef3fa, #d2dbe8);
    box-shadow: 4px 4px 8px #b7c1d0, -4px -4px 8px #ffffff;
    font-size: .85rem; color: #7ea0d6; font-weight: 700;
  }
  .btn:active .knob { box-shadow: inset 3px 3px 6px #b7c1d0, inset -3px -3px 6px #ffffff; }
  .chip {
    padding: 5px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600; color: #4a5468;
    background: #dfe6f0;
    box-shadow: inset 2px 2px 5px #b7c1d0, inset -2px -2px 5px #ffffff;
  }
  .hint { margin-top: 1.8rem; color: #8b95a7; font-size: .82rem; }
  .credit {
    margin-top: 2.6rem; padding-top: 1.2rem;
    border-top: 1px solid #c9d2df;
    color: #8b95a7; font-size: .8rem;
  }
  .credit a { color: #5f7fae; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Soft Neumorph</h1>
  <p class="sub">Pressed into soft light — / Presionado en luz suave</p>
  <button type="button" class="btn" data-testid="btn" aria-label="Press soft button">
    <span class="knob" aria-hidden="true">+</span>
    <span>Press me</span>
    <span class="chip" aria-live="polite"><b data-testid="count">0</b>×</span>
  </button>
  <p class="hint">Click to count presses — / Clic para contar presiones</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const btn = document.querySelector('[data-testid="btn"]');
  const count = document.querySelector('[data-testid="count"]');
  let n = 0;
  btn.addEventListener('click', () => { n += 1; count.textContent = n; });
  btn.addEventListener('pointerdown', () => btn.classList.add('pressed'));
  btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
  btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
</script>
</body>
</html>
