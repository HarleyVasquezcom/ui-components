<!-- Design 08: Pill Bokeh / Píldora Bokeh -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill Bokeh Button — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #e3e0ff 45%, #d4f6ff);
    overflow-x: hidden;
  }
  .bokeh { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bokeh span {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,.55);
    filter: blur(1px);
  }
  .b1 { width: 120px; height: 120px; left: 8%; top: 12%; }
  .b2 { width: 60px; height: 60px; left: 22%; top: 60%; }
  .b3 { width: 90px; height: 90px; right: 12%; top: 18%; }
  .b4 { width: 50px; height: 50px; right: 24%; bottom: 14%; }
  .b5 { width: 150px; height: 150px; left: 50%; bottom: -40px; }
  .stage {
    position: relative; z-index: 1;
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: rgba(255,255,255,.5);
    border-radius: 40px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 24px 60px rgba(150,120,180,.25);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; color: #7a5c9e; letter-spacing: .02em; }
  .sub { margin: .4rem 0 2.4rem; color: #9b84b8; font-size: .92rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 18px 44px;
    font-size: 1.05rem; font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #ff8fb8, #a78bfa 55%, #7dd3fc);
    background-size: 180% 180%;
    border: none;
    border-radius: 999px;
    box-shadow: 0 12px 30px rgba(167,139,250,.4), inset 0 2px 0 rgba(255,255,255,.4);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, background-position .4s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.02); background-position: 100% 100%; box-shadow: 0 16px 36px rgba(167,139,250,.5); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 3px solid #a78bfa; outline-offset: 4px; }
  .btn .bubble {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255,255,255,.3);
    font-size: .85rem; font-weight: 700;
    transition: transform .2s ease;
  }
  .btn:hover .bubble { transform: scale(1.15); }
  .hint { margin-top: 1.8rem; color: #a895b8; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.7); color: #a895b8; font-size: .8rem; }
  .credit a { color: #7a5c9e; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="bokeh" aria-hidden="true">
  <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="b5"></span>
</div>
<main class="stage">
  <h1>Pill Bokeh</h1>
  <p class="sub">Soft like a pastel dream / Suave como un sueño pastel</p>
  <button type="button" class="btn" data-testid="btn" aria-label="Tap the pill button">
    <span class="bubble" aria-live="polite"><b data-testid="count">0</b></span>
    <span>Tap me</span>
  </button>
  <p class="hint">Click to count taps — / Clic para contar toques</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const btn = document.querySelector('[data-testid="btn"]');
  const count = document.querySelector('[data-testid="count"]');
  let n = 0;
  btn.addEventListener('click', () => { n += 1; count.textContent = n; });
</script>
</body>
</html>
