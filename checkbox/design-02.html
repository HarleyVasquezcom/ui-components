<!-- Design 02: Select-a-Card / Elige una Tarjeta -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select-a-Card Checkbox — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #101418;
    overflow-x: hidden;
  }
  .stage {
    width: min(680px, 94vw);
    padding: clamp(26px, 6vw, 56px);
    text-align: center;
  }
  h1 { margin: 0; color: #f2f5f8; font-size: clamp(1.5rem, 4vw, 2rem); }
  .sub { margin: .4rem 0 2.2rem; color: #7d8896; font-size: .92rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    display: block;
    padding: 20px 16px 18px;
    background: #1a1f26;
    border: 1px solid #2a323d;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
    text-align: left;
  }
  .card:hover { transform: translateY(-3px); border-color: #3d4754; }
  .card.checked { border-color: #6ee7b7; background: #16251f; box-shadow: 0 0 24px rgba(110,231,183,.15); }
  .card input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .card .badge {
    position: absolute; top: 10px; right: 10px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #3d4754;
    display: grid; place-items: center;
    background: #1a1f26;
    transition: all .2s ease;
  }
  .card .badge svg { width: 13px; height: 13px; stroke: #101418; stroke-width: 3.5; fill: none; opacity: 0; transform: scale(.4); transition: all .2s cubic-bezier(.6,0,.3,1); }
  .card.checked .badge { background: #6ee7b7; border-color: #6ee7b7; }
  .card.checked .badge svg { opacity: 1; transform: scale(1); }
  .card input:focus-visible ~ .badge { outline: 3px solid #6ee7b7; outline-offset: 3px; }
  .card .emoji { font-size: 1.6rem; display: block; margin-bottom: 8px; }
  .card .title { color: #e8edf2; font-weight: 600; font-size: .95rem; }
  .card .desc { color: #7d8896; font-size: .78rem; margin-top: 4px; line-height: 1.4; }
  .card.disabled { opacity: .45; cursor: not-allowed; }
  .card.disabled:hover { transform: none; border-color: #2a323d; }
  .hint { margin-top: 1.8rem; color: #5c6875; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid #232a33; color: #5c6875; font-size: .8rem; }
  .credit a { color: #6ee7b7; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Select-a-Card</h1>
  <p class="sub">Pick your perks — / Elige tus beneficios</p>
  <div class="grid">
    <label class="card" data-testid="cb" for="cb-card-a">
      <input type="checkbox" id="cb-card-a">
      <span class="badge" data-testid="visual" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <span class="emoji" aria-hidden="true">🚀</span>
      <span class="title">Fast track</span>
      <span class="desc">Priority support queue — / Cola de soporte prioritaria</span>
    </label>
    <label class="card" for="cb-card-b">
      <input type="checkbox" id="cb-card-b">
      <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <span class="emoji" aria-hidden="true">📦</span>
      <span class="title">Storage plus</span>
      <span class="desc">Extra 50 GB included — / 50 GB extra incluidos</span>
    </label>
    <label class="card" for="cb-card-c">
      <input type="checkbox" id="cb-card-c">
      <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <span class="emoji" aria-hidden="true">🛡️</span>
      <span class="title">Shield</span>
      <span class="desc">Privacy audits — / Auditorías de privacidad</span>
    </label>
    <label class="card disabled" data-testid="cb-disabled" for="cb-card-d">
      <input type="checkbox" id="cb-card-d" disabled>
      <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <span class="emoji" aria-hidden="true">🔒</span>
      <span class="title">Vault</span>
      <span class="desc">Locked perk — / Beneficio bloqueado</span>
    </label>
  </div>
  <p class="hint">Click a card to select — / Clic en una tarjeta para seleccionar</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  document.querySelectorAll('.card input').forEach((input) => {
    input.addEventListener('change', () => {
      input.closest('.card').classList.toggle('checked', input.checked);
    });
  });
</script>
</body>
</html>
