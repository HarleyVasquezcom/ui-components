<!-- Design 01: Iris Check / Marca Iris -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris Check Checkbox — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #eef6ff, #fdf0f7);
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: rgba(255,255,255,.85);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(90,120,180,.18);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #2d4a7c; font-weight: 700; }
  .sub { margin: .4rem 0 2.4rem; color: #8496b5; font-size: .92rem; }
  .row {
    display: flex; align-items: center; gap: 16px;
    margin: 0 auto 18px;
    max-width: 380px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid #e4ecf6;
    background: #fff;
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .row:hover { border-color: #7ba7e0; box-shadow: 0 8px 20px rgba(90,140,210,.12); }
  .row .cb-input {
    position: absolute; opacity: 0; width: 1px; height: 1px;
  }
  .box {
    flex: 0 0 auto;
    width: 26px; height: 26px; border-radius: 8px;
    border: 2px solid #b9c8dd;
    display: grid; place-items: center;
    background: #fff;
    transition: border-color .2s ease, background .2s ease;
  }
  .box svg {
    width: 16px; height: 16px;
    stroke: #fff; stroke-width: 3; fill: none;
    stroke-dasharray: 24; stroke-dashoffset: 24;
    transition: stroke-dashoffset .28s cubic-bezier(.6,0,.3,1);
  }
  .row.checked .box { border-color: #3f7de0; background: #3f7de0; box-shadow: 0 0 16px rgba(63,125,224,.35); }
  .row.checked .box svg { stroke-dashoffset: 0; }
  .row .txt { text-align: left; color: #33415c; font-size: .95rem; font-weight: 500; }
  .row .txt small { display: block; color: #93a1b8; font-weight: 400; font-size: .78rem; }
  .row.disabled { opacity: .55; cursor: not-allowed; }
  .row.disabled:hover { border-color: #e4ecf6; box-shadow: none; }
  .row input:focus-visible ~ .box { outline: 3px solid #3f7de0; outline-offset: 3px; }
  .hint { margin-top: 1.6rem; color: #93a1b8; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid #eef1f6; color: #93a1b8; font-size: .8rem; }
  .credit a { color: #3f7de0; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Iris Check</h1>
  <p class="sub">A drawn checkmark, stroke by stroke / Una marca dibujada, trazo a trazo</p>
  <label class="row" data-testid="cb" for="cb-iris-a">
    <input type="checkbox" id="cb-iris-a" class="cb-input">
    <span class="box" data-testid="visual" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
    </span>
    <span class="txt">Accept the terms<small>legal text goes here — / texto legal aquí</small></span>
  </label>
  <label class="row disabled" data-testid="cb-disabled" for="cb-iris-b">
    <input type="checkbox" id="cb-iris-b" class="cb-input" disabled>
    <span class="box" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
    </span>
    <span class="txt">Disabled agreement<small>cannot be toggled — / no se puede marcar</small></span>
  </label>
  <p class="hint">Click a row to check it — / Clic en una fila para marcarla</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  document.querySelectorAll('.row .cb-input').forEach((input) => {
    input.addEventListener('change', () => {
      input.closest('.row').classList.toggle('checked', input.checked);
    });
  });
</script>
</body>
</html>
