<!-- Design 04: Squircle Ink / Tinta en Esquirculo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squircle Ink Checkbox — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(70% 60% at 20% 15%, #2a1e54, transparent 60%),
      radial-gradient(70% 60% at 85% 80%, #3d1a4a, transparent 60%),
      #171129;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 28px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #e8d9ff; font-weight: 700; letter-spacing: .02em; }
  .sub { margin: .4rem 0 2.4rem; color: #9d8cc2; font-size: .92rem; }
  .row {
    display: flex; align-items: center; gap: 18px;
    max-width: 400px; margin: 0 auto 20px;
    padding: 16px;
    background: rgba(255,255,255,.05);
    border-radius: 18px;
    cursor: pointer;
    transition: background .2s ease;
  }
  .row:hover { background: rgba(255,255,255,.09); }
  .row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .squircle {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 38% 62% 52% 48% / 45% 45% 55% 55%;
    background: rgba(255,255,255,.06);
    border: 2px solid #6b5b96;
    display: grid; place-items: center;
    transition: background .25s ease, border-color .25s ease, border-radius .4s ease;
  }
  .squircle svg {
    width: 18px; height: 18px;
    stroke: #c9a8ff; stroke-width: 3; fill: none;
    stroke-dasharray: 26; stroke-dashoffset: 26;
    transition: stroke-dashoffset .3s cubic-bezier(.6,0,.3,1);
  }
  .row.checked .squircle {
    background: linear-gradient(135deg, #7c4dff, #b44dff);
    border-color: transparent;
    border-radius: 50%;
    box-shadow: 0 0 22px rgba(140,80,255,.55);
  }
  .row.checked .squircle svg { stroke-dashoffset: 0; }
  .row input:focus-visible ~ .squircle { outline: 3px solid #c9a8ff; outline-offset: 3px; }
  .row .txt { text-align: left; color: #ddd2f0; font-weight: 500; font-size: .95rem; }
  .row .txt small { display: block; color: #8f7fae; font-weight: 400; font-size: .78rem; }
  .row.disabled { opacity: .45; cursor: not-allowed; }
  .hint { margin-top: 1.6rem; color: #8f7fae; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.12); color: #8f7fae; font-size: .8rem; }
  .credit a { color: #c9a8ff; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Squircle Ink</h1>
  <p class="sub">A blob that blooms into a circle / Un blob que florece en círculo</p>
  <label class="row" data-testid="cb" for="cb-sq-a">
    <input type="checkbox" id="cb-sq-a">
    <span class="squircle" data-testid="visual" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
    <span class="txt">Enable magic ink<small>the check draws itself — / la marca se dibuja sola</small></span>
  </label>
  <label class="row disabled" data-testid="cb-disabled" for="cb-sq-b">
    <input type="checkbox" id="cb-sq-b" disabled>
    <span class="squircle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
    <span class="txt">Frozen ink<small>disabled — / deshabilitado</small></span>
  </label>
  <p class="hint">Click a row to check it — / Clic en una fila para marcarla</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  document.querySelectorAll('.row input').forEach((input) => {
    input.addEventListener('change', () => {
      input.closest('.row').classList.toggle('checked', input.checked);
    });
  });
</script>
</body>
</html>
