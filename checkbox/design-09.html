<!-- Design 09: Scale Flick / Chasquido con Escala -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Flick Checkbox — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(50% 50% at 80% 10%, #dbeafe, transparent 60%),
      linear-gradient(160deg, #f0f4ff, #e9eefb);
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 26px 70px rgba(40,70,150,.16);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #1d3a8f; font-weight: 800; }
  .sub { margin: .4rem 0 2.6rem; color: #7f92c4; font-size: .92rem; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    max-width: 430px; margin: 0 auto 16px;
    padding: 16px 20px;
    border-radius: 16px;
    border: 1px solid #e3e9f7;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .row:hover { border-color: #b3c4ec; background: #f7f9ff; }
  .row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .txt { text-align: left; color: #27335c; font-weight: 600; font-size: .95rem; }
  .txt small { display: block; color: #9aa8cd; font-weight: 400; font-size: .78rem; }
  .flick {
    flex: 0 0 auto;
    width: 32px; height: 32px; border-radius: 10px;
    border: 2px solid #c3cfea;
    display: grid; place-items: center;
    transition: border-color .2s ease, background .2s ease;
  }
  .flick svg {
    width: 18px; height: 18px;
    stroke: #fff; stroke-width: 3.4; fill: none;
    transform: scale(0);
    transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .row.checked .flick { background: #3b6ef6; border-color: #3b6ef6; box-shadow: 0 6px 16px rgba(59,110,246,.35); }
  .row.checked .flick svg { transform: scale(1); }
  .row.flicking .flick svg { animation: overbounce .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes overbounce {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.25) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .row input:focus-visible ~ .flick { outline: 3px solid #3b6ef6; outline-offset: 3px; }
  .row.disabled { opacity: .45; cursor: not-allowed; }
  .hint { margin-top: 1.8rem; color: #9aa8cd; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid #eef1f8; color: #9aa8cd; font-size: .8rem; }
  .credit a { color: #3b6ef6; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Scale Flick</h1>
  <p class="sub">The check flicks in with elastic energy / La marca entra con energía elástica</p>
  <label class="row" data-testid="cb" for="cb-sf-a">
    <input type="checkbox" id="cb-sf-a">
    <span class="txt">Subscribe to alerts<small>instant notifications — / notificaciones instantáneas</small></span>
    <span class="flick" data-testid="visual" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
  </label>
  <label class="row" for="cb-sf-b">
    <input type="checkbox" id="cb-sf-b">
    <span class="txt">Weekly summary<small>one email per week — / un correo por semana</small></span>
    <span class="flick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
  </label>
  <label class="row disabled" data-testid="cb-disabled" for="cb-sf-c">
    <input type="checkbox" id="cb-sf-c" disabled>
    <span class="txt">Beta channel<small>invite only — / solo invitación</small></span>
    <span class="flick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
  </label>
  <p class="hint">Click a row to flick it — / Clic en una fila para marcarla</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  document.querySelectorAll('.row input').forEach((input) => {
    input.addEventListener('change', () => {
      const row = input.closest('.row');
      row.classList.toggle('checked', input.checked);
      if (input.checked) {
        row.classList.add('flicking');
        setTimeout(() => row.classList.remove('flicking'), 320);
      }
    });
  });
</script>
</body>
</html>
