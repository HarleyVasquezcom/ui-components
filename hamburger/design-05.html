<!-- Design 05: Pill Hamburger / Hamburguesa Píldora -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hamburger Menu — Design 05</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#1e293b;color:#f1f5f9;display:grid;place-items:center;overflow-x:hidden}.hamburger-wrapper{width:min(300px,90vw);text-align:center}.hamburger{width:44px;height:44px;position:relative;margin:20px auto;cursor:pointer;user-select:none;border:2px solid #64748b;border-radius:999px;background:#3b82f6}.hamburger .line{width:22px;height:4px;background:#f1f5f9;border-radius:2px;position:absolute;left:50%;top:50%;transform:translateX(-50%)translateY(-50%);transition:all .3s ease}.line-1{top:12px}.line-2{top:22px}.line-3{top:32px}.hamburger.active .line-1{top:22px;transform:rotate(45deg)translateY(-50%);background:#f8fafc}.hamburger.active .line-2{opacity:0}.hamburger.active .line-3{top:22px;transform:rotate(-45deg)translateY(-50%);background:#f8fafc}.menu{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172b;z-index:100;transform:translateX(100%);transition:transform .3s ease;padding:70px 30px 30px;min-width:260px;height:100vh}.menu .pill{display:inline-block;padding:6px 12px;margin:4px;border-radius:999px;background:#3b82f6;color:#f8fafc;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .2s}.menu .pill:hover{background:#2563eb}.menu .pill.active{background:#1d4ed8}.menu .close{position:absolute;top:20px;right:20px;width:30px;height:30px;background:none;border:none;cursor:pointer;color:#94a3bf;font-size:20px}.menu .close:hover{color:#a5f3fc}.menu h2{margin:0 0 24px;font-size:1.2rem;color:#f8fafc}.menu a{display:block;padding:10px 0;color:#f8fafc;text-decoration:none;border-bottom:1px solid #3b82f6;font-size:.9rem;transition:color .2s}.menu a:hover{color:#60a5fa}.menu .active{color:#60a5fa;font-weight:600}.credit{margin-top:40px;padding:20px 0;border-top:1px solid #3b82f6;color:#94a3bf;font-size:.8rem}.credit a{color:#60a5fa;text-decoration:none}.media-query{display:none}.@media (max-width:360px){.menu{padding:55px 10px 10px}}</style>
</head>
<body><div class="hamburger-wrapper"><div class="hamburger" aria-label="Menú" aria-expanded="false" role="button" data-testid="hamburger" data-hamburger><span class="line line-1"></span><span class="line line-2"></span><span class="line line-3"></span></div><nav class="menu" aria-label="Menú principal" role="navigation" data-menu style="display:none;" aria-expanded="false"><button class="close" aria-label="Cerrar" data-close>&times;</button><h2>Menú de Secciones</h2><span class="pill" data-pill>Inicio</span><span class="pill active" data-pill>Nosotros</span><span class="pill" data-pill>Servicios</span><span class="pill" data-pill>Portafolio</span><span class="pill" data-pill>Contacto</span></nav></div><script>
  (() => {
    const h = document.querySelector('[data-hamburger]');
    const m = document.querySelector('[data-menu]');
    const c = document.querySelector('[data-close]');
    let menuOpen = false;
    const toggle = () => {
      menuOpen = !menuOpen;
      h.setAttribute('aria-expanded', menuOpen);
      m.setAttribute('aria-expanded', menuOpen);
      m.style.display = menuOpen ? 'block' : 'none';
      if (menuOpen) { m.classList.add('active'); }
      else { m.classList.remove('active'); }
    };
    h.addEventListener('click', toggle);
    c.addEventListener('click', toggle);
    // Close on ESC
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) { toggle(); } });
    // Close on outside click
    document.addEventListener('click', e => { if (!h.contains(e.target) && !m.contains(e.target) && menuOpen) { toggle(); } });
    // Initial count check for probe
    const links = m.querySelectorAll('a');
    const countEl = document.createElement('span'); countEl.style.display='none';
    document.body.appendChild(countEl);
  })();
</script><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
