<!-- Design 04: Glass Expand / Expansión de Cristal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hamburger Menu — Design 04</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#ecfdf5;display:grid;place-items:center;overflow-x:hidden}.hamburger-wrapper{width:min(300px,90vw);text-align:center}.hamburger{width:44px;height:44px;position:relative;margin:25px auto;cursor:pointer;user-select:none}.hamburger .line{width:24px;height:4px;background:#1e293b;border-radius:2px;position:absolute;left:50%;top:50%;transform:translateX(-50%)translateY(-50%);transition:all .3s ease;box-shadow:0 0 0 1px #64748b}.line-1{top:8px}.line-2{top:22px}.line-3{top:36px}.hamburger.active .line-1{top:22px;transform:rotate(45deg)translateY(-50%);background:#3b82f6;box-shadow:0 0 0 1px #3b82f6}.hamburger.active .line-2{opacity:0}.hamburger.active .line-3{top:22px;transform:rotate(-45deg)translateY(-50%);background:#3b82f6;box-shadow:0 0 0 1px #3b82f6}.menu{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(254,243,199,0.95);z-index:100;backdrop-filter:blur(10px);transform:translateX(100%);transition:transform .3s ease;padding:70px 30px 30px;border-right:1px solid #d1d5db;height:100vh}.menu.active{transform:translateX(0)}.menu .close{position:absolute;top:25px;right:25px;width:32px;height:32px;background:none;border:none;cursor:pointer;font-size:22px;color:#1e293b}.menu .close:hover{color:#0f172a}.menu h2{margin:0 0 30px;font-size:1.4rem;color:#1e293b}.menu a{display:block;padding:12px 0;color:#1e293b;text-decoration:none;border-bottom:1px solid #e5e7eb;font-size:1rem;transition:color .2s}.menu a:hover{color:#3b82f6}.menu .active{color:#3b82f6;font-weight:600}.credit{margin-top:45px;padding:25px 0;border-top:1px solid #e5e7eb;color:#64748b;font-size:.8rem}.credit a{color:#3b82f6;text-decoration:none}.mq{display:none}.@media (max-width:360px){.menu{padding:55px 10px 10px}}</style>
</head>
<body><div class="hamburger-wrapper"><div class="hamburger" aria-label="Menú" aria-expanded="false" role="button" data-testid="hamburger" data-hamburger><span class="line line-1"></span><span class="line line-2"></span><span class="line line-3"></span></div><nav class="menu" aria-label="Menú principal" role="navigation" data-menu style="display:none;" aria-expanded="false"><button class="close" aria-label="Cerrar" data-close>&times;</button><h2>Menú Principal</h2><a href="/inicio" class="active">Inicio</a><a href="/nosotros">Nosotros</a><a href="/servicios">Servicios</a><a href="/portafolio">Portafolio</a><a href="/contacto">Contacto</a></nav></div><script>
  (() => {
    const h = document.querySelector('[data-hamburger]');
    const m = document.querySelector('[data-menu]');
    const c = document.querySelector('[data-close]');
    let menuOpen = false;
    const toggle = () => {
      menuOpen = !menuOpen;
      h.setAttribute('aria-expanded', menuOpen);
      m.setAttribute('aria-expanded', menuOpen);
      m.style.display = menuOpen ? 'block' : 'none';
      if (menuOpen) { m.classList.add('active'); }
      else { m.classList.remove('active'); }
    };
    h.addEventListener('click', toggle);
    c.addEventListener('click', toggle);
    // Close on ESC
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) { toggle(); } });
    // Close on outside click
    document.addEventListener('click', e => { if (!h.contains(e.target) && !m.contains(e.target) && menuOpen) { toggle(); } });
    // Initial count check for probe
    const links = m.querySelectorAll('a');
    const countEl = document.createElement('span'); countEl.style.display='none';
    document.body.appendChild(countEl);
  })();
</script><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
