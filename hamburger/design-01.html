<!-- Design 01: Classic Slide / Deslizado Clásico -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamburger Menu — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fafafa;
    display: grid; place-items: center;
    overflow-x: hidden;
  }
  .hamburger-wrapper {
    width: min(300px, 90vw);
    text-align: center;
  }
  .hamburger {
    width: 44px; height: 44px; position: relative;
    margin: 20px auto;
    cursor: pointer;
    user-select: none;
  }
  .hamburger .line {
    width: 28px; height: 4px; background: #1e293b;
    border-radius: 2px; position: absolute; left: 50%; top: 50%;
    transform: translateX(-50%) translateY(-50%); transition: all .3s ease;
    /* BEM: before change later */
  }
  .line-1 { top: 12px; }
  .line-2 { top: 22px; }
  .line-3 { top: 32px; }
  .hamburger.active .line-1 { top: 22px; transform: rotate(45deg) translateY(-50%); }
  .hamburger.active .line-2 { opacity: 0; }
  .hamburger.active .line-3 { top: 22px; transform: rotate(-45deg) translateY(-50%); }
  .menu {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff; z-index: 100; transform: translateX(100%);
    transition: transform .3s ease; padding: 80px 20px 20px;
    border-right: 1px solid #e2e8f0; height: 100vh;
  }
  .menu.active { transform: translateX(0); }
  .menu .close {
    position: absolute; top: 20px; right: 20px; width: 30px; height: 30px;
    background: none; border: none; cursor: pointer;
    font-size: 24px; color: #64748b;
  }
  .menu .close:hover { color: #0f172a; }
  .menu h2 { margin: 0 0 24px; font-size: 1.5rem; color: #0f172a; }
  .menu a {
    display: block; padding: 12px 0; color: #0f172a;
    text-decoration: none; border-bottom: 1px solid #e2e8f0;
    font-size: 1rem; transition: color .2s;
  }
  .menu a:hover { color: #0891b2; }
  .menu .active { color: #0891b2; font-weight: 600; }
  .credit { margin-top: 40px; padding: 20px 0; border-top: 1px solid #e2e8f0;
    color: #64748b; font-size: .8rem; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 360px) { .menu { padding: 60px 10px 10px; } }
</style>
</head>
<body>
<div class="hamburger-wrapper">
  <div class="hamburger" aria-label="Menu" aria-expanded="false" role="button" data-testid="hamburger" data-hamburger>
    <span class="line line-1"></span>
    <span class="line line-2"></span>
    <span class="line line-3"></span>
  </div>
  <nav class="menu" aria-label="Menú principal" role="navigation" data-menu style="display:none;" aria-expanded="false">
    <button class="close" aria-label="Cerrar menú" data-close>&times;</button>
    <h2>Menú Principal</h2>
    <a href="/inicio" class="active">Inicio</a>
    <a href="/nosotros">Nosotros</a>
    <a href="/servicios">Servicios</a>
    <a href="/portafolio">Portafolio</a>
    <a href="/contacto">Contacto</a>
  </nav>
</div>
<script>
  (() => {
    const h = document.querySelector('[data-hamburger]');
    const m = document.querySelector('[data-menu]');
    const c = document.querySelector('[data-close]');
    let menuOpen = false;
    const toggle = () => {
      menuOpen = !menuOpen;
      h.setAttribute('aria-expanded', menuOpen);
      m.setAttribute('aria-expanded', menuOpen);
      m.style.display = menuOpen ? 'block' : 'none';
      if (menuOpen) { m.classList.add('active'); }
      else { m.classList.remove('active'); }
    };
    h.addEventListener('click', toggle);
    c.addEventListener('click', toggle);
    // Close on ESC
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) { toggle(); } });
    // Close on outside click
    document.addEventListener('click', e => { if (!h.contains(e.target) && !m.contains(e.target) && menuOpen) { toggle(); } });
    // Initial count check for probe
    const links = m.querySelectorAll('a');
    const countEl = document.createElement('span'); countEl.style.display='none';
    document.body.appendChild(countEl);
  })();
</script>

</body>
</html>
