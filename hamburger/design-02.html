<!-- Design 02: Minimal Reveal / Revelado Mínimo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hamburger Menu — Design 02</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f1f5f9;display:grid;place-items:center;overflow-x:hidden}.hamburger-wrapper{width:min(300px,90vw);text-align:center}.hamburger{width:44px;height:44px;position:relative;margin:20px auto;cursor:pointer;user-select:none}.hamburger .line{width:25px;height:3px;background:#64748b;border-radius:2px;position:absolute;left:50%;top:50%;transform:translateX(-50%)translateY(-50%);transition:all .3s ease}.line-1{top:8px}.line-2{top:22px}.line-3{top:36px}.hamburger.active .line-1{top:22px;transform:rotate(45deg)translateY(-50%)}.hamburger.active .line-2{opacity:0}.hamburger.active .line-3{top:22px;transform:rotate(-45deg)translateY(-50%)}.menu{position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;z-index:100;transform:translateX(100%);transition:transform .3s ease;padding:80px 20px 20px;border-right:1px solid #cbd5e1;height:100vh}.menu.active{transform:translateX(0)}.menu .close{position:absolute;top:20px;right:20px;width:30px;height:30px;background:none;border:none;cursor:pointer;font-size:20px;color:#64748b}.menu .close:hover{color:#0f172a}.menu h2{margin:0 0 24px;font-size:1.3rem;color:#0f172a}.menu a{display:block;padding:10px 0;color:#0f172a;text-decoration:none;border-bottom:1px solid #cbd5e1;font-size:.95rem;transition:color .2s}.menu a:hover{color:#0891b2}.menu .active{color:#0891b2;font-weight:600}.credit{margin-top:40px;padding:20px 0;border-top:1px solid #cbd5e1;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}.media-query{display:none}.@media (max-width:360px){.menu{padding:60px 10px 10px}}</style>
</head>
<body><div class="hamburger-wrapper"><div class="hamburger" aria-label="Menú" aria-expanded="false" role="button" data-testid="hamburger" data-hamburger><span class="line line-1"></span><span class="line line-2"></span><span class="line line-3"></span></div><nav class="menu" aria-label="Menú principal" role="navigation" data-menu style="display:none;" aria-expanded="false"><button class="close" aria-label="Cerrar" data-close>&times;</button><h2>Menú</h2><a href="/inicio" class="active">Inicio</a><a href="/nosotros">Nosotros</a><a href="/servicios">Servicios</a><a href="/portafolio">Portafolio</a><a href="/contacto">Contacto</a></nav></div><script>(()=>{const h=document.querySelector('[data-hamburger]'),m=document.querySelector('[data-menu]'),c=document.querySelector('[data-close]'),e=document.querySelector('head');let o=false;const t=()=>{o=!o;h.setAttribute('aria-expanded',o);m.setAttribute('aria-expanded',o);m.style.display=o?'block':'none';if(o){m.classList.add('active')}else{m.classList.remove('active')};const l=m.querySelectorAll('a');const s=document.createElement('span');s.style.display='none';document.body.appendChild(s)};h.addEventListener('click',t);c.addEventListener('click',t);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&o){toggle()}});document.addEventListener('click',e=>{if(!h.contains(e.target)&&!m.contains(e.target)&&o){toggle()}})})();</script><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
