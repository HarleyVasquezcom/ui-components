<!-- Design 10: Hamburger con Close Botón / Hamburger con Botón de Close -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hamburger Menu — Design 10</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Arial",sans-serif;background:#34495e;color:#ecf0f1;display:grid;place-items:center;overflow-x:hidden}.hamburger-wrapper{width:min(300px,90vw);text-align:center}.hamburger{width:44px;height:44px;position:relative;margin:20px auto;cursor:pointer;user-select:none;border:none;border-radius:4px;background:#e74c3c}.hamburger .line{width:25px;height:4px;background:#ecf0f1;border-radius:2px;position:absolute;left:50%;top:50%;transform:translateX(-50%)translateY(-50%);transition:all .3s ease}.line-1{top:10px}.line-2{top:20px}.line-3{top:30px}.hamburger.active .line-1{top:20px;transform:rotate(45deg)translateY(-50%);background:#e74c3c}.hamburger.active .line-2{opacity:0}.hamburger.active .line-3{top:20px;transform:rotate(-45deg)translateY(-50%);background:#e74c3c}.menu{position:fixed;top:0;left:0;right:0;bottom:0;background:#2c3e50;z-index:100;transform:translateX(100%);transition:transform .3s ease;padding:60px 25px 25px;min-width:240px;height:100vh;color:#ecf0f1}.menu .close{position:absolute;top:15px;right:15px;width:30px;height:30px;background:#e74c3c;border:none;border-radius:4px;cursor:pointer;color:#ecf0f1;font-weight:600}.menu .close:hover{background:#c0392b}.menu h2{margin:0 0 24px;font-size:1rem;color:#ecf0f1}.menu a{display:block;padding:8px 0;color:#ecf0f1;text-decoration:none;border-bottom:1px solid #2c3e50;font-size:.85rem;transition:color .2s}.menu a:hover{color:#1abc9c}.menu .active{color:#1abc9c;font-weight:600}.credit{margin-top:30px;padding:15px 0;border-top:1px solid #2c3e50;color:#95a5a6;font-size:.7rem}.credit a{color:#95a5a6;text-decoration:none}.media-query{display:none}.@media (max-width:360px){.menu{padding:50px 10px 10px}}</style>
</head>
<body><div class="hamburger-wrapper"><div class="hamburger" aria-label="Menú" aria-expanded="false" role="button" data-testid="hamburger" data-hamburger><span class="line line-1"></span><span class="line line-2"></span><span class="line line-3"></span></div><nav class="menu" aria-label="Menú principal" role="navigation" data-menu style="display:none;" aria-expanded="false"><button class="close" aria-label="Cerrar" data-close style="background:#e74c3c;">×</button><h2>Menú de Navegación</h2><a href="/inicio" class="active">Inicio</a><a href="/nosotros">Nosotros</a><a href="/servicios">Servicios</a><a href="/portafolio">Portafolio</a><a href="/contacto">Contacto</a></nav></div><script>
  (() => {
    const h = document.querySelector('[data-hamburger]');
    const m = document.querySelector('[data-menu]');
    const c = document.querySelector('[data-close]');
    let menuOpen = false;
    const toggle = () => {
      menuOpen = !menuOpen;
      h.setAttribute('aria-expanded', menuOpen);
      m.setAttribute('aria-expanded', menuOpen);
      m.style.display = menuOpen ? 'block' : 'none';
      if (menuOpen) { m.classList.add('active'); }
      else { m.classList.remove('active'); }
    };
    h.addEventListener('click', toggle);
    c.addEventListener('click', toggle);
    // Close on ESC
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) { toggle(); } });
    // Close on outside click
    document.addEventListener('click', e => { if (!h.contains(e.target) && !m.contains(e.target) && menuOpen) { toggle(); } });
    // Initial count check for probe
    const links = m.querySelectorAll('a');
    const countEl = document.createElement('span'); countEl.style.display='none';
    document.body.appendChild(countEl);
  })();
</script><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
