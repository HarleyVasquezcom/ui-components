<!-- Design 10: Icon Inline / Icono En Línea -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Inline Text Field — Design 10</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f0fdfa;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(32px, 7vw, 60px);
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(13,148,136,.12);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #0f172a; font-weight: 700; }
  .sub { margin: .3rem 0 2.4rem; color: #5eead4; font-size: .92rem; font-weight: 600; }
  .lbl { display: block; margin: 0 0 10px; color: #0f172a; font-size: .9rem; font-weight: 700; }
  .ic {
    display: flex; align-items: center; gap: 12px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    padding: 4px 6px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .ic .chip {
    flex: 0 0 auto;
    display: grid; place-items: center;
    width: 42px; height: 42px;
    border-radius: 9px;
    background: #ccfbf1;
    transition: background .2s ease;
  }
  .ic .chip svg { width: 20px; height: 20px; stroke: #0d9488; fill: none; stroke-width: 2; }
  .field {
    flex: 1; min-width: 0;
    padding: 12px 6px;
    font-size: 1rem; color: #0f172a;
    background: transparent;
    border: none; outline: none;
  }
  .field::placeholder { color: #cbd5e1; }
  .ic:focus-within { border-color: #14b8a6; box-shadow: 0 0 0 4px rgba(20,184,166,.12); }
  .ic:focus-within .chip { background: #14b8a6; }
  .ic:focus-within .chip svg { stroke: #fff; }
  .field:focus-visible { outline: 2px solid #0f766e; outline-offset: 3px; }
  .ic.has-invalid { border-color: #f43f5e; }
  .ic.has-invalid .chip { background: #ffe4e6; }
  .ic.has-invalid .chip svg { stroke: #e11d48; }
  .err {
    display: none; margin-top: 9px; color: #e11d48; font-size: .82rem; font-weight: 600;
  }
  .err.show { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    padding: 11px 26px; font-size: .92rem; font-weight: 700;
    color: #fff; background: #0d9488;
    border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 8px 18px rgba(13,148,136,.3);
    transition: background .15s ease, transform .12s ease;
  }
  .btn:hover { background: #0f766e; transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
  .val { margin: 0; color: #94a3b8; font-size: .88rem; }
  .val b { color: #0f172a; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .hint { margin-top: 2.4rem; color: #99f6e4; font-size: .8rem; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #f0fdfa; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #0d9488; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Icon Inline</h1>
  <p class="sub">The icon lives inside the field / El icono vive dentro del campo</p>
  <form novalidate>
    <label class="lbl" data-testid="label" for="f10">Email address</label>
    <div class="ic" data-testid="frame">
      <span class="chip" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg>
      </span>
      <input class="field" type="email" id="f10" data-testid="field" aria-label="Email address" aria-describedby="err10" placeholder="you@example.com">
    </div>
    <p class="err" id="err10" data-testid="error" role="alert">Enter a valid email address</p>
    <div class="row">
      <button class="btn" type="submit" data-testid="submit" aria-label="Submit email">Save</button>
      <p class="val">value: <b data-testid="value" aria-live="polite"></b></p>
    </div>
  </form>
  <p class="hint">Focus turns the chip teal / El foco tiñe el chip de turquesa</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const ic = document.querySelector('[data-testid="frame"]');
  const field = document.querySelector('[data-testid="field"]');
  const err = document.querySelector('[data-testid="error"]');
  const out = document.querySelector('[data-testid="value"]');
  const form = document.querySelector('form');
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function validate() {
    const ok = EMAIL.test(field.value);
    err.classList.toggle('show', !ok);
    ic.classList.toggle('has-invalid', !ok);
    field.setAttribute('aria-invalid', String(!ok));
    return ok;
  }
  field.addEventListener('input', () => { out.textContent = field.value; });
  field.addEventListener('blur', validate);
  form.addEventListener('submit', (e) => { e.preventDefault(); validate(); });
</script>
</body>
</html>
