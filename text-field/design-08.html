<!-- Design 08: Mono Editorial / Mono Editorial -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mono Editorial Text Field — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: #f5efe0;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(38px, 8vw, 72px);
    background: #faf5e9;
    border: 1px solid #e2d5b6;
    box-shadow: 0 30px 70px rgba(120,90,50,.12);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.3rem); color: #3d3323; font-weight: 700; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.6rem; color: #9c8a63; font-size: .85rem; }
  .lbl { display: block; margin: 0 0 10px; color: #5b4a2f; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; }
  .field {
    width: 100%;
    padding: 12px 4px;
    font-family: inherit; font-size: 1rem; color: #3d3323;
    background: transparent;
    border: none;
    border-bottom: 2px solid #3d3323;
    box-shadow: 0 5px 0 -3px #3d3323;
    outline: none;
    transition: box-shadow .2s ease;
  }
  .field::placeholder { color: #c8b894; }
  .field:focus { box-shadow: 0 5px 0 -2px #b04a2a; }
  .field:focus-visible { outline: 2px solid #b04a2a; outline-offset: 6px; }
  .field[aria-invalid="true"] { box-shadow: 0 5px 0 -2px #b3352e; }
  .err {
    display: none; margin-top: 10px; color: #b3352e; font-size: .8rem;
  }
  .err.show { display: block; }
  .err::before { content: ">> "; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px; font-family: inherit; font-size: .8rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    color: #faf5e9; background: #3d3323;
    border: none; cursor: pointer;
    transition: background .15s ease;
  }
  .btn:hover { background: #b04a2a; }
  .btn:focus-visible { outline: 2px solid #b04a2a; outline-offset: 3px; }
  .val { margin: 0; color: #9c8a63; font-size: .82rem; }
  .val b { color: #3d3323; }
  .hint { margin-top: 2.8rem; color: #b3a27d; font-size: .8rem; }
  .credit { margin-top: 2.4rem; padding-top: 1.1rem; border-top: 1px solid #e2d5b6; color: #b3a27d; font-size: .75rem; }
  .credit a { color: #5b4a2f; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Mono Editorial</h1>
  <p class="sub">A typesetter's rule beneath the type / La regla del tipógrafo bajo el texto</p>
  <form novalidate>
    <label class="lbl" data-testid="label" for="f08">Email address</label>
    <input class="field" type="email" id="f08" data-testid="field" aria-label="Email address" aria-describedby="err08" placeholder="you@example.com">
    <p class="err" id="err08" data-testid="error" role="alert">Enter a valid email address</p>
    <div class="row">
      <button class="btn" type="submit" data-testid="submit" aria-label="Submit email">Save</button>
      <p class="val">value: <b data-testid="value" aria-live="polite"></b></p>
    </div>
  </form>
  <p class="hint">A double rule grows under focus / Una doble regla crece al enfocar</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const field = document.querySelector('[data-testid="field"]');
  const err = document.querySelector('[data-testid="error"]');
  const out = document.querySelector('[data-testid="value"]');
  const form = document.querySelector('form');
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function validate() {
    const ok = EMAIL.test(field.value);
    err.classList.toggle('show', !ok);
    field.setAttribute('aria-invalid', String(!ok));
    return ok;
  }
  field.addEventListener('input', () => { out.textContent = field.value; });
  field.addEventListener('blur', validate);
  form.addEventListener('submit', (e) => { e.preventDefault(); validate(); });
</script>
</body>
</html>
