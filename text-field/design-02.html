<!-- Design 02: Line Only / Solo Línea -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Only Text Field — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fdfdfb;
    overflow-x: hidden;
  }
  .stage {
    width: min(520px, 94vw);
    padding: clamp(40px, 8vw, 80px) clamp(28px, 6vw, 60px);
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 20px 60px rgba(0,0,0,.05);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.3rem); color: #111827; font-weight: 300; letter-spacing: .02em; }
  .sub { margin: .4rem 0 3rem; color: #6b7280; font-size: .9rem; letter-spacing: .06em; text-transform: uppercase; }
  .lbl { display: block; margin: 0 0 6px; color: #6b7280; font-size: .74rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .field {
    width: 100%;
    padding: 10px 2px;
    font-size: 1.1rem; color: #111827;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid #d1d5db;
    border-radius: 0;
    outline: none;
    transition: border-color .2s ease;
  }
  .field::placeholder { color: #d1d5db; }
  .field:focus { border-color: #111827; }
  .field:focus-visible { outline: 2px solid #111827; outline-offset: 6px; }
  .field[aria-invalid="true"] { border-color: #dc2626; }
  .err {
    display: none; margin-top: 8px; color: #dc2626; font-size: .8rem;
  }
  .err.show { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .btn {
    padding: 9px 24px; font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: #fff; background: #111827;
    border: none; border-radius: 2px; cursor: pointer;
    transition: background .15s ease;
  }
  .btn:hover { background: #374151; }
  .btn:focus-visible { outline: 2px solid #111827; outline-offset: 3px; }
  .val { margin: 0; color: #9ca3af; font-size: .82rem; }
  .val b { color: #111827; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .hint { margin-top: 3rem; color: #9ca3af; font-size: .8rem; }
  .credit { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid #f3f4f6; color: #9ca3af; font-size: .78rem; }
  .credit a { color: #374151; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Line Only</h1>
  <p class="sub">Nothing but the line / Nada más que la línea</p>
  <form novalidate>
    <label class="lbl" data-testid="label" for="f02">Email address</label>
    <input class="field" type="email" id="f02" data-testid="field" aria-label="Email address" aria-describedby="err02" placeholder="you@example.com">
    <p class="err" id="err02" data-testid="error" role="alert">Enter a valid email address</p>
    <div class="row">
      <button class="btn" type="submit" data-testid="submit" aria-label="Submit email">Save</button>
      <p class="val">value: <b data-testid="value" aria-live="polite"></b></p>
    </div>
  </form>
  <p class="hint">Type to fill the line; the underline is the field — / Escribe para llenar la línea; el subrayado es el campo</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const field = document.querySelector('[data-testid="field"]');
  const err = document.querySelector('[data-testid="error"]');
  const out = document.querySelector('[data-testid="value"]');
  const form = document.querySelector('form');
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function validate() {
    const ok = EMAIL.test(field.value);
    err.classList.toggle('show', !ok);
    field.setAttribute('aria-invalid', String(!ok));
    return ok;
  }
  field.addEventListener('input', () => { out.textContent = field.value; });
  field.addEventListener('blur', validate);
  form.addEventListener('submit', (e) => { e.preventDefault(); validate(); });
</script>
</body>
</html>
