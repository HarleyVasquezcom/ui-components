<!-- Design 03: Filled Plate / Placa Rellena -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filled Plate Text Field — Design 03</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #faf6f0;
    overflow-x: hidden;
  }
  .stage {
    width: min(580px, 94vw);
    padding: clamp(30px, 6vw, 58px);
    background: #fffdf9;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(120,90,50,.12);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #4a3f2d; font-weight: 700; }
  .sub { margin: .3rem 0 2.4rem; color: #a39479; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 8px; color: #8a6d3b; font-size: .9rem; font-weight: 700; }
  .field {
    width: 100%;
    padding: 15px 18px;
    font-size: 1rem; color: #3d3526;
    background: #f3ece2;
    border: 2px solid transparent;
    border-radius: 12px;
    outline: none;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .field::placeholder { color: #c2b49a; }
  .field:focus { background: #fff; border-color: #c96f3c; box-shadow: 0 6px 16px rgba(201,111,60,.18); }
  .field:focus-visible { outline: 2px solid #a15a2e; outline-offset: 2px; }
  .field[aria-invalid="true"] { border-color: #b3352e; background: #fdf1ef; }
  .err {
    display: none; margin-top: 8px; color: #b3352e; font-size: .8rem; font-weight: 600;
  }
  .err.show { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    padding: 12px 28px; font-size: .92rem; font-weight: 700;
    color: #fff; background: #c96f3c;
    border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(201,111,60,.3);
    transition: background .15s ease, transform .12s ease;
  }
  .btn:hover { background: #b3602f; transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid #a15a2e; outline-offset: 3px; }
  .val { margin: 0; color: #a39479; font-size: .88rem; }
  .val b { color: #4a3f2d; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .hint { margin-top: 2.2rem; color: #b3a489; font-size: .8rem; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #efe7d8; color: #a39479; font-size: .78rem; }
  .credit a { color: #c96f3c; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Filled Plate</h1>
  <p class="sub">Warm clay fills the field / La arcilla cálida rellena el campo</p>
  <form novalidate>
    <label class="lbl" data-testid="label" for="f03">Email address</label>
    <input class="field" type="email" id="f03" data-testid="field" aria-label="Email address" aria-describedby="err03" placeholder="you@example.com">
    <p class="err" id="err03" data-testid="error" role="alert">Enter a valid email address</p>
    <div class="row">
      <button class="btn" type="submit" data-testid="submit" aria-label="Submit email">Save</button>
      <p class="val">value: <b data-testid="value" aria-live="polite"></b></p>
    </div>
  </form>
  <p class="hint">Filled plate focus: white plate, warm border — / En el foco la placa se vuelve blanca con borde cálido</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const field = document.querySelector('[data-testid="field"]');
  const err = document.querySelector('[data-testid="error"]');
  const out = document.querySelector('[data-testid="value"]');
  const form = document.querySelector('form');
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function validate() {
    const ok = EMAIL.test(field.value);
    err.classList.toggle('show', !ok);
    field.setAttribute('aria-invalid', String(!ok));
    return ok;
  }
  field.addEventListener('input', () => { out.textContent = field.value; });
  field.addEventListener('blur', validate);
  form.addEventListener('submit', (e) => { e.preventDefault(); validate(); });
</script>
</body>
</html>
