<!-- Design 07: Bordered Plate / Placa con Borde -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordered Plate Text Area — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #eef2f7;
    overflow-x: hidden;
  }
  .stage {
    width: min(600px, 94vw);
    padding: clamp(30px, 6vw, 58px);
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(30,58,138,.1);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #1e3a8a; font-weight: 700; }
  .sub { margin: .3rem 0 2.4rem; color: #60a5fa; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #1e40af; font-size: .9rem; font-weight: 700; }
  .area {
    width: 100%;
    min-height: 160px;
    padding: 15px 17px;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 1rem; line-height: 1.6; color: #0f172a;
    background: #f8fafc;
    border: 2px solid #bfdbfe;
    border-radius: 8px;
    outline: none;
    resize: vertical;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .area::placeholder { color: #93c5fd; }
  .area:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.1); }
  .area:focus-visible { outline: 2px solid #1e40af; outline-offset: 3px; }
  .ctr { display: flex; justify-content: flex-end; gap: 18px; margin-top: 10px; color: #60a5fa; font-size: .82rem; font-weight: 600; }
  .ctr b { color: #1e3a8a; }
  .hint { margin-top: 2.2rem; color: #93c5fd; font-size: .82rem; }
  .credit { margin-top: 2.2rem; padding-top: 1.1rem; border-top: 1px solid #eff6ff; color: #93c5fd; font-size: .78rem; }
  .credit a { color: #2563eb; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Bordered Plate</h1>
  <p class="sub">A crisp blue frame / Un marco azul nítido</p>
  <label class="lbl" data-testid="label" for="a07">Feedback</label>
  <textarea class="area" id="a07" data-testid="area" aria-label="Feedback" placeholder="Your feedback goes here…"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">Sharp corners, sharp counting / Esquinas nítidas, conteo nítido</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
