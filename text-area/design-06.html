<!-- Design 06: Minimal Line / Línea Mínima -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Line Text Area — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #ffffff;
    overflow-x: hidden;
  }
  .stage {
    width: min(540px, 94vw);
    padding: clamp(44px, 9vw, 80px) clamp(28px, 6vw, 60px);
    background: #fff;
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.3rem); color: #0f172a; font-weight: 200; letter-spacing: .02em; }
  .sub { margin: .4rem 0 3rem; color: #94a3b8; font-size: .88rem; }
  .lbl { display: block; margin: 0 0 8px; color: #64748b; font-size: .76rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .area {
    width: 100%;
    min-height: 130px;
    padding: 10px 2px;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 1.05rem; line-height: 1.7; color: #0f172a;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid #e2e8f0;
    border-radius: 0;
    outline: none;
    resize: vertical;
    transition: border-color .2s ease;
  }
  .area::placeholder { color: #cbd5e1; }
  .area:focus { border-color: #0f172a; }
  .area:focus-visible { outline: 2px solid #0f172a; outline-offset: 6px; }
  .ctr { display: flex; justify-content: flex-end; gap: 18px; margin-top: 10px; color: #94a3b8; font-size: .78rem; }
  .ctr b { color: #64748b; }
  .hint { margin-top: 3rem; color: #94a3b8; font-size: .8rem; }
  .credit { margin-top: 2.6rem; padding-top: 1.2rem; border-top: 1px solid #f1f5f9; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #0f172a; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Minimal Line</h1>
  <p class="sub">A single rule, nothing else / Una sola regla, nada más</p>
  <label class="lbl" data-testid="label" for="a06">Notes</label>
  <textarea class="area" id="a06" data-testid="area" aria-label="Notes" placeholder="One line that holds many…"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">The quietest counter in the room / El contador más silencioso de la sala</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
