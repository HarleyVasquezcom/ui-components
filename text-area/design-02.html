<!-- Design 02: Terminal Mono / Mono Terminal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Mono Text Area — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: #060a06;
    overflow-x: hidden;
  }
  .stage {
    position: relative; z-index: 1;
    width: min(660px, 94vw);
    padding: clamp(24px, 6vw, 56px);
    background: #0a0f0a;
    border: 1px solid #1e3a24;
    box-shadow: 0 0 0 1px #111, 0 0 40px rgba(51,255,102,.08);
    text-align: left;
    overflow: hidden;
  }
  .termbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; margin: -24px -56px 0 0;
    background: #111; border-bottom: 1px solid #1e3a24;
    font-size: .75rem; color: #5faa72;
  }
  .termbar b { color: #33ff66; }
  h1 { margin: 1.4rem 0 .2rem; font-size: clamp(1.2rem, 3.5vw, 1.8rem); font-weight: 700; color: #33ff66; text-transform: uppercase; letter-spacing: .12em; }
  .sub { margin: 0 0 1.6rem; font-size: .82rem; color: #6f9a7c; }
  .lbl { display: block; margin: 0 0 6px; color: #33ff66; font-size: .8rem; }
  .prompt { font-size: .85rem; color: #4a8f5c; margin-bottom: .8rem; }
  .prompt .p { color: #33ff66; }
  .area {
    width: 100%;
    min-height: 170px;
    padding: 12px 14px;
    font-family: inherit; font-size: .95rem; line-height: 1.6; color: #d9f5e0;
    background: #0d150d;
    border: 1px solid #1e3a24;
    border-radius: 4px;
    outline: none;
    resize: vertical;
    caret-color: #33ff66;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .area::placeholder { color: #3a6b47; }
  .area:focus { border-color: #33ff66; box-shadow: 0 0 0 2px rgba(51,255,102,.18); }
  .area:focus-visible { outline: 2px solid #33ff66; outline-offset: 2px; }
  .ctr { display: flex; justify-content: flex-end; gap: 18px; margin-top: 8px; color: #4a8f5c; font-size: .78rem; }
  .ctr b { color: #33ff66; }
  .hint { margin-top: 1.6rem; font-size: .78rem; color: #3a6b47; }
  .credit { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px solid #13251a; color: #3a6b47; font-size: .75rem; }
  .credit a { color: #33ff66; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <div class="termbar" aria-hidden="true"><span><b>bash</b> — ui-kit v2.0</span><span>● ● ●</span></div>
  <h1>Terminal Mono</h1>
  <p class="sub">cat &gt; draft.txt — character daemon / daemon de caracteres</p>
  <p class="prompt"><span class="p">user@ui-kit:~$</span> nano draft.txt</p>
  <label class="lbl" data-testid="label" for="a02">buffer</label>
  <textarea class="area" id="a02" data-testid="area" aria-label="Text buffer" placeholder="$ type here"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">$ wc -c -l — the daemon counts as you type — / el daemon cuenta mientras escribes</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
