<!-- Design 09: Soft Field / Campo Suave -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Field Text Area — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #fdf2f8, #ffe4e6 60%, #fef3c7);
    overflow-x: hidden;
  }
  .stage {
    width: min(580px, 94vw);
    padding: clamp(32px, 7vw, 60px);
    background: #fff;
    border-radius: 26px;
    box-shadow: 0 30px 70px rgba(244,114,182,.16);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #831843; font-weight: 700; }
  .sub { margin: .3rem 0 2.4rem; color: #f472b6; font-size: .92rem; font-weight: 600; }
  .lbl { display: block; margin: 0 0 10px; color: #9d174d; font-size: .9rem; font-weight: 700; }
  .area {
    width: 100%;
    min-height: 160px;
    padding: 18px 20px;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 1rem; line-height: 1.6; color: #4c0519;
    background: #fdf2f8;
    border: 2px solid #fbcfe8;
    border-radius: 18px;
    outline: none;
    resize: vertical;
    box-shadow: inset 0 2px 6px rgba(190,24,93,.05);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .area::placeholder { color: #f9a8d4; }
  .area:focus { border-color: #ec4899; box-shadow: 0 0 0 5px rgba(236,72,153,.12); }
  .area:focus-visible { outline: 2px solid #be185d; outline-offset: 3px; }
  .ctr { display: flex; justify-content: flex-end; gap: 18px; margin-top: 10px; color: #f472b6; font-size: .82rem; font-weight: 600; }
  .ctr b { color: #be185d; }
  .hint { margin-top: 2.2rem; color: #f9a8d4; font-size: .82rem; }
  .credit { margin-top: 2.2rem; padding-top: 1.1rem; border-top: 1px solid #fdf2f8; color: #f9a8d4; font-size: .78rem; }
  .credit a { color: #ec4899; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Soft Field</h1>
  <p class="sub">Pillow-soft petals for your text / Pétalos suaves para tu texto</p>
  <label class="lbl" data-testid="label" for="a09">Message</label>
  <textarea class="area" id="a09" data-testid="area" aria-label="Message" placeholder="Say something soft…"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">Rounded, gentle, still counting / Redondeado, gentil, aún contando</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
