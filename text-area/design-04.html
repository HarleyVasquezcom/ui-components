<!-- Design 04: Glass Panel / Panel de Cristal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Panel Text Area — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #831843 100%);
    overflow-x: hidden;
    position: relative;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(60px); z-index: 0;
  }
  body::before { width: 380px; height: 380px; left: -100px; top: -80px; background: rgba(129,140,248,.5); }
  body::after { width: 340px; height: 340px; right: -90px; bottom: -100px; background: rgba(244,114,182,.45); }
  .stage {
    position: relative; z-index: 1;
    width: min(620px, 94vw);
    padding: clamp(30px, 6vw, 58px);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #f5f3ff; font-weight: 700; }
  .sub { margin: .3rem 0 2.2rem; color: #c7d2fe; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #e0e7ff; font-size: .9rem; font-weight: 600; }
  .area {
    width: 100%;
    min-height: 170px;
    padding: 16px 18px;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 1rem; line-height: 1.6; color: #f5f3ff;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 14px;
    outline: none;
    resize: vertical;
    caret-color: #c7d2fe;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .area::placeholder { color: #a5b4fc; }
  .area:focus { border-color: #a5b4fc; box-shadow: 0 0 0 4px rgba(165,180,252,.16); }
  .area:focus-visible { outline: 2px solid #c7d2fe; outline-offset: 3px; }
  .ctr { display: flex; justify-content: flex-end; gap: 16px; margin-top: 10px; color: #a5b4fc; font-size: .82rem; }
  .ctr b { color: #e0e7ff; }
  .hint { margin-top: 2rem; color: #a5b4fc; font-size: .8rem; }
  .credit { margin-top: 2.2rem; padding-top: 1.1rem; border-top: 1px solid rgba(255,255,255,.14); color: #a5b4fc; font-size: .78rem; }
  .credit a { color: #c7d2fe; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Glass Panel</h1>
  <p class="sub">Frosted glass over midnight gradients / Cristal esmerilado sobre gradientes nocturnos</p>
  <label class="lbl" data-testid="label" for="a04">Message</label>
  <textarea class="area" id="a04" data-testid="area" aria-label="Message" placeholder="Write through the glass…"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">Glass, but fully functional — drag the corner / Cristal, pero totalmente funcional — arrastra la esquina</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
