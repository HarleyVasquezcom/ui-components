<!-- Design 01: Editorial Sheet / Hoja Editorial -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Sheet Text Area — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    background: #f1ece2;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(34px, 7vw, 60px);
    background: #fbf7ee;
    border: 1px solid #e6dcc6;
    box-shadow: 0 28px 70px rgba(90,70,40,.14);
  }
  h1 { margin: 0; font-size: clamp(1.8rem, 5.5vw, 2.5rem); color: #2f2a20; font-weight: 400; }
  .sub { margin: .4rem 0 1.6rem; color: #a08a5f; font-size: .95rem; font-style: italic; }
  .rule { height: 3px; background: #b04a2a; width: 72px; margin: 0 0 1.8rem; }
  .lbl { display: block; margin: 0 0 10px; color: #4a4232; font-size: .92rem; font-weight: 700; letter-spacing: .04em; }
  .area {
    width: 100%;
    min-height: 170px;
    padding: 18px 20px;
    font-family: inherit; font-size: 1.02rem; line-height: 1.7; color: #2f2a20;
    background: #fffdf7;
    border: 1px solid #e0d5bc;
    border-left: 4px solid #b04a2a;
    outline: none;
    resize: vertical;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.02);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .area::placeholder { color: #c6b896; }
  .area:focus { border-color: #b04a2a; border-left-width: 4px; box-shadow: 0 8px 24px rgba(176,74,42,.1); }
  .area:focus-visible { outline: 2px solid #8c3a20; outline-offset: 3px; }
  .ctr { display: flex; justify-content: flex-end; gap: 16px; margin-top: 10px; color: #a08a5f; font-size: .82rem; }
  .ctr b { color: #4a4232; }
  .hint { margin-top: 2rem; color: #b3a27d; font-size: .85rem; font-style: italic; }
  .credit { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid #e6dcc6; color: #b3a27d; font-size: .8rem; }
  .credit a { color: #4a4232; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Editorial Sheet</h1>
  <p class="sub">A manuscript page that counts your words / Una página de manuscrito que cuenta tus palabras</p>
  <div class="rule"></div>
  <label class="lbl" data-testid="label" for="a01">Manuscript</label>
  <textarea class="area" id="a01" data-testid="area" aria-label="Manuscript" placeholder="Start writing…"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">Type away — the sheet counts every character / Escribe — la hoja cuenta cada carácter</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
