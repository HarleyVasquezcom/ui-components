<!-- Design 08: Draft Document / Documento Borrador -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Document Text Area — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e8e2d4;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(34px, 7vw, 60px);
    background: #f7f2e6;
    border: 1px solid #d8cdb4;
    box-shadow: 0 26px 60px rgba(80,60,30,.16);
  }
  .dochead { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 1.6rem; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: #3f3826; font-weight: 700; }
  .stamp {
    border: 2px solid #a33a2f;
    color: #a33a2f;
    padding: 6px 14px;
    font-size: .8rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase;
    transform: rotate(-6deg);
    border-radius: 3px;
    opacity: .85;
  }
  .sub { margin: .2rem 0 1.8rem; color: #9a8a66; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #6b5c3a; font-size: .9rem; font-weight: 700; }
  .area {
    width: 100%;
    min-height: 180px;
    padding: 18px 22px;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: .98rem; line-height: 1.65; color: #3f3826;
    background: #fffdf6;
    border: 1px solid #e0d4b8;
    border-top: 6px solid #d8cdb4;
    outline: none;
    resize: vertical;
    box-shadow: 0 2px 0 rgba(0,0,0,.03);
    transition: box-shadow .2s ease;
  }
  .area::placeholder { color: #c2b48e; }
  .area:focus { box-shadow: 0 2px 0 rgba(0,0,0,.03), 0 10px 26px rgba(163,58,47,.1); }
  .area:focus-visible { outline: 2px solid #a33a2f; outline-offset: 3px; }
  .ctr { display: flex; justify-content: flex-end; gap: 18px; margin-top: 10px; color: #9a8a66; font-size: .82rem; }
  .ctr b { color: #6b5c3a; }
  .hint { margin-top: 2rem; color: #b3a27d; font-size: .82rem; font-style: italic; }
  .credit { margin-top: 2.2rem; padding-top: 1.1rem; border-top: 1px solid #ddd2b8; color: #b3a27d; font-size: .78rem; }
  .credit a { color: #6b5c3a; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <div class="dochead">
    <h1>Draft Document</h1>
    <span class="stamp">DRAFT</span>
  </div>
  <p class="sub">Still in the making / Aún en proceso</p>
  <label class="lbl" data-testid="label" for="a08">Body text</label>
  <textarea class="area" id="a08" data-testid="area" aria-label="Body text" placeholder="Begin the draft…"></textarea>
  <p class="ctr"><span>chars: <b data-testid="chars">0</b></span><span>lines: <b data-testid="lines">0</b></span></p>
  <p class="hint">Every document starts here / Todo documento empieza aquí</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const area = document.querySelector('[data-testid="area"]');
  const chars = document.querySelector('[data-testid="chars"]');
  const lines = document.querySelector('[data-testid="lines"]');
  function upd() {
    const v = area.value;
    chars.textContent = v.length;
    lines.textContent = v ? v.split('\n').length : 0;
  }
  area.addEventListener('input', upd);
  upd();
</script>
</body>
</html>
