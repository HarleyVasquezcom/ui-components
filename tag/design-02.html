<!-- Design 02: Tag Minimal / Minimal Tag -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e2e8f0;
    color: #334155;
    overflow-x: hidden;
  }
  .tag { display: inline-block; padding: 6px 12px; background: #fff; color: #334155; border: 2px solid #cbd5e1; border-radius: 9999px; font-size: .75rem; font-weight: 600; position: relative; margin: 2px; transition: border-color .2s; }
  .tag:hover { border-color: #3b82f6; }
  .tag:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .tag::after { content: ''; position: absolute; top: 50%; right: -8px; transform: translateY(-50%); width: 0; height: 0; border-left: 6px solid #cbd5e1; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .tag .tag-remove { position: absolute; top: 50%; right: -12px; transform: translateY(-50%); width: 14px; height: 14px; background: #fff; border: 2px solid #cbd5e1; border-radius: 50; font-size: .65rem; color: #cbd5e1; cursor: pointer; line-height: 1; }
  .tag .tag-remove:hover { background: #cbd5e1; color: #fff; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .tag { padding: 4px 8px; font-size: .65rem; margin: 1px; } }
</style>
</head>
<body>
<label class="lbl" data-testid="label" for="tag-02">Work</label>
<span class="tag" data-testid="tag" data-tag id="tag-02" aria-label="Tag">Work <span class="tag-remove" aria-label="Remove tag">×</span></span>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
