<!-- Design 10: Tag Neon / Neon Tag -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag — Design 10</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    overflow-x: hidden;
  }
  .tag { display: inline-block; padding: 6px 12px; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: #fff; border-radius: 9999px; font-size: .75rem; font-weight: 600; position: relative; margin: 2px; transition: box-shadow .3s; }
  .tag:hover { box-shadow: 0 0 20px rgba(6,182,212,0.4); }
  .tag:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .tag::after { content: ''; position: absolute; top: 50%; right: -8px; transform: translateY(-50%); width: 0; height: 0; border-left: 6px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .tag .tag-remove { position: absolute; top: 50%; right: -12px; transform: translateY(-50%); width: 14px; height: 14px; background: transparent; border: 2px solid #fff; border-radius: 50; font-size: .65rem; color: #fff; cursor: pointer; line-height: 1; }
  .tag .tag-remove:hover { background: #fff; color: #64748b; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #334155; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #64748b; text-decoration: none; }
  @media (max-width: 480px) { .tag { padding: 4px 8px; font-size: .65rem; margin: 1px; } }
</style>
</head>
<body>
<label class="lbl" data-testid="label" for="tag-10">Urgent</label>
<span class="tag" data-testid="tag" data-tag id="tag-10" aria-label="Tag">Urgent <span class="tag-remove" aria-label="Remove tag">×</span></span>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
