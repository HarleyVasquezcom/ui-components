<!-- Design 05: Gradient Trigger / Gradient Tooltip -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltip — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e2e8f0;
    color: #334155;
    overflow-x: hidden;
  }
  .tooltip-wrapper { position: relative; display: inline-block; }
  .tooltip-trigger { padding: 8px 16px; background: linear-gradient(135deg, #6b46c1 0%, #a855f7 100%); color: #fff; border-radius: 6px; font-size: .875rem; font-weight: 500; cursor: pointer; }
  .tooltip-trigger:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .tooltip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-8px); background: #fff; color: #334155; padding: 8px 12px; border-radius: 8px; font-size: .75rem; line-height: 1.4; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity .2s visibility .2s; z-index: 100; }
  .tooltip.open { opacity: 1; visibility: visible; transition: opacity .1s, visibility .1s; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  @media (max-width: 480px) { .tooltip { left: 50%; transform: translateX(-50%) translateY(-4px); padding: 6px 10px; font-size: .625rem; } }
</style>
</head>
<body>
<div class="tooltip-wrapper" data-testid="tooltip" aria-label="Tooltip design" data-tooltip>
  <button class="tooltip-trigger" aria-describedby="tt-05">Options</button>
  <div class="tooltip" id="tt-05" role="tooltip">Choose an action</div>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
