<!-- Design 07: Dock Bar / Barra de Muelle -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sidebar - Design 07</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#4f46e5,#db2777);color:#fff;display:grid;place-items:center;overflow-x:hidden}.sidebar-wrapper{width:min(360px,92vw)}
  .sidebar{position:fixed;top:50%;left:18px;transform:translateY(-50%);width:64px;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:width .25s ease;z-index:100}
  .sidebar.open{width:232px;align-items:flex-start;padding:14px}
  .sidebar .toggle{flex:none;width:34px;height:34px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;cursor:pointer;color:#e2e8f0;transition:background .2s}
  .sidebar .toggle:hover,.sidebar .toggle.active{background:#f59e0b;border-color:#f59e0b;color:#0f172a}
  .sidebar .toggle svg{width:16px;height:16px}
  .sidebar nav{width:100%;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateX(-6px);transition:opacity .2s .1s,transform .2s .1s}
  .sidebar.open nav{opacity:1;transform:none}
  .sidebar a{display:flex;align-items:center;gap:10px;color:#cbd5e1;font-size:.86rem;text-decoration:none;padding:9px 10px;border-radius:10px;white-space:nowrap;transition:background .2s,color .2s}
  .sidebar a svg{flex:none;width:18px;height:18px}
  .sidebar a:hover{background:rgba(255,255,255,.14);color:#fff}
  .sidebar a.active{background:#f59e0b;color:#0f172a}
  .credit{margin-top:30px;padding:14px 0;border-top:1px solid rgba(255,255,255,.25);color:#fde68a;font-size:.78rem}.credit a{color:#fff;text-decoration:none}
  :focus-visible{outline:3px solid #fde68a;outline-offset:2px}
  @media (max-width:360px){.sidebar{left:8px}.sidebar.open{width:200px}}
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<div class="sidebar-wrapper">
  <aside class="sidebar" data-testid="sidebar" aria-label="Barra lateral" aria-expanded="false" role="navigation" data-sidebar>
    <button class="toggle" data-testid="toggle" aria-label="Abrir menú" aria-controls="sidebar-content" data-toggle>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav id="sidebar-content" aria-label="Contenido de la barra">
      <a href="/inicio" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
      <a href="/nosotros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Nosotros</a>
      <a href="/proyectos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Proyectos</a>
      <a href="/contacto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M3 7l9 6 9-6"/></svg>Contacto</a>
    </nav>
  </aside>
</div>
<script>(()=>{const s=document.querySelector('[data-sidebar]'),t=document.querySelector('[data-toggle]');let o=false;const tg=()=>{o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)};t.addEventListener('click',tg);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&o){o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)}});document.addEventListener('focusin',e=>{if(o&&!s.contains(e.target)){o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)}})})();</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>

<script>
(function(){
  var toggle = document.querySelector('[data-testid="toggle"]');
  var sidebar = document.querySelector('[data-testid="sidebar"]');
  if(!toggle || !sidebar) return;
  sidebar.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', function(){
    var expanded = sidebar.getAttribute('aria-expanded') === 'true';
    sidebar.setAttribute('aria-expanded', String(!expanded));
    sidebar.classList.toggle('open');
  });
})();
</script>
<script>
(function(){
  var t=document.querySelector('[data-testid="toggle"]');
  var s=document.querySelector('[data-testid="sidebar"]');
  if(!t||!s)return;
  s.setAttribute('aria-expanded','false');
  t.addEventListener('click',function(){
    var e=s.getAttribute('aria-expanded')==='true';
    s.setAttribute('aria-expanded',String(!e));
    s.classList.toggle('open');
  });
})();
</script>
</body>
</html>
