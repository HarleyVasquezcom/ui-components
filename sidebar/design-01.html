<!-- Design 01: Collapsible Grid / Cuadrícula Desplegable -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sidebar — Design 01</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;overflow-x:hidden}.sidebar-wrapper{width:min(320px,90vw)}.sidebar{position:fixed;top:0;left:-300px;width:300px;height:100vh;background:#fff;transition:left .3s ease;border-right:1px solid #e2e8f0;z-index:100;padding:24px;display:flex;flex-direction:column;gap:16px}.sidebar.open{left:0}.sidebar .toggle{align-self:flex-start;width:24px;height:24px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:50%;cursor:pointer;padding:4px}.sidebar .toggle:hover{background:#e2e8f0}.sidebar .toggle svg{width:18px;height:18px;fill:#64748b}.sidebar .toggle.active svg{fill:#3b82f6}.sidebar .focus-visible:focus-visible{outline:3pxsolid#3b82f6;outline-offset:4px}.sidebar a{color:#0f172a;font-size:.9rem}.sidebar .sub{color:#64748b;font-size:.8rem}.credit{margin-top:30px;padding:15px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:.8rem}.credit a{color:#2563eb;text-decoration:none}.media{display:none}.@media (max-width:360px){.sidebar{width:280px}}input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body><div class="sidebar-wrapper"><aside class="sidebar" data-testid="sidebar" aria-label="Barra lateral" aria-expanded="false" role="navigation" data-sidebar><button class="toggle" data-testid="toggle" aria-label="Abrir menú" aria-controls="sidebar-content" data-toggle><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><nav id="sidebar-content" aria-label="Contenido de la barra"><h2 class="sub">Menú principal</h2><a href="/inicio" class="active">Inicio</a><a href="/nosotros">Nosotros</a><details><summary>Submenú avanzado</summary><a href="/sub1">Opción 1</a><a href="/sub2">Opción 2</a></details><a href="/contacto">Contacto</a></nav></aside></div><script>(()=>{const s=document.querySelector('[data-sidebar]'),t=document.querySelector('[data-toggle]');let o=false;const tg=()=>{o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)};t.addEventListener('click',tg);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&o){o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)}});document.addEventListener('focusin',e=>{if(o&&!s.contains(e.target)){o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)}})})();</script><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
<script>
(function(){
  var toggle = document.querySelector('[data-testid="toggle"]');
  var sidebar = document.querySelector('[data-testid="sidebar"]');
  if(!toggle || !sidebar) return;
  sidebar.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', function(){
    var expanded = sidebar.getAttribute('aria-expanded') === 'true';
    sidebar.setAttribute('aria-expanded', String(!expanded));
    sidebar.classList.toggle('open');
  });
})();
</script>
<script>
(function(){
  var t=document.querySelector('[data-testid="toggle"]');
  var s=document.querySelector('[data-testid="sidebar"]');
  if(!t||!s)return;
  s.setAttribute('aria-expanded','false');
  t.addEventListener('click',function(){
    var e=s.getAttribute('aria-expanded')==='true';
    s.setAttribute('aria-expanded',String(!e));
    s.classList.toggle('open');
  });
})();
</script>
</body></html>
