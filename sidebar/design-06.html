<!-- Design 06: Sliding Rail / Carril Deslizante -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sidebar - Design 06</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;overflow-x:hidden}.sidebar-wrapper{width:min(360px,92vw)}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:64px;background:#1e293b;border-right:1px solid #334155;transition:width .25s ease;z-index:100;padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:18px;overflow:hidden}
  .sidebar.open{width:280px;align-items:flex-start;padding:20px 20px}
  .sidebar .toggle{flex:none;width:34px;height:34px;background:#334155;border:1px solid #475569;border-radius:10px;cursor:pointer;color:#94a3b8;transition:color .2s,background .2s}
  .sidebar .toggle:hover,.sidebar .toggle.active{background:#3b82f6;color:#fff}
  .sidebar .toggle svg{width:16px;height:16px}
  .sidebar nav{width:100%;flex:1;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateX(-8px);transition:opacity .2s .1s,transform .2s .1s}
  .sidebar.open nav{opacity:1;transform:none}
  .sidebar .sub{color:#64748b;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 2px;white-space:nowrap}
  .sidebar a{color:#cbd5e1;font-size:.9rem;text-decoration:none;padding:9px 12px;border-radius:8px;white-space:nowrap;transition:background .2s,color .2s}
  .sidebar a:hover{background:#334155;color:#fff}
  .sidebar a.active{background:#3b82f6;color:#fff}
  .credit{margin-top:28px;padding:14px 0;border-top:1px solid #334155;color:#64748b;font-size:.78rem}.credit a{color:#60a5fa;text-decoration:none}
  :focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
  @media (max-width:360px){.sidebar.open{width:240px}.sidebar a{font-size:.82rem}}
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<div class="sidebar-wrapper">
  <aside class="sidebar" data-testid="sidebar" aria-label="Barra lateral" aria-expanded="false" role="navigation" data-sidebar>
    <button class="toggle" data-testid="toggle" aria-label="Abrir menú" aria-controls="sidebar-content" data-toggle>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav id="sidebar-content" aria-label="Contenido de la barra">
      <h2 class="sub">Main menu / Menú</h2>
      <a href="/inicio" class="active">Inicio</a>
      <a href="/nosotros">Nosotros</a>
      <a href="/proyectos">Proyectos</a>
      <a href="/contacto">Contacto</a>
    </nav>
  </aside>
</div>
<script>(()=>{const s=document.querySelector('[data-sidebar]'),t=document.querySelector('[data-toggle]');let o=false;const tg=()=>{o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)};t.addEventListener('click',tg);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&o){o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)}});document.addEventListener('focusin',e=>{if(o&&!s.contains(e.target)){o=!o;s.setAttribute('aria-expanded',o);t.setAttribute('aria-expanded',o);s.classList.toggle('open',o)}})})();</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>

<script>
(function(){
  var toggle = document.querySelector('[data-testid="toggle"]');
  var sidebar = document.querySelector('[data-testid="sidebar"]');
  if(!toggle || !sidebar) return;
  sidebar.setAttribute('aria-expanded', 'false');
  toggle.addEventListener('click', function(){
    var expanded = sidebar.getAttribute('aria-expanded') === 'true';
    sidebar.setAttribute('aria-expanded', String(!expanded));
    sidebar.classList.toggle('open');
  });
})();
</script>
<script>
(function(){
  var t=document.querySelector('[data-testid="toggle"]');
  var s=document.querySelector('[data-testid="sidebar"]');
  if(!t||!s)return;
  s.setAttribute('aria-expanded','false');
  t.addEventListener('click',function(){
    var e=s.getAttribute('aria-expanded')==='true';
    s.setAttribute('aria-expanded',String(!e));
    s.classList.toggle('open');
  });
})();
</script>
</body>
</html>
