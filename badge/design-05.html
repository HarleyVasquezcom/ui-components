<!-- Design 05: Badge Gradient / Gradient Badge -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e2e8f0;
    color: #334155;
    overflow-x: hidden;
  }
  .badge { width: 120px; padding: 8px 16px; background: linear-gradient(135deg, #6b46c1 0%, #a855f7 100%); color: #fff; border-radius: 9999px; font-size: .875rem; font-weight: 600; position: relative; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(107,70,193,0.3); transition: transform .2s; }
  .badge:hover { transform: translateY(-2px); }
  .badge:focus-visible { outline: 2px solid #64748b; outline-offset: 4px; }
  .badge[data-state="active"] { background: linear-gradient(135deg, #f472b6 0%, #fbbf24 100%); box-shadow: 0 2px 8px rgba(244,114,182,0.4); }
  .badge[data-state="active"]::after { display: none; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .badge { width: 100px; font-size: .75rem; padding: 6px 12px; } }
</style>
</head>
<body>
<label class="lbl" data-testid="label" for="badge-05">Important</label>
<span class="badge" data-testid="badge" data-badge id="badge-05" role="status" aria-label="Badge">Important <span class="badge" data-badge-state>!</span></span>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
