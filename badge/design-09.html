<!-- Design 09: Badge Editor / Editor Badge -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #1e293b;
    color: #f1f5f9;
    overflow-x: hidden;
  }
  .badge { width: 120px; padding: 8px 16px; background: #3b82f6; color: #fff; border-radius: 9999px; font-size: .875rem; font-weight: 600; position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .badge:hover { background: #2563eb; }
  .badge:focus-visible { outline: 2px solid #64748b; outline-offset: 4px; }
  .badge[data-state="active"] { background: #ef4444; box-shadow: 0 2px 8px rgba(239,68,68,0.4); }
  .badge[data-state="active"]::after { display: none; }
  .badge .tag-remove { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); width: 20px; height: 20px; background: transparent; border: none; color: #fff; font-size: .75rem; cursor: pointer; opacity: .6; transition: opacity .2s; }
  .badge .tag-remove:hover { opacity: 1; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #334155; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #64748b; text-decoration: none; }
  @media (max-width: 480px) { .badge { width: 100px; font-size: .75rem; padding: 6px 12px; } }
</style>
</head>
<body>
<label class="lbl" data-testid="label" for="badge-09">Draft</label>
<span class="badge" data-testid="badge" data-badge id="badge-09" aria-label="Badge">Draft <span class="badge" data-badge-state>1</span><button class="tag-remove" aria-label="Remove tag">×</button></span>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
