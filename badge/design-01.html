<!-- Design 01: Badge Pulse / Pulse Badge -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    overflow-x: hidden;
  }
  .badge { width: 120px; padding: 8px 16px; background: #3b82f6; color: #fff; border-radius: 9999px; font-size: .875rem; font-weight: 600; position: relative; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(59,130,246,0.3); }
  .badge::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 24px; height: 24px; background: #60a5fa; border-radius: 9999px; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
  .badge:hover { background: #2563eb; }
  .badge:focus-visible { outline: 2px solid #64748b; outline-offset: 4px; }
  .badge[data-state="active"] { background: #ef4444; box-shadow: 0 2px 8px rgba(239,68,68,0.4); }
  .badge[data-state="active"]::before { display: none; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .badge { width: 100px; font-size: .75rem; padding: 6px 12px; } }
</style>
</head>
<body>
<label class="lbl" data-testid="label" for="badge-01">Notifications</label>
<span class="badge" data-testid="badge" data-badge id="badge-01" role="status" aria-label="Badge">Notifications <span class="badge" data-badge-state>3</span></span>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
