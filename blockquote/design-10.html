<!-- Design 10: Blockquote Light / Claro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockquote — Design 10</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;overflow:hidden}.blockquote{max-width:800px;margin:0 auto;padding:2rem;background:#fafafa;border-left:2px solid #cbd5e1}.blockquote-text{font-size:1.25rem;line-height:1.6;color:#0f172a;margin-bottom:1rem}.blockquote-author{display:flex;justify-content:flex-end;margin-top:1.5rem;font-size:.875rem;color:#64748b}.blockquote-author span{color:#0f172a;margin-left:.5rem}.credit{margin-top:32px;padding:8px 0;border-top:1px solid #e5e7eb;color:#64748b;font-size:.65rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><blockquote class="blockquote" data-testid="blockquote" aria-label="Blockquote design"><p class="blockquote-text">"La simplicidad es la máxima sofisticación."</p><footer class="blockquote-author"><span>Leonardo da Vinci</span></footer></blockquote><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
