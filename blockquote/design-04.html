<!-- Design 04: Blockquote Minimal / Minimalista -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockquote — Design 04</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;overflow:hidden}.blockquote{max-width:800px;margin:0 auto;padding:1.5rem;background:#fafafa;border-left:2px solid #64748b}.blockquote-text{font-size:1.1rem;line-height:1.5;color:#0f172a;margin-bottom:.75rem}.blockquote-author{display:flex;justify-content:flex-end;margin-top:1rem;font-size:.75rem;color:#64748b}.blockquote-author span{color:#0f172a;margin-left:.3rem}.credit{margin-top:32px;padding:8px 0;border-top:1px solid #e5e7eb;color:#64748b;font-size:.65rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
<body><blockquote class="blockquote" data-testid="blockquote" aria-label="Blockquote design"><p class="blockquote-text">"La simplicidad es la máxima sofisticación."</p><footer class="blockquote-author"><span>Leonardo da Vinci</span></footer></blockquote><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer></body></html>
