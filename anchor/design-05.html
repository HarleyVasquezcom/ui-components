<!-- Design 05: gradient-anchor / ancla gradient -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gradient Anchor — Design 05</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      overflow-x: hidden;
    }
    .stage {
      width: min(620px, 94vw);
      padding: clamp(28px, 6vw, 64px);
      border-radius: 16px;
      background: linear-gradient(135deg, #ff512f 0%, #dd2476 50%, #ff512f 100%);
      background-size: 180% 180%;
      animation: gradientShift 8s ease infinite;
      text-align: center;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.5rem); background: linear-gradient(90deg, #fff, #fff); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: .04em; }
    .sub { margin: .8rem 0 2rem; color: #4a4a4a; font-size: .95rem; }
    .anchor {
      position: relative;
      display: inline-block;
      padding: 16px 32px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(221,36,118,.35);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .anchor:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 24px rgba(221,36,118,.45); }
    .anchor:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .anchor:active { transform: scale(.98); box-shadow: 0 2px 6px rgba(221,36,118,.2); }
    .hint { margin-top: 1.5rem; color: #ddd; font-size: .85rem; }
    .credit { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid rgba(255,255,255,.1); color: #fff; font-size: .8rem; }
    .credit a { color: #fff; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="stage">
    <h1>Gradient Anchor</h1>
    <p class="sub">Dynamic color transition — / Transición de color dinámica</p>
    <a class="anchor" data-testid="anchor" name="section1" href="#section1" aria-label="Gradient anchor section">gradient-anchor</a>
    <p class="hint">Click for a vibrant call — / Haz clic para una llamada vibrante</p>
    <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
  <div id="section1" style="height: 70vh;"></div></main>
</body>
</html>
