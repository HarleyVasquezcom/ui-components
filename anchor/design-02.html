<!-- Design 02: bold-anchor / bold-ancla -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bold Anchor — Design 02</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #2d3748;
      overflow-x: hidden;
    }
    .stage {
      width: min(620px, 94vw);
      padding: clamp(28px, 6vw, 64px);
      border-radius: 12px;
      background: #4a5568;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.5rem); color: #fff; letter-spacing: .06em; }
    .sub { margin: .8rem 0 2rem; color: #cbd5e0; font-size: .95rem; }
    .anchor {
      display: inline-block;
      padding: 18px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: #e53e3e;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: background .2s, transform .08s;
    }
    .anchor:hover { background: #fc5c65; transform: translateY(-2px); }
    .anchor:focus-visible { outline: 3px solid #fc5c65; outline-offset: 4px; }
    .anchor:active { background: #c53030; transform: scale(.98); }
    .anchor[aria-current="page"] { background: #c53030; }
    .hint { margin-top: 1.5rem; color: #a0aec0; font-size: .85rem; }
    .credit { margin-top: 2.4rem; padding-top: 1.2rem; border-top: 1px solid #4a5568; color: #a0aec0; font-size: .8rem; }
    .credit a { color: #e53e3e; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="stage">
    <h1>Bold Anchor</h1>
    <p class="sub">Strong visual prominence — / Pronounced visual prominence</p>
    <a class="anchor" data-testid="anchor" name="section1" href="#section1" aria-label="Bold anchor section">bold-anchor</a>
    <p class="hint">High contrast call — / Llamada de alto contraste</p>
    <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
  <div id="section1" style="height: 70vh;"></div></main>
</body>
</html>
