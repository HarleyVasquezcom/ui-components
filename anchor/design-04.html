<!-- Design 04: dark-minimal / oscuro-minimalista -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Minimal Anchor — Design 04</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }
    .stage {
      width: min(620px, 94vw);
      max-width: 420px;
      margin: 0 auto;
      padding: 32px 24px;
      border-radius: 8px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 1.8rem); letter-spacing: .05em; }
    .sub { margin: .5rem 0 1.5rem; color: #888; font-size: .85rem; }
    .anchor {
      display: block;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 500;
      color: #2d3748;
      background: #fff;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      width: fit-content;
      margin: 0 auto 2rem;
    }
    .anchor:hover { background: #f5f5f5; transform: translateY(-1px); }
    .anchor:focus-visible { outline: 2px solid #333; outline-offset: 3px; }
    .anchor:active { transform: translateY(1px); }
    .hint { margin-top: 1rem; color: #666; font-size: .8rem; }
    .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #222; color: #555; font-size: .75rem; }
    .credit a { color: #fff; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="stage">
    <h1>Dark Minimal</h1>
    <p class="sub">Clean dark mode — / Modo oscuro limpio</p>
    <a class="anchor" data-testid="anchor" name="section1" href="#section1" aria-label="Dark minimal anchor section">dark-minimal</a>
    <p class="hint">Simple and readable — / Simple y legible</p>
    <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
  <div id="section1" style="height: 70vh;"></div></main>
</body>
</html>
