<!-- Design 07: list-anchor / ancla-lista -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>List Anchor — Design 07</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: "SF Mono", "Fira Mono", monospace;
      background: #faf0e6;
      color: #2d3748;
      overflow-x: hidden;
    }
    .stage {
      width: min(620px, 94vw);
      max-width: 500px;
      margin: 0 auto;
      padding: 32px 24px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e2d6c8;
      text-align: left;
    }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 1.75rem); color: #1a202c; letter-spacing: .06em; }
    .sub { margin: .5rem 0 1.5rem; color: #4a5568; font-size: .9rem; }
    .anchor {
      display: inline-block;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 500;
      color: #fff;
      background: #319795;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      margin: 0 6px 12px 0;
      transition: background .15s, transform .08s;
    }
    .anchor:hover { background: #38b2ac; transform: translateY(-1px); }
    .anchor:focus-visible { outline: 3px solid #319795; outline-offset: 4px; }
    .anchor:active { transform: scale(.98); }
    .hint { margin-top: 1rem; color: #718096; font-size: .8rem; }
    .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #cbd5e0; color: #718096; font-size: .75rem; }
    .credit a { color: #319795; text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="stage">
    <h1>List Anchor</h1>
    <p class="sub">Multiple anchor links — / Varios enlaces de ancla</p>
    <a class="anchor" data-testid="anchor" name="list1" href="#list1" aria-label="List anchor section">list-anchor</a>
    <p class="hint">Add more anchors below — / Agrega más anclas abajo</p>
    <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
  <div id="section1" style="height: 70vh;"></div></main>
</body>
</html>
