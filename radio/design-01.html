<!-- Design 01: Native Revisit / Nativo Revisitado -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native Revisit Radio — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #f6f9fc, #e9eff6);
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(30,60,110,.14);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #20324e; font-weight: 700; }
  .sub { margin: .3rem 0 2rem; color: #8c9bb3; font-size: .92rem; }
  .group { border: none; margin: 0; padding: 0; }
  legend { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: #8c9bb3; margin-bottom: 12px; padding: 0; }
  .opt {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1px solid #e3e9f1;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .opt:hover { border-color: #9db4d4; background: #f8fafd; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .visual {
    flex: 0 0 auto;
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #b6c4d8;
    display: grid; place-items: center;
    transition: border-color .2s ease;
  }
  .visual::after {
    content: "";
    width: 11px; height: 11px; border-radius: 50%;
    background: #2f6feb;
    transform: scale(0);
    transition: transform .2s cubic-bezier(.5,1.6,.4,1);
  }
  .opt.selected .visual { border-color: #2f6feb; }
  .opt.selected .visual::after { transform: scale(1); }
  .opt input:focus-visible ~ .visual { outline: 3px solid #2f6feb; outline-offset: 3px; }
  .opt .txt { color: #33415c; font-weight: 500; font-size: .95rem; }
  .opt .txt small { display: block; color: #9aa8bd; font-weight: 400; font-size: .78rem; }
  .hint { margin-top: 1.8rem; color: #9aa8bd; font-size: .82rem; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #eef1f6; color: #9aa8bd; font-size: .8rem; }
  .credit a { color: #2f6feb; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Native Revisit</h1>
  <p class="sub">The classic form radio, polished / El radio clásico de formulario, pulido</p>
  <fieldset class="group" data-testid="group">
    <legend>Billing cycle</legend>
    <label class="opt" data-idx="0">
      <input type="radio" name="cycle" value="monthly"
      <span class="visual" aria-hidden="true"</span>
      <span class="txt">Monthly<small>$9 per month — / $9 al mes</small></span>
    </label>
    <label class="opt" data-idx="1">
      <input type="radio" name="cycle" value="yearly"
      <span class="visual" aria-hidden="true"</span>
      <span class="txt">Yearly<small>$79 per year, 2 months free — / $79 al año, 2 meses gratis</small></span>
    </label>
    <label class="opt" data-idx="2">
      <input type="radio" name="cycle" value="lifetime"
      <span class="visual" aria-hidden="true"</span>
      <span class="txt">Lifetime<small>one payment, forever — / un pago, para siempre</small></span>
    </label>
  </fieldset>
  <p class="hint">Click an option or use arrow keys — / Clic o flechas del teclado</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const group = document.querySelector('[data-testid="group"]');
  group.addEventListener('change', (e) => {
    if (e.target.type !== 'radio') return;
    group.querySelectorAll('.opt').forEach((opt) => opt.classList.remove('selected'));
    e.target.closest('.opt').classList.add('selected');
  });
</script>
</body>
</html>
