<!-- Design 06: Minimal Dot / Punto Mínimo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Dot Radio — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #fbfbfa;
    overflow-x: hidden;
  }
  .stage {
    width: min(540px, 94vw);
    padding: clamp(30px, 7vw, 70px);
    background: #fbfbfa;
    border-top: 1px solid #e2e2dc;
    border-bottom: 1px solid #e2e2dc;
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 300; letter-spacing: .24em; text-transform: uppercase; color: #20201c; }
  .sub { margin: .6rem 0 3rem; color: #a6a69d; font-size: .84rem; letter-spacing: .06em; }
  .group { border: none; margin: 0; padding: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  .opt {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 4px;
    border-bottom: 1px solid #eceae4;
    cursor: pointer;
    transition: background .2s ease;
  }
  .opt:hover { background: #f6f6f2; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .dot {
    flex: 0 0 auto;
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid #cfcfc7;
    display: grid; place-items: center;
    transition: border-color .25s ease;
  }
  .dot::after {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: #11110e;
    transform: scale(0);
    transition: transform .25s cubic-bezier(.5,1.6,.4,1);
  }
  .opt.selected .dot { border-color: #11110e; }
  .opt.selected .dot::after { transform: scale(1); }
  .opt input:focus-visible ~ .dot { outline: 2px solid #11110e; outline-offset: 5px; }
  .opt .txt { color: #33332d; font-size: .98rem; letter-spacing: .02em; }
  .opt .txt .k { display: block; font-size: .68rem; letter-spacing: .3em; text-transform: uppercase; color: #b2b2a8; margin-bottom: 3px; }
  .hint { margin-top: 2.6rem; font-size: .75rem; letter-spacing: .14em; color: #b2b2a8; text-transform: uppercase; }
  .credit { margin-top: 2.2rem; padding-top: 1.1rem; border-top: 1px solid #eceae4; font-size: .74rem; color: #b2b2a8; }
  .credit a { color: #4a4a42; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Minimal Dot</h1>
  <p class="sub">Whisper-quiet selection / Selección en susurro</p>
  <fieldset class="group" data-testid="group">
    <legend>Font size</legend>
    <label class="opt" data-idx="0">
      <input type="radio" name="fsize" value="small" checked
      <span class="dot" aria-hidden="true"></span>
      <span class="txt"><span class="k">A</span>Small</span>
    </label>
    <label class="opt" data-idx="1">
      <input type="radio" name="fsize" value="medium"
      <span class="dot" aria-hidden="true"></span>
      <span class="txt"><span class="k">A</span>Medium</span>
    </label>
    <label class="opt" data-idx="2">
      <input type="radio" name="fsize" value="large"
      <span class="dot" aria-hidden="true"></span>
      <span class="txt"><span class="k">A</span>Large</span>
    </label>
  </fieldset>
  <p class="hint">Click to choose — / Clic para elegir</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const group = document.querySelector('[data-testid="group"]');
  group.addEventListener('change', (e) => {
    if (e.target.type !== 'radio') return;
    group.querySelectorAll('.opt').forEach((opt) => opt.classList.remove('selected'));
    e.target.closest('.opt').classList.add('selected');
  });
</script>
</body>
</html>
