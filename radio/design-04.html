<!-- Design 04: Dial Knob / Perilla Giratoria -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial Knob Radio — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #221f1a, #171512);
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: radial-gradient(80% 60% at 50% 10%, #33302a, #1d1b17 75%);
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); color: #f0e6d3; font-weight: 300; letter-spacing: .08em; }
  .sub { margin: .4rem 0 2.2rem; color: #8f8472; font-size: .9rem; }
  .dialwrap { position: relative; width: min(270px, 80vw); margin: 0 auto 26px; }
  .dial {
    position: relative;
    width: 100%; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a463e, #26231e 70%);
    border: 6px solid #3a362f;
    box-shadow: 0 20px 40px rgba(0,0,0,.6), inset 0 4px 10px rgba(255,255,255,.12), inset 0 -8px 18px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .tick { position: absolute; left: 50%; top: 8px; width: 2px; height: 14px; background: #8f8472; transform-origin: 1px 118px; }
  .needle {
    position: absolute; left: 50%; top: 50%;
    width: 4px; height: 88px;
    margin: -88px 0 0 -2px;
    background: linear-gradient(#f5b04c, #c97f1e);
    border-radius: 3px;
    transform-origin: 50% 88px;
    transform: rotate(0deg);
    transition: transform .3s cubic-bezier(.5,1.4,.4,1);
    box-shadow: 0 0 12px rgba(245,176,76,.7);
    pointer-events: none;
  }
  .needle::after { content: ""; position: absolute; bottom: -7px; left: -5px; width: 14px; height: 14px; border-radius: 50%; background: #f5b04c; }
  .knobcap {
    position: absolute; left: 50%; top: 50%;
    width: 74px; height: 74px; margin: -37px 0 0 -37px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #57524a, #33302a 75%);
    border: 3px solid #45413a;
    box-shadow: 0 6px 14px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.15);
    display: grid; place-items: center;
    color: #f0e6d3; font-weight: 700; font-size: .85rem;
    pointer-events: none;
  }
  .opt {
    position: absolute;
    display: grid; place-items: center;
    width: clamp(70px, 30%, 92px); height: 48px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .opt::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 999px;
    background: rgba(245,176,76,.14);
    opacity: 0; transition: opacity .18s ease;
  }
  .opt:hover::before, .opt:focus-within::before { opacity: 1; }
  .opt.selected::before { opacity: 1; background: rgba(245,176,76,.10); }
  .opt input {
    position: absolute;
    width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    clip: rect(0 0 0 0); clip-path: inset(50%);
    overflow: hidden; white-space: nowrap;
  }
  .olab { position: relative; color: #7a7060; font-size: .78rem; font-weight: 600; letter-spacing: .14em; transition: color .15s ease; }
  .opt:hover .olab { color: #f0e6d3; }
  .opt.selected .olab { color: #f5b04c; }
  .opt input:focus-visible ~ .olab { outline: 2px solid #f5b04c; outline-offset: 5px; border-radius: 999px; color: #f5b04c; }
  .opt[data-idx="0"] { top: 22px; left: 50%; transform: translate(-50%, -50%); }
  .opt[data-idx="1"] { top: 46%; right: 10px; transform: translate(50%, -50%); }
  .opt[data-idx="2"] { bottom: 22px; left: 50%; transform: translate(-50%, 50%); }
  .opt[data-idx="3"] { left: 10px; top: 46%; transform: translate(-50%, -50%); }
  .value { color: #f0e6d3; font-size: 1rem; letter-spacing: .1em; min-height: 1.4em; }
  .value b { color: #f5b04c; }
  .group { border: none; margin: 0; padding: 0; }
  .hint { margin-top: 1.4rem; color: #6f6555; font-size: .8rem; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #3a362f; color: #6f6555; font-size: .78rem; }
  .credit a { color: #f5b04c; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Dial Knob</h1>
  <p class="sub">Turn the dial, feel the selection / Gira la perilla, siente la selección</p>
  <fieldset class="group" data-testid="group">
    <legend style="position:absolute;width:1px;height:1px;overflow:hidden;">Volume preset</legend>
    <div class="dialwrap">
      <div class="dial">
        <span class="tick" style="transform:rotate(0deg)"></span>
        <span class="tick" style="transform:rotate(60deg)"></span>
        <span class="tick" style="transform:rotate(120deg)"></span>
        <span class="tick" style="transform:rotate(180deg)"></span>
        <span class="tick" style="transform:rotate(240deg)"></span>
        <span class="tick" style="transform:rotate(300deg)"></span>
        <div class="needle" id="needle"></div>
        <div class="knobcap" id="knobcap">LOW</div>
      </div>
      <label class="opt" data-idx="0" for="rk0">
        <input type="radio" name="preset" id="rk0" value="low" checked
        <span class="olab">LOW</span>
      </label>
      <label class="opt" data-idx="1" for="rk1">
        <input type="radio" name="preset" id="rk1" value="medium"
        <span class="olab">MED</span>
      </label>
      <label class="opt" data-idx="2" for="rk2">
        <input type="radio" name="preset" id="rk2" value="high"
        <span class="olab">HI</span>
      </label>
      <label class="opt" data-idx="3" for="rk3">
        <input type="radio" name="preset" id="rk3" value="max"
        <span class="olab">MAX</span>
      </label>
    </div>
    <p class="value" aria-live="polite">selected: <b id="val">LOW</b></p>
  </fieldset>
  <p class="hint">Click a label around the dial, or tab + arrow keys — / Clic en una etiqueta de la perilla, o Tab + flechas</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const group = document.querySelector('[data-testid="group"]');
  const needle = document.getElementById('needle');
  const knobcap = document.getElementById('knobcap');
  const val = document.getElementById('val');
  const NAMES = ['LOW', 'MED', 'HI', 'MAX'];
  const ANGLES = [0, 60, 120, 180];
  const opts = Array.from(group.querySelectorAll('.opt'));
  function refresh() {
    const checked = group.querySelector('input:checked');
    const idx = Number(checked.closest('.opt').dataset.idx);
    needle.style.transform = 'rotate(' + ANGLES[idx] + 'deg)';
    knobcap.textContent = NAMES[idx];
    val.textContent = NAMES[idx];
    opts.forEach((o) => o.classList.toggle('selected', o === checked.closest('.opt')));
  }
  group.addEventListener('change', (e) => {
    if (e.target.type === 'radio') refresh();
  });
  refresh();
</script>
</body>
</html>
