<!-- Design 09: Mono Brackets / Corchetes Monospace -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mono Brackets Radio — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
    background: #0b0e0c;
    color: #9cefb5;
    overflow-x: hidden;
  }
  .stage {
    width: min(620px, 94vw);
    padding: clamp(24px, 6vw, 56px);
    background: #101510;
    border: 1px solid #24402c;
    box-shadow: 0 0 60px rgba(80,255,140,.05);
    overflow: hidden;
  }
  .termbar {
    display: flex; justify-content: space-between;
    padding: 8px 12px; margin: -24px -56px 0 0;
    background: #0a0d0a; border-bottom: 1px solid #24402c;
    font-size: .75rem; color: #5f9c73;
  }
  .termbar b { color: #9cefb5; }
  h1 { margin: 1.4rem 0 .2rem; font-size: clamp(1.2rem, 3.5vw, 1.7rem); color: #9cefb5; letter-spacing: .12em; text-transform: uppercase; }
  .sub { margin: 0 0 1.8rem; font-size: .8rem; color: #679b78; }
  .group { border: none; margin: 0; padding: 0; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  .opt {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 14px;
    margin-bottom: 10px;
    border: 1px solid #1e3326;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: #356247; background: #151d16; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .mark { flex: 0 0 auto; width: 3.4em; color: #5f9c73; }
  .opt.selected .mark { color: #9cefb5; text-shadow: 0 0 8px rgba(156,239,181,.7); }
  .opt input:focus-visible ~ .mark { outline: 1px solid #9cefb5; outline-offset: 4px; }
  .opt .txt { color: #bfd6c6; font-size: .9rem; }
  .opt .txt::after { content: "()"; color: #5f9c73; margin-left: 6px; }
  .opt.selected .txt::after { color: #356247; }
  .readout {
    margin-top: 16px; padding: 10px 14px;
    background: #0a0d0a; border: 1px solid #1e3326;
    font-size: .78rem; color: #5f9c73;
  }
  .readout b { color: #9cefb5; }
  .hint { margin-top: 1.4rem; font-size: .75rem; color: #4c7a5d; }
  .hint .p { color: #9cefb5; }
  .credit { margin-top: 2rem; padding-top: .9rem; border-top: 1px dashed #1e3326; font-size: .74rem; color: #4c7a5d; }
  .credit a { color: #9cefb5; text-decoration: none; }
  .blink { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <div class="termbar"><span><b>▲</b> select.sh</span><span>bash</span></div>
  <h1>Mono Brackets</h1>
  <p class="sub">choose( ) — exactly one / elige( ) — exactamente uno</p>
  <fieldset class="group" data-testid="group">
    <legend>Environment</legend>
    <label class="opt" data-idx="0">
      <input type="radio" name="env" value="dev" checked
      <span class="mark" aria-hidden="true">[o]</span>
      <span class="txt">dev</span>
    </label>
    <label class="opt" data-idx="1">
      <input type="radio" name="env" value="staging"
      <span class="mark" aria-hidden="true">[ ]</span>
      <span class="txt">staging</span>
    </label>
    <label class="opt" data-idx="2">
      <input type="radio" name="env" value="prod"
      <span class="mark" aria-hidden="true">[ ]</span>
      <span class="txt">prod</span>
    </label>
  </fieldset>
  <p class="readout" aria-live="polite">$ export ENV=<b id="val">dev</b><span class="blink">_</span></p>
  <p class="hint"><span class="p">$</span> click to select one — / clic para seleccionar uno</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const group = document.querySelector('[data-testid="group"]');
  const val = document.getElementById('val');
  function refresh() {
    const checked = group.querySelector('input:checked');
    val.textContent = checked.value;
    group.querySelectorAll('.opt').forEach((opt) => {
      const on = opt.querySelector('input').checked;
      opt.classList.toggle('selected', on);
      opt.querySelector('.mark').textContent = on ? '[o]' : '[ ]';
    });
  }
  group.addEventListener('change', (e) => {
    if (e.target.type === 'radio') refresh();
  });
  refresh();
</script>
</body>
</html>
