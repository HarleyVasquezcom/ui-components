<!-- Design 02: Pill Group / Grupo de Píldoras -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill Group Radio — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0f172a;
    overflow-x: hidden;
  }
  .stage {
    width: min(640px, 94vw);
    padding: clamp(28px, 6vw, 60px);
    background: linear-gradient(160deg, #1e293b, #111a2e);
    border-radius: 24px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #e2e8f0; font-weight: 700; }
  .sub { margin: .4rem 0 2.4rem; color: #7c8ba1; font-size: .92rem; }
  .group { border: none; margin: 0; padding: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .pills {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr));
    gap: 10px;
  }
  .opt {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 12px;
    background: #1e293b;
    border: 1px solid #2e3d55;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .opt:hover { border-color: #4b5f7d; transform: translateY(-1px); }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opt .txt { color: #aab7cb; font-size: .92rem; font-weight: 600; }
  .opt.selected { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-color: transparent; box-shadow: 0 8px 24px rgba(99,102,241,.45); }
  .opt.selected .txt { color: #fff; }
  .opt.selected .tick { opacity: 1; transform: scale(1); }
  .opt .tick { width: 16px; height: 16px; opacity: 0; transform: scale(.4); transition: all .2s cubic-bezier(.5,1.6,.4,1); }
  .opt .tick svg { width: 100%; height: 100%; stroke: #fff; stroke-width: 3.5; fill: none; }
  .opt input:focus-visible ~ .txt { outline: 2px solid #a5b4fc; outline-offset: 5px; border-radius: 999px; }
  .hint { margin-top: 2.2rem; color: #5c6a80; font-size: .82rem; }
  .credit { margin-top: 2.4rem; padding-top: 1rem; border-top: 1px solid #26344a; color: #5c6a80; font-size: .8rem; }
  .credit a { color: #a5b4fc; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Pill Group</h1>
  <p class="sub">A segmented choice, one pill at a time / Una elección segmentada, una píldora a la vez</p>
  <fieldset class="group" data-testid="group">
    <legend class="sr-only">Plan</legend>
    <div class="pills">
      <label class="opt" data-idx="0">
        <input type="radio" name="plan" value="free" checked
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
        <span class="txt">Free</span>
      </label>
      <label class="opt" data-idx="1">
        <input type="radio" name="plan" value="pro"
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
        <span class="txt">Pro</span>
      </label>
      <label class="opt" data-idx="2">
        <input type="radio" name="plan" value="team"
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
        <span class="txt">Team</span>
      </label>
    </div>
  </fieldset>
  <p class="hint">Click a pill to choose — / Clic en una píldora para elegir</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const group = document.querySelector('[data-testid="group"]');
  group.addEventListener('change', (e) => {
    if (e.target.type !== 'radio') return;
    group.querySelectorAll('.opt').forEach((opt) => opt.classList.remove('selected'));
    e.target.closest('.opt').classList.add('selected');
  });
</script>
</body>
</html>
