<!-- Design 04: Bottom Navigation con Tarjetas Flotantes / Floating Cards Bottom Nav -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom Nav — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fff;
    color: #1e293b;
    overflow-x: hidden;
  }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    padding: 10px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #64748b;
    font-size: .7rem;
    cursor: pointer;
    transition: color .2s, transform .1s;
  }
  .nav-item.active { color: #1e293b; transform: scale(1.1); }
  .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }
  .nav-item span { font-size: .65rem; }
  .section {
    min-height: calc(100vh - 70px);
    padding: 32px 24px;
    max-width: 100%;
    position: relative;
    top: 0;
  }
  .section h1 { margin: 0 0 16px; font-size: 1.75rem; color: #1e293b; }
  .section p { color: #64748b; line-height: 1.6; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .75rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .bottom-nav { padding: 6px; } }
</style>
</head>
<body>
<nav class="bottom-nav" aria-label="Navegación inferior" data-bottom-nav data-testid="bottom-nav">
  <div class="nav-item active" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="11" x2="21" y2="11"/><polygon points="7 2 12 7 17 2"/></svg><span>Inicio</span></div>
  <div class="nav-item" data-tab="crear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Crear</span></div>
  <div class="nav-item" data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg><span>Perfil</span></div>
  <div class="nav-item" data-tab="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><line x1="44" y1="1" x2="44" y2="23"/></svg><span>Configuración</span></div>
</nav>
<section class="section" id="inicio">
  <h1 id="inicio-title">Inicio</h1>
  <p>Contenido principal de la aplicación.</p>
</section>
<section class="section" id="crear" style="display:none;">
  <h1 id="crear-title">Crear</h1>
  <p>Crea nuevo contenido, proyectos o recursos.</p>
</section>
<section class="section" id="perfil" style="display:none;">
  <h1 id="perfil-title">Perfil</h1>
  <p>Tu información y configuraciones de usuario.</p>
</section>
<section class="section" id="config" style="display:none;">
  <h1 id="config-title">Configuración</h1>
  <p>Ajustes y preferencias de la aplicación.</p>
</section>
<script>
  (() => {
    const items = document.querySelectorAll('.nav-item');
    const sections = document.querySelectorAll('.section');
    items.forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.dataset.tab;
        items.forEach(i => { i.classList.remove('active'); i.style.transform = 'scale(1)'; });
        item.classList.add('active');
        item.style.transform = 'scale(1.1)';
        sections.forEach(s => s.style.display = 'none');
        document.getElementById(tab).style.display = 'block';
      });
    });
  })();
</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
