<!-- Design 09: Bottom Navigation con Badge de Cuentas / Account Badge Bottom Nav -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom Nav — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #e2e8f0;
    color: #334155;
    overflow-x: hidden;
  }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 2px solid #3b82f6;
    padding: 10px 12px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #64748b;
    font-size: .7rem;
    cursor: pointer;
    transition: color .2s;
    position: relative;
  }
  .nav-item.unread::after {
    content: '';
    position: absolute;
    top: 2px; right: 2px;
    width: 8px; height: 8px;
    background: #ef4444;
    border-radius: 50%;
    border: 2px solid #fff;
  }
  .nav-item.active { color: #3b82f6; }
  .nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; }
  .nav-item span { font-size: .65rem; }
  .section { min-height: calc(100vh - 70px); padding: 32px; max-width: 100%; }
  .section h1 { margin: 0 0 16px; font-size: 1.75rem; color: #1e293b; }
  .section p { color: #64748b; line-height: 1.6; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .75rem; text-align: center; }
  .credit a { color: #3b82f6; text-decoration: none; }
  @media (max-width: 480px) { .bottom-nav { padding: 6px 4px; } }
</style>
</head>
<body>
<nav class="bottom-nav" aria-label="Navegación inferior" data-bottom-nav data-testid="bottom-nav">
  <div class="nav-item unread active" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="11" x2="21" y2="11"/><polygon points="7 2 12 7 17 2"/></svg><span>Inicio</span></div>
  <div class="nav-item unread" data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg><span>Perfil</span></div>
  <div class="nav-item unread" data-tab="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><line x1="44" y1="1" x2="44" y2="23"/></svg><span>Configuración</span></div>
  <div class="nav-item unread" data-tab="ayuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="16"/></svg><span>Ayuda</span></div>
</nav>
<section class="section" id="inicio">
  <h1 id="inicio-title">Inicio</h1>
  <p>Contenido principal con notificaciones no leídas.</p>
</section>
<section class="section" id="perfil" style="display:none;">
  <h1 id="perfil-title">Perfil</h1>
  <p>Tu información de perfil y configuraciones.</p>
</section>
<section class="section" id="config" style="display:none;">
  <h1 id="config-title">Configuración</h1>
  <p>Ajustes y preferencias de la aplicación.</p>
</section>
<section class="section" id="ayuda" style="display:none;">
  <h1 id="ayuda-title">Ayuda</h1>
  <p>Soporte y recursos de ayuda.</p>
</section>
<script>
  (() => {
    const items = document.querySelectorAll('.nav-item');
    const sections = document.querySelectorAll('.section');
    items.forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.dataset.tab;
        items.forEach(i => { i.classList.remove('active'); i.classList.remove('unread'); });
        item.classList.add('active');
        sections.forEach(s => s.style.display = 'none');
        document.getElementById(tab).style.display = 'block';
      });
    });
  })();
</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
