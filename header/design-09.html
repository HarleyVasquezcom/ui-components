<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Header — Design 09</title>
<style>
  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#f8fafc;overflow-x:hidden}.header{max-width:1200px;width:100%;padding:20px 24px;background:#fff;border-bottom:1px solid #e2e8f0;position:fixed;top:0;left:0:right:0;z-index:100}.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}.logo{font-size:1.5rem;font-weight:700;color:#0f172a;text-decoration:none}.avatar{width:40px;height:40px;border-radius:50%;background:#e2e8f0;margin-left:16px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#64748b}.nav{display:flex;gap=16px}.nav-link{color:#64748b;font-size=.875rem;font-weight:500;text-decoration:none;transition:.2s}.nav-link:hover{color:#0f172a}.credit{margin-top:24px;padding:12px 0;border-top:1px solid #e2e8f0;color:#64748b;font-size:.75rem}.credit a{color:#2563eb;text-decoration:none}</style>
</head>
