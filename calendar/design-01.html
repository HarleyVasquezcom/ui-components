<!-- Design 01: Calendar Grid / Calendar Grid -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    overflow-x: hidden;
  }
  .calendar { width: min(90vw, 400px); margin: 20px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
  .calendar-title { font-size: 1rem; font-weight: 600; color: #1e293b; }
  .calendar-nav button { width: 32px; height: 32px; background: #e2e8f0; border: none; border-radius: 6px; color: #64748b; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .calendar-nav button:hover { background: #cbd5e1; }
  .calendar-nav button:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
  .calendar-grid .day { padding: 8px; border-radius: 6px; text-align: center; font-size: .75rem; cursor: pointer; transition: background .2s; }
  .calendar-grid .day:hover:not(.disabled):not(.current) { background: #f1f5f9; }
  .calendar-grid .day.current { background: #3b82f6; color: #fff; }
  .calendar-grid .day.disabled { color: #94a3b8; pointer-events: none; }
  .calendar-grid .day.weekend { color: #ef4444; }
  .calendar-grid .day.other-month { color: #e2e8f0; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .calendar { margin: 10px; padding: 12px; } }
</style>
</head>
<body>
<div class="calendar" data-testid="calendar" aria-label="Calendar design" data-calendar>
  <div class="calendar-header">
    <span class="calendar-title">January 2024</span>
    <div class="calendar-nav"><button data-nav-prev aria-label="Mes anterior">&lsaquo;</button><button data-nav-next data-next aria-label="Mes siguiente"> data-testid="next" data-next&rsaquo;</button></div>
  </div>
  <div class="calendar-grid">
    <div class="day weekend other-month" data-testid="month">Sun</div><div class="day other-month" data-testid="month">Mon</div><div class="day other-month" data-testid="month">Tue</div><div class="day other-month" data-testid="month">Wed</div><div class="day other-month" data-testid="month">Thu</div><div class="day other-month" data-testid="month">Fri</div><div class="day current">Sat</div>
    <div class="day current">1</div><div class="day current">2</div><div class="day current">3</div><div class="day current">4</div><div class="day current">5</div><div class="day current">6</div><div class="day current">7</div>
    <div class="day current">8</div><div class="day current">9</div><div class="day current">10</div><div class="day current">11</div><div class="day current">12</div><div class="day current">13</div><div class="day current">14</div>
    <div class="day current">15</div><div class="day current">16</div><div class="day current">17</div><div class="day current">18</div><div class="day current">19</div><div class="day current">20</div><div class="day current">21</div>
    <div class="day current">22</div><div class="day current">23</div><div class="day current">24</div><div class="day current">25</div><div class="day current">26</div><div class="day current">27</div><div class="day current">28</div>
    <div class="day other-month" data-testid="month">Sun</div>
  </div>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
