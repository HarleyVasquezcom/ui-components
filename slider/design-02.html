<!-- Design 02: Filled Track / Pista Rellena -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filled Track Slider — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #052e16;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #f0fdf4; border-radius: 20px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #14532d; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #65a30d; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 26px; color: #14532d; font-size: .92rem; font-weight: 700; }
  .sl {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 14px;
    border: none;
    border-radius: 7px;
    background: linear-gradient(#22c55e, #16a34a) 0 / var(--p, 0%) 100% no-repeat #dcfce7;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12);
    outline: none;
    cursor: pointer;
  }
  .sl::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px; height: 28px;
    border: 4px solid #f0fdf4; border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 2px 8px rgba(21, 128, 61, .5);
  }
  .sl:hover::-webkit-slider-thumb { background: #15803d; }
  .sl:focus-visible { outline: 3px solid #16a34a; outline-offset: 6px; }
  .out { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; color: #65a30d; font-size: .88rem; }
  .out b { color: #14532d; font-size: 1.2rem; }
  .hint { margin-top: 2rem; color: #84cc16; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #bbf7d0; color: #84cc16; font-size: .78rem; }
  .credit a { color: #15803d; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Filled Track</h1>
  <p class="sub">A generous green path / Un camino verde generoso</p>
  <label class="lbl" data-testid="label" id="lbl-sl02" for="sl02">Brightness</label>
  <input id="sl02" class="sl" data-testid="slider" type="range" min="0" max="100" step="5" value="30">
  <p class="out"><span>Level</span> <b data-testid="value" aria-live="polite">30</b></p>
  <p class="hint">Thick track, unmistakable / Pista gruesa, inconfundible</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const sl = document.querySelector('[data-testid="slider"]');
  const val = document.querySelector('[data-testid="value"]');
  function sync() {
    val.textContent = String(sl.value);
    sl.style.setProperty('--p', ((Number(sl.value) - Number(sl.min)) / (Number(sl.max) - Number(sl.min))) * 100 + '%');
  }
  sl.addEventListener('input', sync);
  sync();
</script>
</body>
</html>
