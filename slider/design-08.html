<!-- Design 08: Bubble Value / Valor Burbuja -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Value Slider — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #164e63;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(40px, 7vw, 58px) clamp(34px, 7vw, 54px);
    background: #ecfeff; border-radius: 26px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .45);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #155e75; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #0891b2; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 30px; color: #155e75; font-size: .92rem; font-weight: 700; }
  .track-wrap { position: relative; padding: 34px 0 12px; }
  .bubble {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    left: var(--p, 0%);
    padding: 6px 12px;
    background: #0e7490; color: #ecfeff;
    font-size: .95rem; font-weight: 700; border-radius: 14px;
    pointer-events: none;
    white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px;
    transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #0e7490; border-bottom: none;
  }
  .sl {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border: none; border-radius: 4px;
    background: linear-gradient(#22d3ee, #22d3ee) 0 / var(--p, 0%) 100% no-repeat #cffafe;
    box-shadow: inset 0 1px 2px rgba(8, 51, 68, .25);
    outline: none;
    cursor: pointer;
  }
  .sl::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    border: 4px solid #ecfeff; border-radius: 50%;
    background: #0e7490;
    box-shadow: 0 2px 8px rgba(14, 116, 144, .5);
  }
  .sl:hover::-webkit-slider-thumb { background: #155e75; }
  .sl:focus-visible { outline: 3px solid #0e7490; outline-offset: 6px; }
  .out { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; color: #0891b2; font-size: .88rem; }
  .out b { color: #155e75; font-size: 1.05rem; }
  .hint { margin-top: 2rem; color: #22d3ee; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #a5f3fc; color: #22d3ee; font-size: .78rem; }
  .credit a { color: #0e7490; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Bubble Value</h1>
  <p class="sub">Your number, floating above / Tu número, flotando encima</p>
  <label class="lbl" data-testid="label" id="lbl-sl08" for="sl08">Zoom</label>
  <div class="track-wrap">
    <div class="bubble" aria-hidden="true">30</div>
    <input id="sl08" class="sl" data-testid="slider" type="range" min="0" max="100" step="5" value="30">
  </div>
  <p class="out"><span>Level</span> <b data-testid="value" aria-live="polite">30</b></p>
  <p class="hint">Cyan waters, deep teal / Aguas cian, teal profundo</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const sl = document.querySelector('[data-testid="slider"]');
  const val = document.querySelector('[data-testid="value"]');
  const bubble = document.querySelector('.bubble');
  function sync() {
    const p = ((Number(sl.value) - Number(sl.min)) / (Number(sl.max) - Number(sl.min))) * 100;
    val.textContent = String(sl.value);
    bubble.textContent = String(sl.value);
    sl.style.setProperty('--p', p + '%');
    bubble.style.setProperty('--p', p + '%');
  }
  sl.addEventListener('input', sync);
  sync();
</script>
</body>
</html>
