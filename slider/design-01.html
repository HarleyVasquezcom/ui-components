<!-- Design 01: Classic Range / Range Clásico -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Range Slider — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b1c2e;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #ffffff; border-radius: 20px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #0c4a6e; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #64748b; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 26px; color: #0c4a6e; font-size: .92rem; font-weight: 700; }
  .sl {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border: none;
    border-radius: 4px;
    background: linear-gradient(#38bdf8, #38bdf8) 0 / var(--p, 0%) 100% no-repeat #e2e8f0;
    outline: none;
    cursor: pointer;
  }
  .sl::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    border: none; border-radius: 50%;
    background: #0ea5e9;
    box-shadow: 0 2px 8px rgba(2, 132, 199, .45);
  }
  .sl:hover::-webkit-slider-thumb { background: #0284c7; }
  .sl:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 6px; }
  .out { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; color: #64748b; font-size: .88rem; }
  .out b { color: #0c4a6e; font-size: 1.05rem; }
  .hint { margin-top: 2rem; color: #94a3b8; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #0284c7; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Classic Range</h1>
  <p class="sub">Straightforward, familiar / Sencillo, familiar</p>
  <label class="lbl" data-testid="label" id="lbl-sl01" for="sl01">Volume</label>
  <input id="sl01" class="sl" data-testid="slider" type="range" min="0" max="100" step="5" value="30">
  <p class="out"><span>Level</span> <b data-testid="value" aria-live="polite">30</b></p>
  <p class="hint">The dependable original / El original de confianza</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const sl = document.querySelector('[data-testid="slider"]');
  const val = document.querySelector('[data-testid="value"]');
  function sync() {
    val.textContent = String(sl.value);
    sl.style.setProperty('--p', ((Number(sl.value) - Number(sl.min)) / (Number(sl.max) - Number(sl.min))) * 100 + '%');
  }
  sl.addEventListener('input', sync);
  sync();
</script>
</body>
</html>
