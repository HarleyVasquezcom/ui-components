<!-- Design 09: Dark Track / Pista Oscura -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Track Slider — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Consolas", "Courier New", monospace;
    background: #030603;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(28px, 5vw, 46px);
    background: #0a0f0a; border: 1px solid #122112; border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    overflow: hidden;
  }
  .termbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; margin: -24px -56px 0 0;
    background: #111; border-bottom: 1px solid #33ff66;
    font-size: .75rem; color: #6b7280;
  }
  h1 { margin: 1.4rem 0 .2rem; font-size: clamp(1.4rem, 4.5vw, 1.9rem); color: #33ff66; font-weight: 700; }
  .sub { margin: .3rem 0 2.4rem; color: #4b5563; font-size: .9rem; }
  .lbl { display: block; margin: 0 0 30px; color: #a3b3c2; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .sl {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border: none; border-radius: 3px;
    background: linear-gradient(#33ff66, #33ff66) 0 / var(--p, 0%) 100% no-repeat #122112;
    outline: none;
    cursor: pointer;
  }
  .sl::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border: none; border-radius: 2px;
    background: #33ff66;
    box-shadow: 0 0 10px rgba(51, 255, 102, .5);
  }
  .sl:hover::-webkit-slider-thumb { background: #5cff8a; }
  .sl:focus-visible { outline: 2px solid #33ff66; outline-offset: 6px; }
  .out { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; color: #4b5563; font-size: .86rem; }
  .out b { color: #33ff66; font-size: 1.2rem; }
  .hint { margin-top: 2rem; color: #1f3d1f; font-size: .8rem; }
  .credit { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px solid #161e16; color: #4b5563; font-size: .76rem; }
  .credit a { color: #33ff66; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <div class="termbar" aria-hidden="true">
    <span><b>bash</b> — ui-kit v1.0</span>
    <span>● ● ●</span>
  </div>
  <h1>Dark Track</h1>
  <p class="sub">$ slider --dark / $ deslizador --oscuro</p>
  <label class="lbl" data-testid="label" id="lbl-sl09" for="sl09">Volume</label>
  <input id="sl09" class="sl" data-testid="slider" type="range" min="0" max="100" step="5" value="30">
  <p class="out"><span>$ level:</span> <b data-testid="value" aria-live="polite">30</b></p>
  <p class="hint">Glow in the dark room / Brillo en la sala oscura</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const sl = document.querySelector('[data-testid="slider"]');
  const val = document.querySelector('[data-testid="value"]');
  function sync() {
    val.textContent = String(sl.value);
    sl.style.setProperty('--p', ((Number(sl.value) - Number(sl.min)) / (Number(sl.max) - Number(sl.min))) * 100 + '%');
  }
  sl.addEventListener('input', sync);
  sync();
</script>
</body>
</html>
