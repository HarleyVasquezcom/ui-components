<!-- Design 06: Table Mono / Mono Table -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Menlo", "Monaco", "Courier New", monospace;
    background: #1e293b;
    color: #fff;
    overflow-x: hidden;
  }
  table { width: min(90vw, 100%); border-collapse: collapse; margin: 20px auto; }
  th, td { padding: 8px 4px; border: 1px solid #334155; font-size: .7rem; color: #fff; }
  th { background: #0f172a; color: #fff; font-weight: 600; text-align: left; }
  td { background: #1e293b; }
  tr:hover td { background: #0f172a; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .pagination { display: flex; justify-content: center; gap: 4px; margin: 24px 0; }
  .page-btn { padding: 4px 8px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; font-size: .65rem; cursor: pointer; }
  .page-btn:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #334155; color: #64748b; font-size: .75rem; text-align: center; }
  .credit a { color: #64748b; text-decoration: none; }
  @media (max-width: 480px) { th, td { padding: 4px; } }
</style>
</head>
<body>
<table data-testid="table" aria-label="Sample data table">
  <thead>
    <tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Precio</th></tr>
  </thead>
  <tbody>
    <tr><td>001</td><td>Diseño Gráfico Moderno</td><td>Visual</td><td>$49</td></tr>
    <tr><td>002</td><td>Desarrollo Web Completo</td><td>Web</td><td>$79</td></tr>
    <tr><td>003</td><td>Fotografía de Autor</td><td>Photo</td><td>$29</td></tr>
    <tr><td>004</td><td>Marketing Digital</td><td>Marketing</td><td>$199</td></tr>
    <tr><td>005</td><td>Branding Personal</td><td>Brand</td><td>$99</td></tr>
  </tbody>
</table>
<div class="pagination">
  <button class="page-btn" data-page="1">1</button>
  <button class="page-btn active" data-page="2">2</button>
  <button class="page-btn" data-page="3">3</button>
</div>
<script>
  (() => {
    const buttons = document.querySelectorAll('.page-btn');
    buttons.forEach(l => {
      l.addEventListener('click', (e) => {
        buttons.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
      });
    });
  })();
</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
