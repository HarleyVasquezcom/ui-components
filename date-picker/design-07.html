<!-- Design 07: Rounded Modern / Moderno Redondeado -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rounded Modern Date Picker — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fff1f2;
    overflow-x: hidden;
  }
  .stage {
    width: min(430px, 94vw);
    padding: clamp(32px, 8vw, 60px);
    background: #fff;
    border-radius: 26px;
    box-shadow: 0 26px 64px rgba(159, 18, 57, .14);
  }
  h1 { margin: 0; font-size: clamp(1.55rem, 5vw, 2.1rem); color: #3f121f; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.4rem; color: #f0a7b8; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 10px; color: #5d2233; font-size: .9rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 15px 20px;
    font-family: inherit; font-size: 1.04rem; font-weight: 800; color: #3f121f;
    background: #fff;
    border: 2px solid #fecdd3;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(244, 114, 182, .18);
    transition: border-color .15s ease, transform .15s ease;
  }
  .trg:hover { border-color: #f472b6; transform: translateY(-1px); }
  .trg[aria-expanded="true"] { border-color: #e11d48; }
  .trg:focus-visible { outline: 3px solid #e11d48; outline-offset: 3px; }
  .trg .arr { color: #e11d48; font-size: .9rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .cal {
    position: absolute; left: 0; right: 0; top: calc(100% + 12px);
    background: #fff;
    border: 2px solid #ffe4e6;
    border-radius: 22px;
    box-shadow: 0 20px 44px rgba(159, 18, 57, .18);
    padding: 16px;
    z-index: 5;
  }
  [hidden] { display: none !important; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .cal-head b { font-size: .95rem; font-weight: 800; color: #3f121f; }
  .cal-head button {
    width: 32px; height: 32px;
    font-size: 1.05rem; color: #be185d;
    background: #fff1f2;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: background .12s ease;
  }
  .cal-head button:hover { background: #ffe4e6; }
  .cal-head button:focus-visible { outline: 2px solid #e11d48; outline-offset: 2px; }
  .wds { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .wds span { text-align: center; font-size: .64rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #f0a7b8; padding: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .grid .ghost { padding: 8px 0; }
  .day {
    padding: 8px 0;
    font-family: inherit; font-size: .86rem; font-weight: 700; color: #5d2233;
    background: transparent;
    border: 2px solid transparent;
    border-radius: 50%;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .day:hover { background: #fff1f2; color: #be185d; }
  .day.is-today { border-color: #fda4af; color: #be185d; }
  .day.selected { background: #e11d48; color: #fff; border-color: #e11d48; }
  .day:focus-visible { outline: 2px solid #e11d48; outline-offset: 2px; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
  .selout span { color: #f0a7b8; font-size: .86rem; }
  .selout b { color: #3f121f; font-weight: 800; }
  .hint { margin-top: 2rem; color: #fecdd3; font-size: .8rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 2px solid #ffe4e6; color: #f0a7b8; font-size: .76rem; }
  .credit a { color: #e11d48; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Rounded Modern</h1>
  <p class="sub">Soft circles, rose mood / Círculos suaves, ánimo rosado</p>
  <label class="lbl" data-testid="label" id="lbl-dp07">Date</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal07" aria-labelledby="lbl-dp07">
      <span data-testid="cur">17</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="cal" id="cal07" data-testid="cal" role="dialog" aria-label="Pick a date" hidden>
      <div class="cal-head">
        <button type="button" data-testid="prev-m" aria-label="Previous month">‹</button>
        <b data-testid="month-label">August 2026</b>
        <button type="button" data-testid="next-m" aria-label="Next month">›</button>
      </div>
      <div class="wds" aria-hidden="true">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="grid" data-testid="grid"></div>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="date-out" aria-live="polite">Aug 17, 2026</b></p>
  <p class="hint">Friendly like a greeting / Amable como un saludo</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const today = new Date();
  const trigger = document.querySelector('[data-testid="trigger"]');
  const cal = document.querySelector('[data-testid="cal"]');
  const cur = document.querySelector('[data-testid="cur"]');
  const monthLabel = document.querySelector('[data-testid="month-label"]');
  const grid = document.querySelector('[data-testid="grid"]');
  const dateOut = document.querySelector('[data-testid="date-out"]');
  const nextM = document.querySelector('[data-testid="next-m"]');
  const prevM = document.querySelector('[data-testid="prev-m"]');
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let sel = today;
  const p = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const fmt = (d) => d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  const ym = (d) => d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  cur.textContent = String(today.getDate());
  dateOut.textContent = fmt(today);
  function open() { cal.hidden = false; trigger.setAttribute('aria-expanded', 'true'); render(); }
  function close() { cal.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
  function render() {
    monthLabel.textContent = ym(view);
    grid.innerHTML = '';
    const startPad = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
    const dim = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) {
      const g = document.createElement('span'); g.className = 'ghost'; grid.appendChild(g);
    }
    for (let d = 1; d <= dim; d++) {
      const day = new Date(view.getFullYear(), view.getMonth(), d);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day'; b.dataset.date = iso(day); b.textContent = String(d);
      b.setAttribute('aria-label', fmt(day));
      if (iso(day) === iso(today)) b.classList.add('is-today');
      if (iso(day) === iso(sel)) b.classList.add('selected');
      b.addEventListener('click', () => { sel = day; dateOut.textContent = fmt(day); close(); render(); });
      grid.appendChild(b);
    }
  }
  trigger.addEventListener('click', () => (cal.hidden ? open() : close()));
  nextM.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); });
  prevM.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
</script>
</body>
</html>
