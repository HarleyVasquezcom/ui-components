<!-- Design 05: Compact Popover / Popover Compacto -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compact Popover Date Picker — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fefce8;
    overflow-x: hidden;
  }
  .stage {
    width: min(380px, 94vw);
    padding: clamp(32px, 8vw, 56px);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 18px 44px rgba(120, 113, 108, .12);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); color: #292524; font-weight: 800; letter-spacing: -.01em; }
  .sub { margin: .4rem 0 2.2rem; color: #a8a29e; font-size: .92rem; }
  .lbl { display: block; margin: 0 0 8px; color: #57534e; font-size: .86rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 14px;
    font-family: inherit; font-size: .98rem; font-weight: 700; color: #292524;
    background: #fafaf9;
    border: 1px solid #e7e5e4;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .trg:hover { border-color: #d6d3d1; }
  .trg[aria-expanded="true"] { border-color: #d97706; }
  .trg:focus-visible { outline: 3px solid #d97706; outline-offset: 2px; }
  .trg .arr { color: #d97706; font-size: .85rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .cal {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px);
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 10px;
    box-shadow: 0 16px 36px rgba(120, 113, 108, .18);
    padding: 10px;
    z-index: 5;
  }
  [hidden] { display: none !important; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
  .cal-head b { font-size: .84rem; font-weight: 800; color: #292524; }
  .cal-head button {
    width: 26px; height: 26px;
    font-size: .9rem; color: #78716c;
    background: #fafaf9;
    border: 1px solid #e7e5e4;
    border-radius: 7px;
    cursor: pointer;
  }
  .cal-head button:hover { background: #fffbeb; color: #d97706; border-color: #fcd34d; }
  .cal-head button:focus-visible { outline: 2px solid #d97706; outline-offset: 1px; }
  .wds { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 3px; }
  .wds span { text-align: center; font-size: .6rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #a8a29e; padding: 3px 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .grid .ghost { padding: 6px 0; }
  .day {
    padding: 6px 0;
    font-family: inherit; font-size: .8rem; font-weight: 600; color: #57534e;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    cursor: pointer;
    transition: background .1s ease, color .1s ease;
  }
  .day:hover { background: #fffbeb; color: #92400e; }
  .day.is-today { border-color: #fcd34d; color: #92400e; }
  .day.selected { background: #d97706; color: #fff; border-color: #d97706; }
  .day:focus-visible { outline: 2px solid #d97706; outline-offset: 1px; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .selout span { color: #a8a29e; font-size: .85rem; }
  .selout b { color: #292524; font-weight: 800; }
  .hint { margin-top: 2rem; color: #e7e5e4; font-size: .8rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #e7e5e4; color: #a8a29e; font-size: .76rem; }
  .credit a { color: #d97706; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Compact Popover</h1>
  <p class="sub">Small footprint, quick pick / Huella pequeña, elección rápida</p>
  <label class="lbl" data-testid="label" id="lbl-dp05">Date</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal05" aria-labelledby="lbl-dp05">
      <span data-testid="cur">17</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="cal" id="cal05" data-testid="cal" role="dialog" aria-label="Pick a date" hidden>
      <div class="cal-head">
        <button type="button" data-testid="prev-m" aria-label="Previous month">‹</button>
        <b data-testid="month-label">August 2026</b>
        <button type="button" data-testid="next-m" aria-label="Next month">›</button>
      </div>
      <div class="wds" aria-hidden="true">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="grid" data-testid="grid"></div>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="date-out" aria-live="polite">Aug 17, 2026</b></p>
  <p class="hint">Dense but gentle / Densos pero amables</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const today = new Date();
  const trigger = document.querySelector('[data-testid="trigger"]');
  const cal = document.querySelector('[data-testid="cal"]');
  const cur = document.querySelector('[data-testid="cur"]');
  const monthLabel = document.querySelector('[data-testid="month-label"]');
  const grid = document.querySelector('[data-testid="grid"]');
  const dateOut = document.querySelector('[data-testid="date-out"]');
  const nextM = document.querySelector('[data-testid="next-m"]');
  const prevM = document.querySelector('[data-testid="prev-m"]');
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let sel = today;
  const p = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const fmt = (d) => d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  const ym = (d) => d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  cur.textContent = String(today.getDate());
  dateOut.textContent = fmt(today);
  function open() { cal.hidden = false; trigger.setAttribute('aria-expanded', 'true'); render(); }
  function close() { cal.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
  function render() {
    monthLabel.textContent = ym(view);
    grid.innerHTML = '';
    const startPad = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
    const dim = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) {
      const g = document.createElement('span'); g.className = 'ghost'; grid.appendChild(g);
    }
    for (let d = 1; d <= dim; d++) {
      const day = new Date(view.getFullYear(), view.getMonth(), d);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day'; b.dataset.date = iso(day); b.textContent = String(d);
      b.setAttribute('aria-label', fmt(day));
      if (iso(day) === iso(today)) b.classList.add('is-today');
      if (iso(day) === iso(sel)) b.classList.add('selected');
      b.addEventListener('click', () => { sel = day; dateOut.textContent = fmt(day); close(); render(); });
      grid.appendChild(b);
    }
  }
  trigger.addEventListener('click', () => (cal.hidden ? open() : close()));
  nextM.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); });
  prevM.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
</script>
</body>
</html>
