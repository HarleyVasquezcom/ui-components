<!-- Design 10: Editor Underline / Subrayado de Editor -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Underline Date Picker — Design 10</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f7fafc;
    overflow-x: hidden;
  }
  .stage {
    width: min(420px, 94vw);
    padding: clamp(32px, 8vw, 56px) clamp(8px, 4vw, 28px);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2rem); color: #1e3a5f; font-weight: 800; letter-spacing: -.01em; }
  .sub { margin: .4rem 0 2.4rem; color: #8ca3b8; font-size: .93rem; }
  .lbl { display: block; margin: 0 0 8px; color: #2c5282; font-size: .88rem; font-weight: 700; }
  .wrap { position: relative; }
  .trg {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px;
    font-family: inherit; font-size: 1.02rem; font-weight: 700; color: #1e3a5f;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-bottom: 3px solid #3182ce;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    box-shadow: 0 1px 0 #cbd5e1;
    transition: border-bottom-color .15s ease, box-shadow .15s ease;
  }
  .trg:hover { border-bottom-color: #2b6cb0; box-shadow: 0 3px 0 rgba(49, 130, 206, .15); }
  .trg[aria-expanded="true"] { border-bottom-color: #2c5282; }
  .trg:focus-visible { outline: 3px solid #3182ce; outline-offset: 3px; }
  .trg .arr { color: #3182ce; font-size: .85rem; transition: transform .2s ease; }
  .trg[aria-expanded="true"] .arr { transform: rotate(180deg); }
  .cal {
    position: absolute; left: 0; right: 0; top: calc(100% + 10px);
    background: #fff;
    border: 1px solid #e2e8f0;
    border-top: 3px solid #3182ce;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 18px 40px rgba(30, 58, 95, .12);
    padding: 14px;
    z-index: 5;
  }
  [hidden] { display: none !important; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-head b { font-size: .92rem; font-weight: 800; color: #1e3a5f; }
  .cal-head button {
    width: 30px; height: 30px;
    font-size: 1rem; color: #2c5282;
    background: #ebf4ff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .cal-head button:hover { background: #dbeafe; }
  .cal-head button:focus-visible { outline: 2px solid #3182ce; outline-offset: 1px; }
  .wds { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .wds span { text-align: center; font-size: .64rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #90a4b7; padding: 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .grid .ghost { padding: 7px 0; }
  .day {
    padding: 7px 0;
    font-family: inherit; font-size: .85rem; font-weight: 600; color: #2d3748;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    cursor: pointer;
    transition: border-color .1s ease, background .1s ease, color .1s ease;
  }
  .day:hover { background: #f0f7ff; border-bottom-color: #bee3f8; }
  .day.is-today { border-bottom-color: #63b3ed; }
  .day.selected { background: #ebf4ff; border-bottom-color: #3182ce; color: #2b6cb0; font-weight: 700; }
  .day:focus-visible { outline: 2px solid #3182ce; outline-offset: 1px; }
  .selout { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
  .selout span { color: #8ca3b8; font-size: .86rem; }
  .selout b { color: #1e3a5f; font-weight: 800; }
  .hint { margin-top: 2rem; color: #c4d4e2; font-size: .8rem; }
  .credit { margin-top: 2rem; padding-top: 1.1rem; border-top: 1px solid #e2e8f0; color: #8ca3b8; font-size: .76rem; }
  .credit a { color: #3182ce; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="stage">
  <h1>Editor Underline</h1>
  <p class="sub">Blue rules, like a well-kept editor / Reglas azules, como un editor bien cuidado</p>
  <label class="lbl" data-testid="label" id="lbl-dp10">Date</label>
  <div class="wrap">
    <button type="button" class="trg" data-testid="trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal10" aria-labelledby="lbl-dp10">
      <span data-testid="cur">17</span>
      <span class="arr" aria-hidden="true">▾</span>
    </button>
    <div class="cal" id="cal10" data-testid="cal" role="dialog" aria-label="Pick a date" hidden>
      <div class="cal-head">
        <button type="button" data-testid="prev-m" aria-label="Previous month">‹</button>
        <b data-testid="month-label">August 2026</b>
        <button type="button" data-testid="next-m" aria-label="Next month">›</button>
      </div>
      <div class="wds" aria-hidden="true">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="grid" data-testid="grid"></div>
    </div>
  </div>
  <p class="selout"><span>selected:</span> <b data-testid="date-out" aria-live="polite">Aug 17, 2026</b></p>
  <p class="hint">Structure you can lean on / Estructura en la que apoyarse</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const today = new Date();
  const trigger = document.querySelector('[data-testid="trigger"]');
  const cal = document.querySelector('[data-testid="cal"]');
  const cur = document.querySelector('[data-testid="cur"]');
  const monthLabel = document.querySelector('[data-testid="month-label"]');
  const grid = document.querySelector('[data-testid="grid"]');
  const dateOut = document.querySelector('[data-testid="date-out"]');
  const nextM = document.querySelector('[data-testid="next-m"]');
  const prevM = document.querySelector('[data-testid="prev-m"]');
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let sel = today;
  const p = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const fmt = (d) => d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  const ym = (d) => d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  cur.textContent = String(today.getDate());
  dateOut.textContent = fmt(today);
  function open() { cal.hidden = false; trigger.setAttribute('aria-expanded', 'true'); render(); }
  function close() { cal.hidden = true; trigger.setAttribute('aria-expanded', 'false'); }
  function render() {
    monthLabel.textContent = ym(view);
    grid.innerHTML = '';
    const startPad = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
    const dim = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let i = 0; i < startPad; i++) {
      const g = document.createElement('span'); g.className = 'ghost'; grid.appendChild(g);
    }
    for (let d = 1; d <= dim; d++) {
      const day = new Date(view.getFullYear(), view.getMonth(), d);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day'; b.dataset.date = iso(day); b.textContent = String(d);
      b.setAttribute('aria-label', fmt(day));
      if (iso(day) === iso(today)) b.classList.add('is-today');
      if (iso(day) === iso(sel)) b.classList.add('selected');
      b.addEventListener('click', () => { sel = day; dateOut.textContent = fmt(day); close(); render(); });
      grid.appendChild(b);
    }
  }
  trigger.addEventListener('click', () => (cal.hidden ? open() : close()));
  nextM.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); });
  prevM.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); });
</script>
</body>
</html>
