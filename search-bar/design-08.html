<!-- Design 08: Dark Spotlight / Foco Oscuro -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Spotlight Search — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b0b0f;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(30px, 7vw, 50px);
    background: linear-gradient(180deg, #131318, #0d0d12);
    border: 1px solid #232330;
    border-radius: 20px;
    box-shadow: 0 0 80px rgba(124, 58, 237, .14);
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4.8vw, 2rem); color: #f5f3ff; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: #8b5cf6; }
  .sub { margin: .4rem 0 2rem; color: #a1a1aa; font-size: .94rem; }
  .lbl { display: block; margin: 0 0 10px; color: #d4d4d8; font-size: .88rem; font-weight: 700; }
  .field { position: relative; }
  .inp {
    width: 100%;
    padding: 16px 48px 16px 20px;
    font-family: inherit; font-size: 1.02rem; color: #fff;
    background: #1c1c26;
    border: 1px solid #2f2f42;
    border-radius: 14px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .inp::placeholder { color: #52525b; }
  .inp:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, .25), 0 0 40px rgba(139, 92, 246, .18); }
  .clr {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: #27273a; color: #c4b5fd;
    border: 1px solid #3a3a55; border-radius: 10px;
    font-size: 1.1rem; cursor: pointer;
    transition: background .15s ease;
  }
  .clr:hover { background: #37375a; }
  .clr:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  .rows { margin-top: 18px; padding: 0; list-style: none; display: grid; gap: 8px; }
  .rows li {
    padding: 13px 16px;
    background: #17171f;
    border: 1px solid #232330;
    border-radius: 12px;
    color: #e4e4e7; font-size: .95rem;
    display: flex; justify-content: space-between; gap: 10px;
    transition: border-color .15s ease;
  }
  .rows li::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #8b5cf6; flex: 0 0 auto; }
  .rows li:hover { border-color: #37375a; }
  .cnt { margin-top: 14px; color: #8b5cf6; font-size: .87rem; font-weight: 700; }
  .hint { margin-top: .4rem; color: #52525b; font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #232330; color: #52525b; font-size: .78rem; }
  .credit a { color: #a78bfa; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <h1>Dark <span>Spotlight</span></h1>
  <p class="sub">Search the shelf, mid-night / Busca el estante a medianoche</p>
  <label class="lbl" data-testid="label" for="sb-ds-08">Find a book</label>
  <div class="field">
    <input class="inp" data-testid="search" id="sb-ds-08" type="search" placeholder="Search titles…" autocomplete="off">
    <button type="button" class="clr" data-testid="clear" aria-label="Clear search">×</button>
  </div>
  <ul class="rows" data-testid="results"></ul>
  <p class="cnt" data-testid="count"></p>
  <p class="hint">Press Esc to clear / Pulsa Esc para limpiar</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const DATA = ['Call Me by Your Name', 'Catch-22', 'Crime and Punishment', 'Dune', 'Hamlet', 'Lolita', 'Moby Dick', 'Odyssey', 'Slaughterhouse', 'Ulysses'];
  const input = document.querySelector('[data-testid="search"]');
  const list = document.querySelector('[data-testid="results"]');
  const count = document.querySelector('[data-testid="count"]');
  const clear = document.querySelector('[data-testid="clear"]');
  function render(q) {
    const ql = q.toLowerCase();
    const hits = ql ? DATA.filter((t) => t.toLowerCase().includes(ql)) : DATA;
    list.textContent = '';
    for (const t of hits) { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); }
    count.textContent = hits.length + ' results';
    clear.hidden = !ql;
  }
  input.addEventListener('input', () => render(input.value));
  clear.addEventListener('click', () => { input.value = ''; render(''); input.focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.activeElement === input) { input.value = ''; render(''); }
  });
  render('');
</script>
</body>
</html>
