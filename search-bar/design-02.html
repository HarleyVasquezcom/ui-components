<!-- Design 02: Minimal Underline / Subrayado Mínimo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Underline Search — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Georgia", "Times New Roman", serif;
    background: #faf7f2;
    overflow-x: hidden;
  }
  .stage {
    width: min(520px, 94vw);
    padding: clamp(34px, 8vw, 60px);
    background: #fffdfa;
    border: 1px solid #ece5d8;
    border-radius: 4px;
  }
  h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.3rem); color: #2d2a24; font-weight: 400; letter-spacing: .01em; }
  .sub { margin: .5rem 0 2.4rem; color: #9a9183; font-size: .94rem; }
  .lbl { display: block; margin: 0 0 8px; color: #4a443a; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .field { position: relative; }
  .inp {
    width: 100%;
    padding: 10px 40px 10px 2px;
    font-family: inherit; font-size: 1.15rem; color: #2d2a24;
    background: transparent;
    border: none;
    border-bottom: 1px solid #d8cfc0;
    outline: none;
  }
  .inp::placeholder { color: #b9b0a2; font-style: italic; }
  .inp:focus { border-bottom-color: #b08d4f; }
  .inp:focus-visible { outline: 3px solid rgba(176, 141, 79, .35); outline-offset: 6px; }
  .clr {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px;
    border: none; background: transparent;
    color: #b08d4f; font-size: 1.3rem; cursor: pointer;
    border-radius: 50%;
  }
  .clr:hover { background: #f3ecdf; }
  .clr:focus-visible { outline: 2px solid #b08d4f; outline-offset: 2px; }
  .rows { margin-top: 22px; padding: 0; list-style: none; }
  .rows li {
    padding: 13px 2px;
    border-bottom: 1px dashed #e8e0d2;
    color: #3b362e; font-size: 1.02rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .rows li::after { content: "→"; color: #cbb27e; font-size: .9rem; }
  .cnt { margin-top: 16px; color: #9a9183; font-size: .85rem; }
  .hint { margin-top: .4rem; color: #b9b0a2; font-size: .82rem; }
  .credit { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid #ece5d8; color: #b9b0a2; font-size: .8rem; }
  .credit a { color: #8a6a35; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <h1>Minimal Underline</h1>
  <p class="sub">Quiet editorial search / Búsqueda editorial silenciosa</p>
  <label class="lbl" data-testid="label" for="sb-mu-02">Find a product</label>
  <div class="field">
    <input class="inp" data-testid="search" id="sb-mu-02" type="search" placeholder="Type…" autocomplete="off">
    <button type="button" class="clr" data-testid="clear" aria-label="Clear search">×</button>
  </div>
  <ul class="rows" data-testid="results"></ul>
  <p class="cnt" data-testid="count"></p>
  <p class="hint">Press Esc to clear / Pulsa Esc para limpiar</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const DATA = ['Canvas', 'Camera', 'Cactus', 'Cacao', 'Chair', 'Cup', 'Desk', 'Lamp', 'Rug', 'Vase'];
  const input = document.querySelector('[data-testid="search"]');
  const list = document.querySelector('[data-testid="results"]');
  const count = document.querySelector('[data-testid="count"]');
  const clear = document.querySelector('[data-testid="clear"]');
  function render(q) {
    const ql = q.toLowerCase();
    const hits = ql ? DATA.filter((t) => t.toLowerCase().includes(ql)) : DATA;
    list.textContent = '';
    for (const t of hits) { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); }
    count.textContent = hits.length + ' results';
    clear.hidden = !ql;
  }
  input.addEventListener('input', () => render(input.value));
  clear.addEventListener('click', () => { input.value = ''; render(''); input.focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.activeElement === input) { input.value = ''; render(''); }
  });
  render('');
</script>
</body>
</html>
