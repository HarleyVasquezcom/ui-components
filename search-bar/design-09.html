<!-- Design 09: Editor Search / Búsqueda Editor -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Search — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #20222a;
    overflow-x: hidden;
  }
  .stage {
    width: min(600px, 94vw);
    padding: 0;
    background: #2b2d37;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
  }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #343743; border-bottom: 4px solid #f59e0b; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .dot.r { background: #f87171; } .dot.y { background: #fbbf24; } .dot.g { background: #34d399; }
  .tabs { display: flex; gap: 4px; flex: 1; }
  .tab { padding: 4px 12px; border-radius: 6px 6px 0 0; font-size: .8rem; color: #9ca3af; }
  .tab.on { background: #2b2d37; color: #f5f5f4; }
  .body { padding: clamp(24px, 5vw, 40px); }
  h1 { margin: 0; font-family: "Cascadia Mono", Consolas, monospace; font-size: clamp(1.2rem, 3.8vw, 1.5rem); color: #fbbf24; font-weight: 700; }
  h1::before { content: "// "; color: #6b7280; }
  .sub { margin: .4rem 0 1.6rem; color: #a1a1aa; font-size: .88rem; }
  .lbl { display: block; margin: 0 0 8px; color: #d1d5db; font-family: "Cascadia Mono", Consolas, monospace; font-size: .78rem; }
  .field { display: flex; align-items: center; gap: 8px; background: #1f2129; border: 2px solid #3f4350; border-radius: 10px; padding: 4px 4px 4px 12px; transition: border-color .2s ease; }
  .field:focus-within { border-color: #f59e0b; }
  .gl { color: #f59e0b; font-family: "Cascadia Mono", Consolas, monospace; user-select: none; }
  .inp {
    flex: 1; min-width: 0;
    padding: 10px 4px;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: .95rem; color: #e5e7eb;
    background: transparent; border: none; outline: none; caret-color: #f59e0b;
  }
  .inp::placeholder { color: #5c616d; }
  .inp:focus-visible { outline: 2px solid rgba(245, 158, 11, .5); outline-offset: 2px; }
  .clr {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: .85rem;
    background: #f59e0b; color: #1f2129;
    border: none; border-radius: 7px; font-weight: 700; cursor: pointer;
  }
  .clr:hover { background: #fbbf24; }
  .clr:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .rows { margin: 20px 0 0; padding: 0; list-style: none; font-family: "Cascadia Mono", Consolas, monospace; }
  .rows li { padding: 12px 14px; color: #cbd5e1; font-size: .92rem; display: flex; gap: 14px; align-items: center; border-left: 3px solid transparent; }
  .rows li::before { content: "○"; color: #6b7280; }
  .rows li:hover { background: #262834; border-left-color: #f59e0b; }
  .cnt { margin-top: 16px; color: #6b7280; font-family: "Cascadia Mono", Consolas, monospace; font-size: .84rem; }
  .hint { margin-top: .4rem; color: #565b66; font-family: "Cascadia Mono", Consolas, monospace; font-size: .78rem; }
  .credit { padding: 14px 16px; border-top: 1px solid #3f4350; color: #565b66; font-size: .78rem; font-family: "Cascadia Mono", Consolas, monospace; }
  .credit a { color: #fbbf24; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <div class="bar" aria-hidden="true">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <div class="tabs"><span class="tab on">symbols.js</span></div>
  </div>
  <div class="body">
    <h1>Editor Search</h1>
    <p class="sub">Find a symbol in the workspace / Encuentra un símbolo en el espacio de trabajo</p>
    <label class="lbl" data-testid="label" for="sb-es-09">// search</label>
    <div class="field">
      <span class="gl" aria-hidden="true">⌕</span>
      <input class="inp" data-testid="search" id="sb-es-09" type="search" placeholder="symbol name…" autocomplete="off" spellcheck="false">
      <button type="button" class="clr" data-testid="clear" aria-label="Clear search">ESC</button>
    </div>
    <ul class="rows" data-testid="results"></ul>
    <p class="cnt" data-testid="count"></p>
    <p class="hint">amber cursor, gray grid / cursor ámbar, rejilla gris</p>
  </div>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const DATA = ['cache', 'camelCase', 'canvas', 'callback', 'cascade', 'catch', 'closure', 'debounce', 'iterate', 'stream'];
  const input = document.querySelector('[data-testid="search"]');
  const list = document.querySelector('[data-testid="results"]');
  const count = document.querySelector('[data-testid="count"]');
  const clear = document.querySelector('[data-testid="clear"]');
  function render(q) {
    const ql = q.toLowerCase();
    const hits = ql ? DATA.filter((t) => t.toLowerCase().includes(ql)) : DATA;
    list.textContent = '';
    for (const t of hits) { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); }
    count.textContent = hits.length + ' results';
    clear.hidden = !ql;
  }
  input.addEventListener('input', () => render(input.value));
  clear.addEventListener('click', () => { input.value = ''; render(''); input.focus(); });
  render('');
</script>
</body>
</html>
