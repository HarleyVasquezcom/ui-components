<!-- Design 05: Glass Overlay / Cristal Overlay -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Overlay Search — Design 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid; place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #312e81 0%, #7c3aed 55%, #db2777 100%);
    overflow-x: hidden;
  }
  .stage {
    width: min(540px, 94vw);
    padding: clamp(30px, 7vw, 48px);
    background: rgba(255, 255, 255, .14);
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 22px;
    backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .3);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.1rem); color: #fff; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2rem; color: rgba(255, 255, 255, .8); font-size: .94rem; }
  .lbl { display: block; margin: 0 0 10px; color: #ecebff; font-size: .9rem; font-weight: 700; }
  .field { position: relative; }
  .inp {
    width: 100%;
    padding: 15px 46px 15px 18px;
    font-family: inherit; font-size: 1rem; color: #fff;
    background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 14px;
    outline: none;
    transition: background .2s ease, box-shadow .2s ease;
  }
  .inp::placeholder { color: rgba(255, 255, 255, .65); }
  .inp:focus { background: rgba(255, 255, 255, .24); box-shadow: 0 0 0 4px rgba(255, 255, 255, .18); }
  .clr {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .22); color: #fff;
    border: 1px solid rgba(255, 255, 255, .4); border-radius: 10px;
    font-size: 1.1rem; cursor: pointer;
  }
  .clr:hover { background: rgba(255, 255, 255, .38); }
  .clr:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .rows { margin-top: 18px; padding: 0; list-style: none; display: grid; gap: 9px; }
  .rows li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 15px;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 14px;
    color: #fff; font-size: .95rem; font-weight: 600;
    backdrop-filter: blur(8px);
  }
  .rows li::before {
    content: ""; width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
  }
  .cnt { margin-top: 15px; color: rgba(255, 255, 255, .85); font-size: .88rem; font-weight: 700; }
  .hint { margin-top: .4rem; color: rgba(255, 255, 255, .65); font-size: .82rem; }
  .credit { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, .25); color: rgba(255, 255, 255, .7); font-size: .78rem; }
  .credit a { color: #e9d5ff; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <h1>Glass Overlay</h1>
  <p class="sub">Frosted find across the app grid / Búsqueda esmerilada en la rejilla de apps</p>
  <label class="lbl" data-testid="label" for="sb-go-05">Find an app</label>
  <div class="field">
    <input class="inp" data-testid="search" id="sb-go-05" type="search" placeholder="Search apps…" autocomplete="off">
    <button type="button" class="clr" data-testid="clear" aria-label="Clear search">×</button>
  </div>
  <ul class="rows" data-testid="results"></ul>
  <p class="cnt" data-testid="count"></p>
  <p class="hint">Blurred panels, vivid core / Paneles difuminados, núcleo vívido</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const DATA = ['Camera', 'Canvas', 'Calendar', 'Chat', 'Chrome', 'Docs', 'Drive', 'Mail', 'Maps', 'Music'];
  const input = document.querySelector('[data-testid="search"]');
  const list = document.querySelector('[data-testid="results"]');
  const count = document.querySelector('[data-testid="count"]');
  const clear = document.querySelector('[data-testid="clear"]');
  function render(q) {
    const ql = q.toLowerCase();
    const hits = ql ? DATA.filter((t) => t.toLowerCase().includes(ql)) : DATA;
    list.textContent = '';
    for (const t of hits) { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); }
    count.textContent = hits.length + ' results';
    clear.hidden = !ql;
  }
  input.addEventListener('input', () => render(input.value));
  clear.addEventListener('click', () => { input.value = ''; render(''); input.focus(); });
  render('');
</script>
</body>
</html>
