<!-- Design 03: Empty State Minimal / Minimalista -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty State — Design 03</title>
<style>
html{overflow-x:hidden !important;width:100vw !important;}

  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#fff;overflow:hidden;overflow-x:hidden}.empty{max-width:320px;margin:80px auto;padding:2rem;background:#fafafa;border-radius:8px;text-align:center; position: relative}.empty-icon{width:48px;height:48px;margin:0 auto 1rem;background:#e2e8f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem}.empty-title{font-size:1.25rem;font-weight:600;margin-bottom:.5rem;color:#0f172a}.empty-desc{color:#64748b;margin-bottom:1.5rem}.cta{display:inline-block;padding:10px 20px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none}.credit{margin-top:24px;padding:8px 0;border-top:1px solid #e5e7eb;color:#64748b;font-size:.65rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}html, body{ overflow-x: hidden; } </style>
</head>
<body><div class="empty" data-testid="empty" aria-label="Empty state"><div class="empty-icon">📋</div><h2 class="empty-title">No hay datos</h2><p class="empty-desc">No hay elementos para mostrar. Intenta con otros criterios de búsqueda.</p><a class="cta" href="/">Volver a buscar</a></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><div class="empty-label" data-testid="label">No hay datos</div>
</body></html>
