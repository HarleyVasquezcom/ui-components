<!-- Design 04: Empty State with Illustration / Con Ilustración -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty State — Design 04</title>
<style>
html{overflow-x:hidden !important;width:100vw !important;}

  *{box-sizing:border-box}html,body{min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;background:#1e293b;overflow:hidden;overflow-x:hidden}.empty{max-width:400px;margin:80px auto;text-align:center; position: relative; }.empty-label{position:absolute;bottom:-24px;color:#64748b;font-size:.75rem;text-align:center;width:100%}.empty-icon{width:80px;height:80px;margin:0 auto 2rem;border:2px solid #334155;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff}.empty-title{font-size:1.5rem;font-weight:600;margin-bottom:.5rem;color:#e2e8f0}.empty-desc{color:#64748b;margin-bottom:2rem}.cta{display:inline-block;padding:12px 24px;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none}.credit{margin-top:32px;padding:12px 0;border-top:1px solid #334155;color:#64748b;font-size:.75rem;text-align:center}.credit a{color:#2563eb;text-decoration:none}html, body{ overflow-x: hidden; } </style>
</head>
<body><div class="empty" data-testid="empty" aria-label="Empty state"><div class="empty-icon">📋</div><h2 class="empty-title">No hay datos</h2><p class="empty-desc">No hay elementos para mostrar. Intenta con otros criterios de búsqueda.</p><a class="cta" href="/">Volver a buscar</a></div><footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer><div class="empty-label" data-testid="label">No hay datos</div>
</body></html>
