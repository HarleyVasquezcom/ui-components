<!-- Design 09: Infinite Scroll con Tarjetas de Perfiles / User Profile Cards Infinite Scroll -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Scroll — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #fff;
    color: #1e293b;
    overflow-x: hidden;
  }
  .grid { width: min(95vw, 1200px); margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
  .card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .2s;
  }
  .card:hover { transform: translateY(-4px); }
  .card-img { width: 100%; height: 160px; background: #e2e8f0; position: relative; }
  .card-img::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: .75rem; }
  .card-content { padding: 16px; }
  .card h4 { margin: 0 0 4px; font-size: .875rem; color: #1e293b; }
  .card p { margin: 0; color: #64748b; font-size: .75rem; line-height: 1.4; }
  .load-more {
    width: min(200px, 95vw);
    margin: 32px auto 0;
    padding: 12px;
    background: #1e293b;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: .875rem;
    font-weight: 600;
    cursor: pointer;
    display: block;
    text-align: center;
  }
  .load-more:focus-visible { outline: 3px solid #64748b; outline-offset: 2px; }
  .load-more:disabled { background: #64748b; cursor: not-allowed; }
  .credit { margin-top: 32px; padding: 16px 0; border-top: 1px solid #e2e8f0; color: #64748b; font-size: .875rem; text-align: center; }
  .credit a { color: #2563eb; text-decoration: none; }
  @media (max-width: 480px) { .grid { padding: 0 8px; } }
</style>
</head>
<body>
<div class="grid" data-scroll-container data-testid="infinite-scroll" aria-label="Infinite scroll">
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Harley V.</h4><p>Desarrollo Web Full Stack</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Diana M.</h4><p>Diseño Gráfico Senior</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Juan S.</h4><p>Especialista SEO</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Maria R.</h4><p>Community Manager</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Alex K.</h4><p>Arquitecto de Software</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Sarah T.</h4><p>Product Designer</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Miguel L.</h4><p>DevOps Engineer</p></article>
  <article class="card"><div class="card-img"></div><div class="card-content"><h4>Elena P.</h4><p>Data Scientist</p></article>
</div>
<button class="load-more" aria-label="Cargar más artículos" data-load-more>Cargar más <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
<script>
  (() => {
    const button = document.querySelector('[data-load-more]');
    const container = document.querySelector('[data-scroll-container]');
    let loaded = 8;
    let total = 40;
    button.addEventListener('click', () => {
      const fragment = document.createDocumentFragment();
      const names = ['Harley V.','Diana M.','Juan S.','Maria R.','Alex K.','Sarah T.','Miguel L.','Elena P.'];
      const roles = ['Desarrollo Web Full Stack','Diseño Gráfico Senior','Especialista SEO','Community Manager','Arquitecto de Software','Product Designer','DevOps Engineer','Data Scientist'];
      for (let i = loaded; i < Math.min(loaded + 8, total); i++) {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<div class="card-img" style="background: #e2e8f0;"></div><div class="card-content"><h4>${names[i % names.length]}</h4><p>${roles[i % roles.length]}</p></article>`;
        fragment.appendChild(card);
      }
      container.appendChild(fragment);
      loaded += 8;
      if (loaded >= total) { button.textContent = 'No hay más'; button.disabled = true; }
    });
  })();
</script>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>

<script>
(function(){
  var grid = document.querySelector('[data-testid="infinite-scroll"]');
  var btn = document.querySelector('[data-load-more]');
  if(!grid || !btn) return;
  window.addEventListener('scroll', function(){
    if(btn.disabled) return;
    var rect = grid.getBoundingClientRect();
    if(rect.bottom <= window.innerHeight + 200) btn.click();
  });
})();
</script>
</body>
</html>
