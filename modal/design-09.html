<!-- Design 09: Badge Modal / Badge Modal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #1e293b;
    color: #f1f5f9;
    overflow-x: hidden;
  }
  .modal-overlay { position: fixed; inset: 0; background: #3b82f6; display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: #fff; border-radius: 12px; padding: 32px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 25px 50px rgba(59,130,246,0.3); animation: fadeIn .3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #2563eb; }
  .modal-title { font-size: 1rem; font-weight: 600; color: #1e293b; }
  .modal-close { width: 28px; height: 28px; background: transparent; border: none; color: #64748b; font-size: 1.25rem; cursor: pointer; }
  .modal-close:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .modal-body { color: #64748b; font-size: .75rem; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }
  .modal-action { padding: 8px 16px; border-radius: 6px; font-size: .75rem; font-weight: 500; cursor: pointer; transition: background .2s; }
  .modal-action--primary { background: #3b82f6; color: #fff; }
  .modal-action--primary:hover { background: #2563eb; }
  .modal-action--cancel { background: #fff; color: #1e293b; border: 1px solid #334155; }
  .modal-action--cancel:hover { background: #334155; }
  .modal-action:focus-visible { outline: 2px solid #64748b; outline-offset: 2px; }
  .credit { margin-top: 24px; padding: 12px 0; border-top: 1px solid #334155; color: #64748b; font-size: .75rem; text-align: center; }
  .credit a { color: #64748b; text-decoration: none; }
  @media (max-width: 480px) { .modal { margin: 10px; padding: 20px; } }
</style>
</head>
<body>
<div class="modal-overlay" data-modal data-testid="modal-dialog">
  <div class="modal" data-testid="modal" role="dialog" aria-label="Confirm action" data-testid="modal-dialog">
    <div class="modal-header" data-testid="modal-dialog">
      <span class="modal-title">Changes saved</span>
      <button class="modal-close" aria-label="Close modal"> data-testid="modal-close"&times;</button>
    </div>
    <div class="modal-body" data-testid="modal-dialog">Your changes have been saved. Continue to dashboard?</div>
    <div class="modal-actions" data-testid="modal-dialog">
      <button class="modal-action modal-action--cancel">No thanks</button>
      <button class="modal-action modal-action--primary">Go to dashboard</button>
    </div>
  </div>
</div>
<footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</body>
</html>
<script>(()=>{const d=document.querySelector('[data-testid="modal-dialog"],.modal');const c=document.querySelector('[data-testid="modal-close"],[data-close],#close,[aria-label*="Cerrar"],[aria-label*="Close"]');if(c){c.addEventListener('click',()=>{if(d){d.style.display='none';d.setAttribute('aria-hidden','true')}})}if(d&&d.classList.contains('open')===false&&d.style.display===''&&d.getAttribute('aria-hidden')!=='true'){d.classList.add('open')}})();</script>
