<!-- Design 09: Icon Square / Cuadro Icono -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Square — Design 09</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #292524;
    overflow-x: hidden;
  }
  .stage {
    width: min(480px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #fafaf9; border-radius: 10px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .55);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #44403c; font-weight: 800; }
  .sub { margin: .4rem 0 2.2rem; color: #a8a29e; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 20px; color: #57534e; font-size: .92rem; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .btn {
    width: 52px; height: 52px;
    border: 2px solid #d6d3d1; border-radius: 10px;
    background: #ffffff; color: #57534e;
    font-size: 1.4rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { border-color: #a8a29e; background: #f5f5f4; }
  .btn:active { background: #e7e5e4; }
  .btn:focus-visible { outline: 3px solid #78716c; outline-offset: 2px; }
  .btn[aria-label="Increase"] svg, .btn[aria-label="Decrease"] svg { display: block; margin: auto; }
  .inp {
    width: 96px; height: 52px;
    text-align: center;
    font-family: inherit; font-size: 1.35rem; font-weight: 700; color: #292524;
    background: #ffffff; border: 2px solid #d6d3d1; border-radius: 10px;
  }
  .inp:focus-visible { outline: 3px solid #78716c; outline-offset: 1px; }
  .out { margin-top: 20px; color: #a8a29e; font-size: .88rem; }
  .out b { color: #44403c; font-size: 1.15rem; }
  .hint { margin-top: 2rem; color: #d6d3d1; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #e7e5e4; color: #d6d3d1; font-size: .78rem; }
  .credit a { color: #78716c; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Icon Square</h1>
  <p class="sub">Neutral, bordered, clear / Neutro, con borde, claro</p>
  <label class="lbl" data-testid="label" id="lbl-st09" for="inp-st09">Amount</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn" data-testid="dec" aria-label="Decrease">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="7" width="12" height="2" fill="currentColor"/></svg>
    </button>
    <input id="inp-st09" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Amount" value="5">
    <button type="button" class="btn" data-testid="inc" aria-label="Increase">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="7" y="2" width="2" height="12" fill="currentColor"/><rect x="2" y="7" width="12" height="2" fill="currentColor"/></svg>
    </button>
  </div>
  <p class="out"><span>Total</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">Stone tones, clean squares / Tonos piedra, cuadros limpios</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
