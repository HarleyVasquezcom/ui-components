<!-- Design 08: Mono Counter / Contador Mono -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mono Counter — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Courier New", monospace;
    background: #111111;
    overflow-x: hidden;
  }
  .stage {
    width: min(480px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #0a0a0a; border-radius: 0;
    border: 1px solid #262626;
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 5vw, 1.8rem); color: #e5e5e5; font-weight: 700; }
  .sub { margin: .4rem 0 2.2rem; color: #737373; font-size: .88rem; }
  .lbl { display: block; margin: 0 0 20px; color: #a3a3a3; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .btn {
    width: 44px; height: 44px;
    border: 1px solid #404040; border-radius: 4px;
    background: #171717; color: #e5e5e5;
    font-family: inherit; font-size: 1.2rem;
    cursor: pointer;
  }
  .btn:hover { background: #262626; }
  .btn:active { background: #404040; }
  .btn:focus-visible { outline: 2px solid #a3a3a3; outline-offset: 2px; }
  .inp {
    width: 100px; height: 64px;
    text-align: center;
    font-family: inherit; font-size: 1.9rem; font-weight: 700; color: #e5e5e5;
    background: #000000; border: 2px solid #525252;
  }
  .inp:focus-visible { outline: 2px solid #a3a3a3; outline-offset: 1px; }
  .out { margin-top: 22px; text-align: center; color: #737373; font-size: .8rem; }
  .out b { color: #e5e5e5; font-size: 1.1rem; }
  .hint { margin-top: 2rem; color: #525252; font-size: .8rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #262626; color: #525252; font-size: .76rem; }
  .credit a { color: #d4d4d4; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Mono Counter</h1>
  <p class="sub">TYPEWRITER MODE: ON / MODO MÁQUINA DE ESCRIBIR: ON</p>
  <label class="lbl" data-testid="label" id="lbl-st08" for="inp-st08">Counter</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn" data-testid="dec" aria-label="Decrease">−</button>
    <input id="inp-st08" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Counter" value="5">
    <button type="button" class="btn" data-testid="inc" aria-label="Increase">+</button>
  </div>
  <p class="out"><span>COUNT:</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">Black on black, keys clacking / Negro sobre negro, teclas tecleando</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
