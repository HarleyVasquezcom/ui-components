<!-- Design 06: Bordered Sheet / Hoja con Borde -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordered Sheet — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #172554;
    overflow-x: hidden;
  }
  .stage {
    width: min(480px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #ffffff; border-radius: 8px;
    border: 2px solid #1d4ed8;
    box-shadow: 8px 8px 0 rgba(30, 64, 175, .6);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #1e3a8a; font-weight: 800; }
  .sub { margin: .4rem 0 2.2rem; color: #3b82f6; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 18px; color: #1e3a8a; font-size: .92rem; font-weight: 700; }
  .stepper {
    display: flex; align-items: center;
    border: 2px solid #1d4ed8; border-radius: 8px;
    overflow: hidden;
  }
  .btn {
    width: 52px; height: 52px;
    border: none; border-right: 2px solid #1d4ed8;
    background: #eff6ff; color: #1d4ed8;
    font-size: 1.3rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #dbeafe; }
  .btn:active { background: #bfdbfe; }
  .btn:focus-visible { outline: 3px solid #60a5fa; outline-offset: -3px; }
  .btn-inc { border-right: none; border-left: 2px solid #1d4ed8; }
  .inp {
    flex: 1; height: 52px;
    text-align: center;
    font-family: inherit; font-size: 1.3rem; font-weight: 700; color: #1e3a8a;
    background: #ffffff; border: none;
  }
  .inp:focus-visible { outline: 3px solid #60a5fa; outline-offset: -3px; }
  .out { margin-top: 20px; color: #3b82f6; font-size: .88rem; }
  .out b { color: #1d4ed8; font-size: 1.15rem; }
  .hint { margin-top: 2rem; color: #60a5fa; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 2px solid #dbeafe; color: #60a5fa; font-size: .78rem; }
  .credit a { color: #1d4ed8; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Bordered Sheet</h1>
  <p class="sub">Blue ink, ruled paper / Tinta azul, papel pautado</p>
  <label class="lbl" data-testid="label" id="lbl-st06" for="inp-st06">Items</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn" data-testid="dec" aria-label="Decrease">−</button>
    <input id="inp-st06" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Items" value="5">
    <button type="button" class="btn btn-inc" data-testid="inc" aria-label="Increase">+</button>
  </div>
  <p class="out"><span>Total</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">Checked, ruled, decided / Revisado, pautado, decidido</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
