<!-- Design 01: Classic Plus Minus / Más Menos Clásico -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Plus Minus — Design 01</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0c4a6e;
    overflow-x: hidden;
  }
  .stage {
    width: min(480px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #ffffff; border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #0c4a6e; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #64748b; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 16px; color: #0c4a6e; font-size: .92rem; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .btn {
    width: 48px; height: 48px;
    border: none; border-radius: 10px;
    background: #0284c7; color: #ffffff;
    font-size: 1.4rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #0369a1; }
  .btn:active { background: #075985; }
  .btn:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 2px; }
  .inp {
    width: 90px; height: 48px;
    text-align: center;
    font-family: inherit; font-size: 1.3rem; font-weight: 700; color: #0c4a6e;
    background: #f0f9ff; border: 2px solid #bae6fd; border-radius: 10px;
  }
  .inp:focus-visible { outline: 3px solid #0284c7; outline-offset: 1px; border-color: #0284c7; }
  .out { margin-top: 18px; color: #64748b; font-size: .88rem; }
  .out b { color: #0c4a6e; font-size: 1.1rem; }
  .hint { margin-top: 2rem; color: #94a3b8; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: .78rem; }
  .credit a { color: #0284c7; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Classic Plus Minus</h1>
  <p class="sub">The stepper that started it all / El contador que lo empezó todo</p>
  <label class="lbl" data-testid="label" id="lbl-st01" for="inp-st01">Quantity</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn" data-testid="dec" aria-label="Decrease">−</button>
    <input id="inp-st01" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Quantity" value="5">
    <button type="button" class="btn" data-testid="inc" aria-label="Increase">+</button>
  </div>
  <p class="out"><span>Count</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">No surprises, just counting / Sin sorpresas, solo contar</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
