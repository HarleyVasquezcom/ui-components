<!-- Design 04: Terminal Step / Paso Terminal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Step — Design 04</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Consolas", "Courier New", monospace;
    background: #030603;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(28px, 5vw, 46px);
    background: #0a0f0a; border: 1px solid #122112; border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    overflow: hidden;
  }
  .termbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; margin: -24px -56px 0 0;
    background: #111; border-bottom: 1px solid #33ff66;
    font-size: .75rem; color: #6b7280;
  }
  h1 { margin: 1.4rem 0 .2rem; font-size: clamp(1.4rem, 4.5vw, 1.9rem); color: #33ff66; font-weight: 700; }
  .sub { margin: .3rem 0 2.2rem; color: #4b5563; font-size: .9rem; }
  .lbl { display: block; margin: 0 0 18px; color: #a3b3c2; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .stepper { display: flex; align-items: stretch; gap: 0; }
  .btn {
    width: 56px;
    border: 1px solid #1a2a1a;
    background: #0d140d; color: #33ff66;
    font-family: inherit; font-size: 1.2rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #122112; }
  .btn:active { background: #1a2a1a; }
  .btn:focus-visible { outline: 2px solid #33ff66; outline-offset: -2px; }
  .btn-dec { border-right: none; }
  .btn-inc { border-left: none; }
  .inp {
    width: 96px; height: 56px;
    text-align: center;
    font-family: inherit; font-size: 1.3rem; font-weight: 700; color: #33ff66;
    background: #060a06; border: 1px solid #1a2a1a;
  }
  .inp:focus-visible { outline: 2px solid #33ff66; outline-offset: -2px; }
  .out { margin-top: 18px; color: #4b5563; font-size: .86rem; }
  .out b { color: #33ff66; font-size: 1.2rem; }
  .hint { margin-top: 2rem; color: #1f3d1f; font-size: .8rem; }
  .credit { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px solid #161e16; color: #4b5563; font-size: .76rem; }
  .credit a { color: #33ff66; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <div class="termbar" aria-hidden="true">
    <span><b>bash</b> — ui-kit v1.0</span>
    <span>● ● ●</span>
  </div>
  <h1>Terminal Step</h1>
  <p class="sub">$ count --qty 5 / $ contar --cant 5</p>
  <label class="lbl" data-testid="label" id="lbl-st04" for="inp-st04">Quantity</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn btn-dec" data-testid="dec" aria-label="Decrease">−</button>
    <input id="inp-st04" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Quantity" value="5">
    <button type="button" class="btn btn-inc" data-testid="inc" aria-label="Increase">+</button>
  </div>
  <p class="out"><span>$ count:</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">Ctrl, alt, count / Ctrl, alt, contar</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
