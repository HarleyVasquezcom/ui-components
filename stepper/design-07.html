<!-- Design 07: Gradient Buttons / Botones Degradados -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Buttons — Design 07</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0f172a;
    overflow-x: hidden;
  }
  .stage {
    width: min(480px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #1e293b; border-radius: 24px;
    border: 1px solid #334155;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #c7d2fe; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #818cf8; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 22px; color: #c7d2fe; font-size: .92rem; font-weight: 700; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .btn {
    width: 54px; height: 54px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #6366f1, #a21caf);
    color: #ffffff;
    font-size: 1.4rem; font-weight: 700;
    box-shadow: 0 8px 20px rgba(99, 102, 241, .45);
    cursor: pointer;
  }
  .btn:hover { background: linear-gradient(135deg, #4f46e5, #86198f); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
  .inp {
    width: 86px; height: 58px;
    text-align: center;
    font-family: inherit; font-size: 1.4rem; font-weight: 800; color: #f5f3ff;
    background: #0f172a; border: 2px solid #4f46e5; border-radius: 14px;
  }
  .inp:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 1px; }
  .out { margin-top: 22px; color: #818cf8; font-size: .88rem; }
  .out b { color: #c7d2fe; font-size: 1.15rem; }
  .hint { margin-top: 2rem; color: #6366f1; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #334155; color: #6366f1; font-size: .78rem; }
  .credit a { color: #a5b4fc; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Gradient Buttons</h1>
  <p class="sub">Indigo magic on dark glass / Magia índigo en vidrio oscuro</p>
  <label class="lbl" data-testid="label" id="lbl-st07" for="inp-st07">Level</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn" data-testid="dec" aria-label="Decrease">−</button>
    <input id="inp-st07" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Level" value="5">
    <button type="button" class="btn" data-testid="inc" aria-label="Increase">+</button>
  </div>
  <p class="out"><span>Setting</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">Ink and spectrum / Tinta y espectro</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
