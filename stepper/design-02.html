<!-- Design 02: Pill Adjacent / Píldora Adyacente -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill Adjacent — Design 02</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #064e3b;
    overflow-x: hidden;
  }
  .stage {
    width: min(480px, 94vw);
    padding: clamp(34px, 7vw, 54px);
    background: #ecfdf5; border-radius: 24px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); color: #064e3b; font-weight: 800; letter-spacing: -.02em; }
  .sub { margin: .4rem 0 2.2rem; color: #10b981; font-size: .95rem; }
  .lbl { display: block; margin: 0 0 16px; color: #064e3b; font-size: .92rem; font-weight: 700; }
  .stepper { display: flex; align-items: center; }
  .btn {
    width: 52px; height: 52px;
    border: none;
    background: #10b981; color: #ffffff;
    font-size: 1.4rem; font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #059669; }
  .btn:active { background: #047857; }
  .btn:focus-visible { outline: 3px solid #34d399; outline-offset: 2px; }
  .btn-dec { border-radius: 26px 0 0 26px; }
  .btn-inc { border-radius: 0 26px 26px 0; }
  .inp {
    width: 92px; height: 52px;
    text-align: center;
    font-family: inherit; font-size: 1.3rem; font-weight: 700; color: #064e3b;
    background: #ffffff; border: 2px solid #a7f3d0; border-left: none; border-right: none;
  }
  .inp:focus-visible { outline: 3px solid #10b981; outline-offset: -3px; }
  .out { margin-top: 18px; color: #059669; font-size: .88rem; }
  .out b { color: #064e3b; font-size: 1.1rem; }
  .hint { margin-top: 2rem; color: #6ee7b7; font-size: .82rem; }
  .credit { margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #a7f3d0; color: #6ee7b7; font-size: .78rem; }
  .credit a { color: #059669; text-decoration: none; }
</style>
</head>
<body>
<main class="stage">
  <h1>Pill Adjacent</h1>
  <p class="sub">One capsule, one motion / Una cápsula, un movimiento</p>
  <label class="lbl" data-testid="label" id="lbl-st02" for="inp-st02">Servings</label>
  <div class="stepper" data-testid="stepper">
    <button type="button" class="btn btn-dec" data-testid="dec" aria-label="Decrease">−</button>
    <input id="inp-st02" class="inp" data-testid="input" type="text" inputmode="numeric" maxlength="2" aria-label="Servings" value="5">
    <button type="button" class="btn btn-inc" data-testid="inc" aria-label="Increase">+</button>
  </div>
  <p class="out"><span>Count</span> <b data-testid="value" aria-live="polite">5</b></p>
  <p class="hint">Seamless, rounded, friendly / Fluido, redondeado, amable</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const inp = document.querySelector('[data-testid="input"]');
  const val = document.querySelector('[data-testid="value"]');
  const inc = document.querySelector('[data-testid="inc"]');
  const dec = document.querySelector('[data-testid="dec"]');
  let n = 5;
  const clamp = (x) => Math.max(0, Math.min(10, Math.round(x)));
  function render() { inp.value = String(n); val.textContent = String(n); }
  inc.addEventListener('click', () => { n = clamp(n + 1); render(); });
  dec.addEventListener('click', () => { n = clamp(n - 1); render(); });
  inp.addEventListener('input', () => {
    n = clamp(parseInt(inp.value, 10) || 0);
    render();
  });
  render();
</script>
</body>
</html>
