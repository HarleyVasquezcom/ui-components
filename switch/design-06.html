<!-- Design 06: Feather Outline / Pluma de Contorno -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feather Outline Switch — Design 06</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f8f6f2;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(30px, 7vw, 64px);
    background: #f8f6f2;
    border-radius: 34px;
    box-shadow: 0 30px 80px rgba(120,100,60,.12);
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); color: #2e2b24; font-weight: 300; letter-spacing: .1em; }
  .sub { margin: .4rem 0 2.8rem; color: #a2998a; font-size: .9rem; }
  .sw {
    position: relative;
    width: 88px; height: 44px;
    background: transparent;
    border: 1.5px solid #cfc6b4;
    border-radius: 999px;
    cursor: pointer;
    padding: 0;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .sw .track { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; }
  .sw .feather {
    position: absolute; top: 50%; left: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    transform: rotate(0deg);
    transition: transform .35s cubic-bezier(.6,0,.3,1);
  }
  .sw .feather svg {
    width: 100%; height: 100%;
    stroke: #8d836d;
    stroke-width: 1.6;
    fill: rgba(141,131,109,.12);
    transition: fill .3s ease;
  }
  .sw .words {
    position: absolute; top: 50%; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 14px;
    transform: translateY(-50%);
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase;
    color: #b8ae9c;
    pointer-events: none;
    transition: color .3s ease;
  }
  .sw.on { border-color: #5f8f6f; box-shadow: 0 0 22px rgba(95,143,111,.2); }
  .sw.on .feather { transform: rotate(180deg); }
  .sw.on .feather svg { fill: rgba(95,143,111,.28); stroke: #5f8f6f; }
  .sw.on .words { color: #5f8f6f; }
  .sw:focus-visible { outline: 2px solid #5f8f6f; outline-offset: 5px; }
  .caption { margin-top: 20px; font-size: .9rem; color: #a2998a; }
  .caption b { color: #2e2b24; font-family: Georgia, serif; font-style: italic; font-weight: 600; }
  .hint { margin-top: 1.4rem; color: #b8ae9c; font-size: .8rem; }
  .credit { margin-top: 2.4rem; padding-top: 1.1rem; border-top: 1px solid #e7e1d4; color: #b8ae9c; font-size: .78rem; }
  .credit a { color: #5f8f6f; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Feather Outline</h1>
  <p class="sub">As light as a pen stroke / Ligero como un trazo de pluma</p>
  <button type="button" class="sw" data-testid="switch" role="switch" aria-checked="false" aria-label="Toggle silent mode">
    <span class="track" aria-hidden="true">
      <span class="words"><span>off</span><span>on</span></span>
      <span class="feather">
        <svg viewBox="0 0 24 24"><path d="M20 4c-6 1-10 5-12 12l1 1c7-2 11-6 12-13zM5 21c1-4 3-7 7-9"/></svg>
      </span>
    </span>
  </button>
  <p class="caption">Silent mode is <b>off</b></p>
  <p class="hint">Click to flip the feather — / Clic para girar la pluma</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const sw = document.querySelector('[data-testid="switch"]');
  const caption = document.querySelector('.caption');
  function render() {
    const on = sw.getAttribute('aria-checked') === 'true';
    sw.classList.toggle('on', on);
    caption.innerHTML = 'Silent mode is <b>' + (on ? 'on' : 'off') + '</b>';
  }
  sw.addEventListener('click', () => {
    const on = sw.getAttribute('aria-checked') === 'true';
    sw.setAttribute('aria-checked', String(!on));
    render();
  });
  render();
</script>
</body>
</html>
