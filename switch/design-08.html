<!-- Design 08: Minimal Slider / Deslizador Mínimo -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Slider Switch — Design 08</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    overflow-x: hidden;
  }
  .stage {
    width: min(560px, 94vw);
    padding: clamp(30px, 6vw, 64px);
    background: #f5f5f5;
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 300; letter-spacing: .16em; color: #111; text-transform: uppercase; }
  .sub { margin: .5rem 0 3rem; color: #9c9c9c; font-size: .85rem; }
  .sw {
    position: relative;
    width: 72px; height: 28px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #c9c9c9;
    cursor: pointer;
    padding: 0;
    transition: border-color .25s ease;
  }
  .sw::before {
    content: "";
    position: absolute; left: 0; top: 50%;
    width: 100%; height: 2px;
    background: #c9c9c9;
    transform: translateY(-50%);
  }
  .knob {
    position: absolute; top: 50%; left: 0;
    width: 18px; height: 18px;
    margin: -9px 0 0 0;
    border-radius: 50%;
    background: #f5f5f5;
    border: 2px solid #111;
    transition: left .28s cubic-bezier(.6,0,.3,1), background .25s ease, border-color .25s ease;
  }
  .sw.on { border-bottom-color: #111; }
  .sw.on::before { background: #111; }
  .sw.on .knob { left: calc(100% - 18px); background: #111; border-color: #111; }
  .sw:focus-visible { outline: 2px solid #111; outline-offset: 6px; }
  .state { margin-top: 26px; font-size: .9rem; letter-spacing: .3em; text-transform: uppercase; color: #9c9c9c; }
  .state b { color: #111; }
  .hint { margin-top: 1.6rem; font-size: .78rem; color: #b4b4b4; letter-spacing: .1em; }
  .credit { margin-top: 2.4rem; padding-top: 1.1rem; border-top: 1px solid #e0e0e0; font-size: .75rem; color: #b4b4b4; }
  .credit a { color: #3a3a3a; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible, [data-testid="toggle"]:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; } </style>
</head>
<body>
<main class="stage">
  <h1>Minimal Slider</h1>
  <p class="sub">Just a line and a knob / Solo una línea y un botón</p>
  <button type="button" class="sw" data-testid="switch" role="switch" aria-checked="false" aria-label="Toggle focus mode">
    <span class="knob" aria-hidden="true"></span>
  </button>
  <p class="state" id="state">mode: <b>OFF</b></p>
  <p class="hint">CLICK TO SLIDE / CLIC PARA DESLIZAR</p>
  <footer class="credit">Harley Vásquez · <a href="https://www.linkedin.com/in/harleyvasquez" target="_blank" rel="noreferrer">linkedin.com/in/harleyvasquez</a></footer>
</main>
<script>
  const sw = document.querySelector('[data-testid="switch"]');
  const state = document.getElementById('state');
  function render() {
    const on = sw.getAttribute('aria-checked') === 'true';
    sw.classList.toggle('on', on);
    state.innerHTML = 'mode: <b>' + (on ? 'ON' : 'OFF') + '</b>';
  }
  sw.addEventListener('click', () => {
    const on = sw.getAttribute('aria-checked') === 'true';
    sw.setAttribute('aria-checked', String(!on));
    render();
  });
  render();
</script>
</body>
</html>
